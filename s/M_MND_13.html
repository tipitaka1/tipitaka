<h1>M_MND_13_마하위유하닛데사 (큰 진영 해설)</h1>
<p>앞 편을 이어받아, 견해를 붙들지 않는 이가 무엇으로 사는지를 밝힌다. 지어내지 않고, 앞세우지 않고, 「이것이 으뜸」이라 하지 않는 이 — 그의 자리가 길게 그려진다. 이제 마하뷰하경에 대한 닛데사를 말한다 — 견해에 눌러앉은 이들은 누구든 「이것만이 진리다」 하며 다툰다; 그들은 모두 비난을 불러들이고, 또 거기서 칭찬도 얻는다. 「견해에 눌러앉은 이들은 누구든」이란. 「어떤 이들이든」이란 모조리 모두, 온갖 방식으로 모두, 남김없이 빠짐없…</p>
