<h1>M_THAG_10_002_에까위하리야 장로의 게송</h1>
<p>홀로 지냄을 즐긴 아소까의 아우 에까위하리야(Ekavihāriya)는 아소까(Asoka) 대왕의 아우 띳사(Tissa) 왕자로, 세존께서 반열반하신 지 이백여 년 뒤 사람이다. 형이 온 잠부디빠의 왕이 되자 부왕의 자리에 앉았다. 사냥길에 숲에서 코끼리가 살라 가지로 부쳐 드리는 가운데 앉으신 요나까 마하담마락키따(Yonakamahādhammarakkhita) 장로를 뵙고, 이어 장로가 허공에 올라 못물 위에 서서 목욕하는 것을 보고 믿음을 내…</p>
