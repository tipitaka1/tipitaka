<h1>M_CP_021_유단자야(유단자야의 출가)</h1>
<p>보살이 왕자 유단자야였을 때의 일이다. 햇볕에 이슬방울이 떨어지는 것을 보고 절박함이 일어, 나라 사람들이 왕위를 맡으라 청하고 온 성이 울부짖는데도 미련 없이 버리고 출가를 청했다. 내가 그지없는 명성을 지닌 왕자 유단자야였을 때, 햇볕에 이슬방울이 떨어지는 것을 보고 절박함이 일었다. 바로 그것을 으뜸으로 삼아 절박함을 키웠다. 어머니와 아버지께 절을 올리고 출가를 청했다. 성안 사람들도 나라 사람들도 두 손 모아 나에게 청했다.</p>
