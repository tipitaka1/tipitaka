<h1>M_MN_043_마하웨달라(교리 문답의 긴)</h1>
<p>이와 같이 나는 들었다. 한때 세존께서는 사왓티의 제따와나, 아나타삔디까 승원에 머무셨다. 그때 마하꼿티까 존자가 저녁 무렵 홀로 앉음에서 일어나 사리뿟따 존자께 다가갔다. 다가가서 사리뿟따 존자와 기쁘게 인사를 나누었다. 기쁘고 정다운 이야기를 나눈 뒤 한쪽에 앉았다. 한쪽에 앉은 마하꼿티까 존자는 사리뿟따 존자에게 이렇게 말했다 — &quot;도반이여, 「지혜 없는 자, 지혜 없는 자」라고 합니다. 도반이여, 어떻게 해서 지혜 없는 자라고 합니까?&quot;</p>
