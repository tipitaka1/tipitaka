<h1>M_ITI_064_둣짜리따(나쁜 행위)</h1>
<p>몸과 말과 마노의 세 가지 나쁜 행위를 드시고, 그것을 짓고 해로운 업을 많이 지은 지혜 없는 자가 지옥에 태어난다고 하신 편이다. 세존께서 이렇게 말씀하셨다. 아라한께서 이렇게 말씀하신 것을 나는 들었다 — 비구들이여, 세 가지 나쁜 행위가 있다. 어떤 셋인가? 몸의 나쁜 행위, 말의 나쁜 행위, 마노의 나쁜 행위이다. 비구들이여, 이것이 그 세 가지 나쁜 행위이다. 세존께서 이 뜻을 말씀하셨다. 그것에 대해 이렇게 말씀하셨다 —</p>
