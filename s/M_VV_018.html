<h1>M_VV_018_다시(하녀의 천궁)</h1>
<p>천상의 숲을 거니는 천신에게 목갈라나 존자가 어떤 업의 과보인지 묻는다. 남의 집 하녀였던 그 천신은 다섯 학습계율을 지켜 얻은 과보를 말하고, 공덕을 지은 이라야 이런 곳에 난다고 맺는다. 신들의 왕 삭까가 아름다운 찟딸라따 숲에서 그러하듯, 그대는 여인들 무리에 둘러싸여 사방을 두루 거니시니, 새벽별처럼 모든 방향을 밝히시는 이여. 무엇으로 그대의 빛이 이러하고, 무엇으로 그대는 여기서 번영합니까? 마음에 드는 온갖 재물이 그대에게 생겨납니…</p>
