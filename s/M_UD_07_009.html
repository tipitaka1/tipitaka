<h1>M_UD_07_009_우다빠나 (우물)</h1>
<p>투나 마을의 바라문 장자들이 세존 일행에게 물을 주지 않으려고 우물을 풀과 겨로 메웠다. 세존께서 아난다 존자에게 세 번 물을 길어 오라 하시자 우물이 스스로 그것을 토해 내고 맑은 물로 넘쳤다. 물이 언제나 있다면 우물이 무슨 소용이겠느냐고 읊으신 편이다.</p>
