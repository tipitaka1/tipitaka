<h1>M_JA_338_투사(쭉정이를 가려내다)</h1>
<p>세존께서 웰루와나에 머무실 때, 아자따삿뚜를 두고 하신 말씀이다. 그가 태에 들었을 때 그 어머니에게 빔비사라 왕의 오른 무릎 피를 마시고 싶은 입덧이 생겼고, 점치는 이들은 「뱃속의 아이가 왕을 죽이고 왕위를 잡을 것입니다」 했다. 왕은 「내 아들이 그리한다면 무슨 허물이겠는가」 하며 제 무릎을 째어 피를 마시게 했고, 왕비가 두 번 배를 눌러 아이를 지우려 하자 막았다. 나기 전부터 아버지의 원수였으므로 「아자따삿뚜」라 이름했다. 뒷날 세존…</p>
