<h1>M_CP_011_마뚜뽀사까(어머니 봉양 코끼리)</h1>
<p>어머니를 봉양하는 코끼리로 태어난 보살이 사람에게 붙잡혀 우리에 갇히고도 계가 깨질까 하여 성내지 않은 일을 말하는 편이다. 계를 다루는 둘째 품 「핫티나가(코끼리) 품」의 첫 편이다. 내가 숲에서 어머니를 봉양하는 코끼리였을 때 덕으로 나와 같은 이가 땅 위에 없었다. 숲을 다니는 이가 나를 보고 왕에게 알렸다. &quot;대왕이시여, 왕께 어울리는 코끼리가 숲에 삽니다. 그를 잡는 데는 울타리도 함정 구덩이도 쓸 일이 없습니다.</p>
