<h1>M_SNP_02_010_웃타나(일어나 앉으라)</h1>
<p>자리에서 일어나 앉으라고, 화살에 찔려 괴로운 이에게 잠이 무슨 소용이냐고 다그치는 짧은 편이다. 죽음의 왕이 방일한 이를 알아보고 끌고 가기 전에 기회를 놓치지 말라고 이른다. 일어나라, 앉으라. 잠들어 그대들에게 무슨 이익이 있는가. 화살에 찔려 괴로워하는 병든 이들에게 잠이 다 무엇인가. 일어나라, 앉으라. 고요함을 위해 굳게 배우라. 죽음의 왕이 그대들의 방일함을 알고 홀려 제 뜻대로 끌고 가지 못하게 하라. 신들도 사람들도 그것에 매여…</p>
