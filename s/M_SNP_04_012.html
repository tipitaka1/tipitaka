<h1>M_SNP_04_012_쭐라뷰하(작은 진리 다툼)</h1>
<p>저마다 제 견해에 눌러앉아 자기만 능하고 남은 어리석다 하는 이들을 두고, 무엇이 진리인지 따지는 편이다. 진리는 하나뿐인데 사문들이 저마다 다른 진리를 내세우는 까닭을 밝히고, 판단에 서서 자기를 잣대로 삼는 데서 다툼이 온다고 이른다. 다음 편 마하뷰하와 짝을 이룬다. 저마다 제 견해에 눌러앉아, 다투며 저마다 자기가 능하다고 한다. &quot;이렇게 아는 이라야 법을 안 것이니, 이를 물리치는 자는 온전하지 못하다.&quot;</p>
