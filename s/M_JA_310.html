<h1>M_JA_310_세이야(제관 자리를 물리치다)</h1>
<p>세존께서 제따와나에 머무실 때 싫증이 난 비구를 두고 하신 말씀이다. 그는 사왓티에서 걸식하다 잘 꾸민 아름다운 여인을 보고 싫증이 나 가르침에 즐거워하지 않았다. 세존께서 「어찌 이런 벗어남으로 이끄는 가르침에 출가하여 싫증을 내는가. 옛 현자들은 제관 자리를 주어도 물리치고 출가했다」 하시고 옛일을 드셨다. 옛날 바라나시에서 보살은 제관의 아내 태에 들어 왕자와 같은 날 태어났다. 왕이 그를 데려다 왕자와 함께 기르게 하니 장신구도 먹을 것…</p>
