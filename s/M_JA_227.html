<h1>M_JA_227_구타빠나(코끼리에 덤빈 똥벌레)</h1>
<p>세존께서 제따와나에 머무실 때, 어떤 비구를 두고 하신 말씀이다. 제따와나에서 멀지 않은 마을에 차례 공양이 많았는데, 그곳에 사는 물음쟁이 하나가 오는 젊은 비구와 사미들에게 누가 먹고 누가 마시고 누가 씹느냐 묻고 답하지 못하면 부끄럽게 했다. 그 두려움에 아무도 가지 않았다. 한 비구가 그를 길들여 다시는 보고도 달아나게 하겠다며 나섰다. 마을 어귀에서 옷을 걸치자 그가 달려와 물었다. 비구는 죽을 마시고 회당을 쓸고 밥을 받을 때까지 미…</p>
