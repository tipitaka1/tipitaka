<h1>M_JA_547_08_다라까빱바(두 아이를 내주다)</h1>
<p>그 새벽 맛디는 검은 사내가 제 눈을 뽑고 팔을 자르고 가슴을 열어 심장을 가져가는 꿈을 꾸었다. 보살은 「내 보시의 완성이 채워지겠구나」 알고도 잠자리 탓이라 달래어 보냈다. 맛디가 숲으로 가자 보살은 잎집 앞 돌판에 앉아 청하는 이를 기다렸다. 주자까가 아이들을 청하니 곧 준다 하고 하룻밤 묵어 어미가 꾸며 보낸 뒤 데려가라 하였으나 마다하였다. 겁이 난 아이들은 네모난 못에 들어가 연잎을 쓰고 숨었다. 보살이 부르자 나와 발을 붙들고 울었…</p>
