<h1>M_THAG_01_038_가왐빠띠 장로의 게송</h1>
<p>야사의 네 재가 벗 가운데 한 분 야사(Yasa) 존자의 네 재가 벗 가운데 한 분이다. 야사가 출가했다는 말을 듣고 벗들과 함께 세존께 나아가, 법문이 끝나자 그 자리에서 함께 아라한이 되었다. 앞선 생에 한 아라한께 시리사 나뭇가지로 그늘막을 지어 드린 공덕으로 「세리사까」라 불린 궁전에 났다. 세존께서 큰 승가와 함께 사께따의 안자나 숲에 드셨을 때 잠자리가 모자랐는데, 신통으로 사라부 강물을 멈춰 세운 그 일을 두고 이 게송이 읊어졌다.</p>
