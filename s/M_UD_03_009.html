<h1>M_UD_03_009_십빠(으뜸가는 기술)</h1>
<p>공양을 마치고 모여 앉은 비구들이 어떤 기술이 기술 가운데 으뜸인지를 두고 열두 가지를 들며 이야기한다. 세존께서 오셔서 그런 이야기는 믿음으로 출가한 이에게 마땅하지 않다고 하시고, 기술로 살지 않고 자만을 버리고 홀로 다니는 이가 비구라고 읊으신 편이다.</p>
