<h1>M_THAP_484_붓다산냐까 장로의 아빠다나</h1>
<p>싯닷타 뵈러 가다 길에서 숨진 바라문 싯닷타 부처님께서 세상에 나오셨다는 말을 듣고 제자들을 데리고 뵈러 가다가 길에서 목숨을 마친 바라문 스승의 이야기입니다. 제자들이 아뢰는 말(§5), 스스로 세운 다짐(§6), 제자들에게 이르는 말(§8–§10)이 직접화법으로 이어집니다. 베다를 외우고 주문을 지니고 세 베다에 통달한 이로서 관상학과 전설, 어휘학과 제의학에도 밝았다. 강물이 흐르듯 그때 제자들이 나에게 모여들었다. 나는 밤낮으로 게으르지…</p>
