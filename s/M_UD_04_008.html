<h1>M_UD_04_008_순다리(순다리의 누명)</h1>
<p>세존과 승가가 크게 존경받는 것을 견디지 못한 외도 유행자들이 순다리 유행녀를 제따와나에 드나들게 한 뒤 그녀를 죽여 승원 해자에 던져 놓고 비구들에게 누명을 씌운 일을 전한다. 세존께서는 그 소리가 이레면 사라질 것이라 하시고, 거친 말을 들어도 성내지 않고 견디라는 우다나를 읊으셨다. 이와 같이 나는 들었다. 한때 세존께서 사왓티의 제따와나 아나타삔디까 승원에 머무셨다. 마침 그때 세존께서는 존경받고 존중받고 받들어지고 공양받고 예배받으셨으…</p>
