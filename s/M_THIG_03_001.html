<h1>M_THIG_03_001_아빠라사마 장로니의 게송</h1>
<p>스물다섯 해 만에 평온을 얻은 「또 다른 사마」 꼬삼비의 좋은 집안에 태어나 사마와띠(Sāmāvatī)의 벗이었고, 그가 죽자 절박함이 일어 출가했다. 앞의 사마 장로니와 이름이 같아 「또 다른 사마」라 한다. 출가하고 스물다섯 해가 되도록 마음의 삼매를 얻지 못하다가, 늙은 나이에 선서의 훈계를 받아 위빳사나를 키워 막힘없는 앎과 함께 아라한과를 얻고서 감흥으로 이 게송을 읊었다. 내가 출가한 지 스물다섯 해, 어느 때고 마음의 가라앉음을 얻…</p>
