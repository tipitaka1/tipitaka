<h1>A_PV_015_맛따뻬띠</h1>
<p>「그대는 벌거벗고 흉한 모습이며」 — 이것은 스승께서 제따 숲에 머무실 때 맛따라는 아귀 여인을 두고 말씀하신 것이다. 사왓티에 어떤 살림꾼이 있었는데 믿음이 있고 마음이 맑았다고 한다. 그의 아내는 믿음이 없고 마음이 맑지 않고 화를 잘 내며 아이를 낳지 못하였는데, 이름을 맛따라 하였다. 그래서 그 살림꾼은 집안의 대가 끊길까 두려워 걸맞은 집안에서 띳사라는 다른 처녀를 데려왔다. 그녀는 믿음이 있고 마음이 맑았으며 남편에게 사랑스럽고 마음…</p>
