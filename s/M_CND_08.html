<h1>M_CND_08_난다뿟차닛데사 (난다의 물음 해설)</h1>
<p>「세상에 성자들이 있다고 사람들이 말합니다」로 시작한다. 무엇으로 성자를 알아보는지를 묻는다. 세상에 성자들이 있다고, [난다 존자가 말했다] 사람들이 말합니다. 그것은 어떠합니까; 앎을 갖춘 이를 성자라 합니까, 아니면 사는 방식을 갖춘 이를 성자라 합니까. 「세상에 성자들이 있다고」란. 「있다」란 있고 찾아지고 존재하고 얻어진다는 것이다. 「세상에서」란 악처의 세상에서 …pe… 감각영역의 세상에서이다. 「성자들」이란 성자라는 이름으로 불리는…</p>
