<h1>A_JA_539_마하자나까 본생 주석</h1>
<p>배가 부서진 뒤 이레 낮 이레 밤을 헤엄쳐 끝내 마니메칼라의 손에 건져지는 마하자나까 왕자의 이야기다. 뒤에 미틸라의 왕이 되었다가 망고나무 두 그루를 보고 홀연 출가한다. 정진의 바라밀(vīriyapāramī)을 보이는 편이다. [539] 2. 마하자나까 본생 주석</p>
