<h1>M_CP_007_짠다꾸마라(짠다 왕자의 보시)</h1>
<p>보살이 뿝파와띠 성 에까라자 왕의 아들 짠다 왕자였을 때, 산 목숨을 바치는 제사에서 풀려난 뒤 절박함을 일으켜 큰 보시를 베푼 일을 말한다. 또 내가 뿝파와띠 성에서 에까라자 왕의 몸에서 난 짠다라 불리는 왕자였을 때, 그때 나는 제물이 되기를 면하고 제사 마당에서 나와, 절박함을 일으키고서 큰 보시를 베풀었다. 나는 마시지도 씹지도 않고 밥을 먹지도 않았다. 보시받을 만한 이에게 드리기 전에는 닷새 엿새라도 그러했다.</p>
