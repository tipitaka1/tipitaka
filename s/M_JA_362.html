<h1>M_JA_362_실라위망사(계를 알고 출가하다)</h1>
<p>세존께서 제따와나에 머무실 때 계를 시험한 바라문 하나를 두고 하신 말씀이다. 왕이 그를 계를 갖춘 이라 하여 다른 바라문보다 높이자, 그는 「왕이 나를 계 때문에 높이는가 배움 때문인가」 알아보려고 환전상의 판에서 금화를 사흘 집어 갔다. 셋째 날 도둑으로 잡혀 왕 앞에 끌려가 그 까닭을 밝히고 「이제 배움보다 계가 큼을 알았습니다. 살림살이는 제게 쓸데없으니 출가하겠습니다」 하여 허락을 받았다. 그는 집 문도 돌아보지 않고 제따와나로 가 출…</p>
