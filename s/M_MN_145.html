<h1>M_MN_145_뿐노와다(뿐나에 대한 훈계)</h1>
<p>이와 같이 나는 들었다. 한때 세존께서는 사왓티의 제따와나, 아나타삔디까 승원에 머무셨다. 그때 뿐나(Puṇṇa) 존자가 저녁 무렵 홀로 앉음에서 일어나 세존께 다가갔다. 다가가서 세존께 절을 올리고 한쪽에 앉았다. 한쪽에 앉은 뿐나 존자는 세존께 이렇게 말씀드렸다. …</p>
