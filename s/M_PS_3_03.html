<h1>M_PS_3_03_아비사마야까타 (꿰뚫음의 논의)</h1>
<p>「꿰뚫는다」는 말 하나를 열한 갈래로 뜯는다. 무엇을 꿰뚫는 것이고, 꿰뚫는 그 순간 어느 기능이 으뜸이 되며, 그 자리에 몇 가지 앎이 함께 서는지를 밝힌다. 도의 순간을 가장 가까이 들여다본 편이다. 「꿰뚫음」이라 한다. 무엇으로 꿰뚫는가? 마음으로 꿰뚫는다.</p>
