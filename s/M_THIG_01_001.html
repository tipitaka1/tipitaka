<h1>M_THIG_01_001_안냐따라 장로니의 게송</h1>
<p>이름이 전하지 않는 장로니 이름이 전하지 않는 장로니다. 주석서는 이 자리에서 테리가타 전체의 머리말을 먼저 놓아, 세존께서 디빵까라(Dīpaṅkara) 부처님 발밑에서 큰 서원을 세우고 바라밀을 채워 깨달음에 이르기까지를 길게 풀 뿐, 이 분의 내력은 따로 남기지 않았다. 옷을 지어 두르고 누운 장로니에게 「탐욕이 가라앉았으니 편히 자라」 하고 이르는 게송이다. 편히 자라, 작은 장로니여, 손수 지은 헝겊옷을 두르고. 그대의 탐욕은 가라앉았다…</p>
