<h1>01_용어집</h1>
<p>번역어는 문맥에 따라 흔들리지 않는다. 아래 표에 있는 단어는 어떤 경우에도 그 번역어만 쓴다. 표에 없는데 반복 등장하는 용어를 만나면 임의로 정하지 말고, 번역 끝에 `[신규용어]` 로 표시해 보고한다. 괄호 안은 기존 번역본들의 선택지로, 참고용이다.</p>
