<h1>M_AN_07_03_왓지삿따까(왓지가 쇠하지 않는 법)</h1>
<p>나는 이렇게 들었다 — 한때 세존께서 웨살리의 사란다다 탑에 머무셨다. 그때 여러 릿차위들이 세존께 다가갔다. 다가가서 세존께 절을 올리고 한쪽에 앉았다. 한쪽에 앉은 릿차위들에게 세존께서 이렇게 말씀하셨다 — 「릿차위들이여, 그대들에게 일곱 가지 쇠퇴하지 않는 법을 설하겠다. 그것을 들어라. 잘 마음에 새겨라. 이제 말하겠다.」 「그렇게 하겠습니다, 세존이시여」 하고 릿차위들이 세존께 대답했다. 세존께서 이렇게 말씀하셨다 —</p>
