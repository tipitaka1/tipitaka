<h1>M_THAG_03_011_우빨리 장로의 게송</h1>
<p>율을 지니는 이 가운데 으뜸, 왕자들의 이발사 이발사 집안에 태어나 우빨리(Upāli)라 불렸다. 아누룻다(Anuruddha)를 비롯한 여섯 사꺄 왕자의 이발사였고, 그들이 출가하러 나설 때 함께 나가 함께 출가했다. 숲에 머물기를 청하자 세존께서 「내 곁에 있으면 배움의 짐과 위빳사나의 짐을 다 채우리라」 하셨고, 그 말씀을 받들어 닦아 오래지 않아 아라한이 되었다. 전생에 빠두뭇따라 부처님께 율을 지닌 이들 가운데 으뜸의 자리를 서원했다. …</p>
