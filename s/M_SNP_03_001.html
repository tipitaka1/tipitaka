<h1>M_SNP_03_001_빱밧자(집을 떠나심)</h1>
<p>집을 떠난 그분이 라자가하에서 걸식하는 모습을 본 마가다의 빔비사라 왕이 뒤를 밟게 하고 몸소 찾아가, 군대를 이끌라며 재물을 주겠다고 한다. 그분은 꼬살라의 사끼야 집안에서 나왔으며 감각적 욕망을 바라지 않고 정진하러 간다고 답한다. 출가를 이야기하리라. 눈 있는 분이 어떻게 출가하셨는지, 어떻게 헤아려 보시고 출가를 기꺼이 여기셨는지. 이 재가의 삶은 갑갑하다, 티끌이 이는 자리다. 출가는 탁 트인 하늘이다 — 이렇게 보시고 출가하셨다.</p>
