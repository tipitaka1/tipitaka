<h1>M_VV_023_소나딘나(소나딘나의 포살)</h1>
<p>목갈라나 존자가 눈부신 천신에게 어떤 업의 과보인지 묻는다. 날란다의 청신녀 소나딘나였던 그 천신은 보시와 포살과 다섯 학습계율로 지은 공덕을 답한다. 눈부신 빛으로 서 계신 천녀여, 새벽별처럼 모든 방향을 밝히시는 이여. 무엇으로 그대의 빛이 이러하고, 무엇으로 그대는 여기서 번영합니까? 마음에 드는 온갖 재물이 그대에게 생겨납니까? 큰 위력을 지닌 천녀여, 그대에게 묻습니다. 사람이었을 때 어떤 공덕을 지었기에 무엇으로 그대는 이렇듯 타오르…</p>
