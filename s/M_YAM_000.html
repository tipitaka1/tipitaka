<h1>M_YAM_000_목차 및 개요</h1>
<p>**「쌍(雙)으로 묻는 책」입니다.** 한 짝의 물음을 양쪽으로 던져 개념의 넓이를 확정합니다. &gt; [!info] 어디서부터 읽으면 좋은가 &gt; 한 짝의 물음을 앞뒤로 뒤집어 던지는 책입니다. 분량은 논장의 5분의 1이지만 내용은 그만큼 넓지 않습니다.</p>
