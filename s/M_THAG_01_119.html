<h1>M_THAG_01_119_왓지뿟따 장로의 게송</h1>
<p>어려서부터 벗어남에 마음이 기운 릿차위 웨살리 릿차위 왕자로 태어나 왓지 왕가의 아들이라 왓지뿟따(Vajjiputta)라 불렸다. 어려서 코끼리 다루는 법 따위를 익히던 때부터 벗어남에 마음이 기울어, 세존의 설법 자리에 가 무리 끝에 앉아 법을 듣고 믿음을 얻어 출가했으며 오래지 않아 여섯 신통을 갖추었다. 뒷날 세존께서 반열반하신 지 얼마 되지 않아 법을 합송하기로 약속한 무렵, 아직 배울 것이 남은 아난다(Ānanda)가 큰 무리에 둘러싸…</p>
