<h1>M_JA_295_안따(썩은 소 앞의 아첨꾼)</h1>
<p>세존께서 제따와나에 머무실 때 바로 그 두 사람을 두고 하신 말씀이다. 지금 이야기는 앞의 잠부카다까 편과 같다. 곧 데와닷따와 꼬깔리까가 서로 없는 덕을 말하며 얻어먹고 다닌 일이다. 옛날 바라나시에서 브라흐마닷따가 다스릴 때, 보살은 어느 마을 가까이에서 에란다 나무의 신으로 났다. 그때 한 마을에서 죽은 늙은 소를 끌어내 마을 문 밖 에란다 숲에 버렸다. 자칼 한 마리가 와서 그 고기를 먹었고, 까마귀 한 마리가 와 에란다에 앉았다가 그것…</p>
