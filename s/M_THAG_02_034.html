<h1>M_THAG_02_034_이시딘나 장로의 게송</h1>
<p>전단향 강당을 바치고 예류자가 된 부호 수나빠란따 지방의 부호 집안에 태어나 이시딘나라 불렸다. 세존께 전단향 강당을 바치던 자리에서 신통을 보고 믿음을 얻어, 세존께 법을 듣고 예류자가 되었으나 그대로 집에 머물러 살았다. 그를 딱하게 여긴 신이 다른 이의 일을 빌려 이 게송으로 그를 일깨웠고, 이를 듣고 절박함이 일어 출가해 오래지 않아 아라한이 되었다. 법을 지닌 청신사들을 나는 보았다. 「감각적 욕망은 무상하다」고 말하면서도 보배와 귀걸…</p>
