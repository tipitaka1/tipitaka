<h1>M_THAG_08_003_마하빤타까 장로의 게송</h1>
<p>길에서 난 두 형제의 맏이 마하빤타까(Mahāpanthaka)는 라자가하(Rājagaha) 부호의 딸이 종과 눈이 맞아 달아나서 낳은 두 아들 가운데 맏이다. 길에서 태어났다 하여 빤타까(길)라 이름했고, 쭐라빤타까(Cūḷapanthaka)의 형이다. 옛적 빠두뭇따라 부처님 때 「지각을 돌이키는 데 능한 이 가운데 으뜸」의 자리를 서원하고 그 자리에서 수기를 받았다. 처음 세존을 뵌 일부터 아라한이 되기까지를 스스로 돌아보며 이 게송을 읊었다.</p>
