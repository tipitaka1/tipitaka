<h1>M_AN_06_10_아니상사(여섯 가지 이익)</h1>
<p>비구들이여, 여섯 가지가 세상에 나타나기 어렵다. 어떤 여섯인가? 아라한이며 바르게 깨달으신 여래께서 세상에 나타나기 어렵다. 여래께서 알려 주신 법과 율을 설하는 사람은 세상에서 만나기 어렵고, 성스러운 영역에 태어나기가 세상에서 어렵다. 기능들이 온전하기가 세상에서 어렵다. 어리석지 않고 아둔하지 않기가 세상에서 어렵다. 유익한 법들에 대한 열의를 내기가 세상에서 어렵다. 비구들이여, 이런 여섯 가지가 세상에 나타나기 어렵다. 첫째.</p>
