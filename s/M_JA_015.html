<h1>M_JA_015_카라디야(재주 안 배운 조카 사슴)</h1>
<p>세존께서 제따와나에 머무실 때, 훈계를 받아들이지 않는 한 비구를 두고 하신 말씀이다. 세존께서 사실을 확인하시고 「그대는 전에도 말을 듣지 않아 현자의 훈계를 받지 않고 올가미에 걸려 목숨을 잃었다」 하셨다. 옛날 바라나시에서 브라흐마닷따가 다스릴 때, 보살은 사슴으로 태어나 무리를 거느리고 숲에 살았다. 누이 사슴이 제 아들을 데려와 「오라버니, 이 아이가 그대의 조카이니 사슴의 재주를 가르쳐 달라」 하고 맡겼다. 보살이 올 시각을 정해 주…</p>
