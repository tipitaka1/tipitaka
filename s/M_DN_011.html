<h1>M_DN_011_께왓따(신통보다 가르침)</h1>
<p>이와 같이 나는 들었다. 한때 세존께서 날란다의 빠와리까 망고 숲에 머무셨다. 그때 장자의 아들 께왓따(Kevaṭṭa)가 세존께 다가갔다. 다가가서 세존께 절을 올리고 한쪽에 앉았다. 한쪽에 앉은 장자의 아들 께왓따는 세존께 이렇게 말씀드렸다. &quot;세존이시여, 이 날란다는 넉넉하고 번성하며 사람이 많고 붐비는데 세존께 깊이 깨끗한 믿음을 지녔다. 세존이시여, 세존께서 한 비구에게 분부하시어 인간을 넘어선 법인 신통의 경이를 나투게 해 주시면 좋겠…</p>
