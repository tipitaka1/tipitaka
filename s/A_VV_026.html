<h1>A_VV_026_빠타마빅카다이까</h1>
<p>「눈부신 빛으로」는 빅카다이까 천궁이다. 그 인연은 무엇인가? 세존께서는 사왓티의 제따 숲에 머무셨다. 그때 웃따라마두라에 어떤 여인이 있었는데, 목숨이 다하여 악처에 태어날 이였다. 세존께서는 새벽녘에 큰 연민의 증득에서 일어나 세상을 살펴보시다가 악처에 태어날 그 여인을 보시고, 큰 연민에 마음이 움직여 그를 좋은 곳에 자리 잡게 하시려고 다른 이 없이 홀로 마두라로 가셨다. 가셔서 오전에 옷을 갖추어 입으시고 발우와 가사를 들고 성 밖으로…</p>
