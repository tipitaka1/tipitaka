<h1>A_JA_547_01_웻산따라 본생 주석 ① 열 가지 소원</h1>
<p>보살의 마지막 사람 몸이 된 웻산따라의 이야기가 여기서 시작한다. 이 첫 대목은 풋사띠가 삭까에게 열 가지 소원을 받아 사람 세상에 내려오는 내력이다. 보시의 바라밀(dānapāramī)을 보이는 편이며, 자따까 전체에서 가장 널리 읽힌다. [547] 10. 웻산따라 본생 주석 다사와라까타 주석 「풋사띠여, 빼어난 빛을 지닌 이여」 — 이것은 세존께서 까삘라왓투 곁 니그로다 승원에 머무실 때 연꽃 비를 두고 하신 말씀이다. 세존께서 빼어난 법륜…</p>
