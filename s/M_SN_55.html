<h1>M_SN_55_소따빳띠(예류)</h1>
<p>사왓티에서 있었던 일이다. 거기에서 세존께서…pe… 이렇게 말씀하셨다 — 비구들이여, 전륜성왕이 네 대륙을 주권과 통치로 다스리고 몸이 무너져 죽은 뒤 좋은 곳, 천상 세계에 태어나 따와띵사 신들의 무리에 이르러, 거기 난다나 숲에서 천녀 무리에 둘러싸여 하늘의 다섯 가지 감각적 욕망을 갖추고 누린다 하더라도, 그가 네 가지 법을 갖추지 못했다면 그는 지옥에서 벗어나지 못하고 축생의 모태에서 벗어나지 못하고 아귀의 영역에서 벗어나지 못하고 나쁜…</p>
