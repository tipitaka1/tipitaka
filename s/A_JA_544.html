<h1>A_JA_544_짠다꾸마라 본생 주석</h1>
<p>제관 칸다할라가 왕을 꾀어 제 아들딸까지 제물로 바치게 하고, 짠다꾸마라가 마지막 자리에서 삭까의 손에 구해지는 이야기다. 참음의 바라밀(khantipāramī)을 보인다. [544] 7. 짠다꾸마라 본생 주석 「모진 짓을 하는 왕이 있었다」 — 이것은 세존께서 깃자꾸따에 머무실 때 데와닷따를 두고 하신 말씀이다. 그의 이야기는 승가를 깨뜨리는 일을 다룬 편에 이미 나와 있다. 그가 출가한 때부터 빔비사라 왕이 죽을 때까지의 일은 거기 나온 대…</p>
