<h1>M_THAG_01_043_수망갈라 장로의 게송</h1>
<p>사왓티 가까운 마을의 가난한 집에 나 수망갈라(Sumaṅgala)라 하였다. 낫과 쟁기와 괭이로 농사지어 살았다. 빠세나디(Pasenadi) 왕의 큰 보시 자리에서 비구들이 받는 공경을 보고 「나도 출가하리라」 하여 출가했다. 숲에서 답답해져 환속하려고 친척 마을로 가…</p>
