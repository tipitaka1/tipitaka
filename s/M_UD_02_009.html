<h1>M_UD_02_009_위사카(남에게 매임)</h1>
<p>위사카 미가라마따가 꼬살라의 빠세나디 왕에게 걸린 일이 뜻대로 풀리지 않아 한낮에 세존을 찾아왔다. 세존께서 남에게 매인 것은 모두 괴로움이라고 읊으신 편이다. 이와 같이 나는 들었다. 한때 세존께서 사왓티의 뿝바라마 미가라마따 강당에 머무셨다. 마침 그때 위사카 미가라마따에게 꼬살라의 빠세나디 왕에게 걸린 일이 하나 있었다. 꼬살라의 빠세나디 왕은 그 일을 그녀의 뜻대로 매듭지어 주지 않았다. 그때 위사카 미가라마따가 한낮에 세존께 다가갔다.…</p>
