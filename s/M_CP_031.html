<h1>M_CP_031_깐하디빠야나(디빠야나의 진실)</h1>
<p>보살이 깐하디빠야나 선인이었을 때의 일을 말한다. 뱀에 물려 쓰러진 아이를 살리려고, 제가 오십 년 넘게 마음에 없이 청정한 삶을 살아왔다는 사실을 그대로 밝혀 진실의 다짐을 지었다. 또 내가 깐하디빠야나 선인이었을 때, 오십 년이 넘도록 나는 즐겁지 않은 채로 지냈다. 내 마음이 즐겁지 않은 것을 아무도 알지 못했다. 나는 누구에게도 말하지 않았고, 싫증은 내 마음속을 맴돌았다. 청정한 삶을 함께 닦던 만다뱌는 나의 벗이요 큰 선인이었다.</p>
