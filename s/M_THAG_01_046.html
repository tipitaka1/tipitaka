<h1>M_THAG_01_046_사밋디 장로의 게송</h1>
<p>라자가하의 좋은 집안에 났다. 그가 난 뒤로 집안의 재물이 불었고 몸도 잘생기고 덕도 갖추어, 재물의 넉넉함과 덕의 넉넉함을 함께 일러 사밋디(Samiddhi)라 불렸다. 빔비사라(Bimbisāra) 왕이 세존을 뵙던 자리에서 부처님의 위덕을 보고 믿음을 얻어 출가했다…</p>
