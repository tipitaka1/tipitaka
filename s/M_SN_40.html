<h1>M_SN_40_목갈라나(목갈라나)</h1>
<p>한때 마하목갈라나 존자는 사왓티의 제따와나, 아나타삔디까 승원에 머물렀다. 거기서 마하목갈라나 존자는 비구들에게 말했다 — &quot;도반 비구들이여.&quot; 「도반이여」라고 그 비구들은 마하목갈라나 존자에게 대답했다. 마하목갈라나 존자는 이렇게 말했다 — 도반들이여, 여기 홀로 떨어져 앉아 있던 나에게 이런 생각이 마음에 일어났습니다 — 「첫 번째 선정, 첫 번째 선정」이라고 말한다. 무엇이 첫 번째 선정인가? 도반들이여, 그런 나에게 이런 생각이 들었습니…</p>
