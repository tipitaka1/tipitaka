<h1>M_THAG_01_101_벨랏타니까 장로의 게송</h1>
<p>벨랏타니까(Belaṭṭhānika)는 사왓티 바라문 집안에서 났다. 세존의 법문을 듣고 출가해 명상 주제를 받아 꼬살라의 숲에 들었으나, 게으르고 몸 편한 것만 찾고 말이 거칠어 수행에 마음을 내지 않았다. 세존께서 그 앎이 익은 것을 살피시고 빛을 보내시어 이 게송으…</p>
