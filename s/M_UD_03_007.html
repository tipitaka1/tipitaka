<h1>M_UD_03_007_삭꾸다나(삭까의 공양)</h1>
<p>이레 동안 삼매에 들었다가 나온 마하깟사빠 존자가 천신들의 공양을 물리치고 라자가하로 걸식하러 들어가자, 신들의 왕 삭까가 베 짜는 이로 몸을 지어내어 공양을 올린다. 삭까가 허공에서 세 번 우다나를 읊는 것을 들으신 세존께서 이 우다나를 읊으신 편이다. 이와 같이 나는 들었다. 한때 세존께서 라자가하의 웰루와나 깔란다까니와빠에 머무셨다. 마침 그때 마하깟사빠 존자가 삡빨리 동굴에 머물면서 어떤 삼매에 들어 이레 동안 한 가부좌로 앉아 있었다.…</p>
