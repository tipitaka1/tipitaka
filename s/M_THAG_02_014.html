<h1>M_THAG_02_014_소마밋따 장로의 게송</h1>
<p>바라나시(Bārāṇasī) 바라문 집안에 태어나 세 베다에 통달하였다. 위말라(Vimala) 장로와 가까이 지내며 법을 듣고 믿음을 얻어 출가하였으나, 그 장로가 게으르고 잠이 많아 밤낮을 헛되이 보내는 것을 보고 「게으른 이를 의지해 무슨 이익이 있으랴」 하며 떠났다…</p>
