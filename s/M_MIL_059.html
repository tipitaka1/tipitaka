<h1>M_MIL_059_웁빳자띠자나나빤하 (생겨남을 앎에 대한 물음)</h1>
<p>왕이 말하였다. 「나가세나 존자시여, 태어날 이는 「나는 태어날 것이다」라고 압니까?」 「그렇습니다, 대왕이시여, 태어날 이는 「나는 태어날 것이다」라고 압니다」. 「비유를 들어 주십시오」. 「대왕이시여, 마치 농사짓는 장자가 씨앗을 땅에 뿌리고 비가 알맞게 내리면 「곡식이 여물겠다」라고 아는 것과 같습니다」. 「그렇습니다, 존자시여, 알 것입니다」. 「대왕이시여, 꼭 그와 같이 태어날 이는 「나는 태어날 것이다」라고 압니다」.</p>
