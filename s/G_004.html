<h1>G_004_논장 세부</h1>
<p>「아비담마(abhidhamma)」는 법에 대하여·뛰어난 법이라는 뜻입니다. 경장이 「누가 언제 누구에게 무슨 말씀을 하셨나」라면, 논장은 사람과 상황을 걷어 내고 법 그 자체만 남긴 것입니다. 그래서 이야기가 없습니다. 빳타나 한 책이 논장의 절반입니다. 그런데도 되풀이를 …pe… 로 줄여 적은 것이니, 다 펴면 분량을 셀 수 없습니다. 법과 법이 이어지는 스물네 가지 방식입니다. 논장의 알맹이가 여기 있습니다. 경과 율은 부파끼리 대응이 서지…</p>
