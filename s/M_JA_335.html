<h1>M_JA_335_잠부까(사자 흉내 낸 자칼)</h1>
<p>세존께서 웰루와나에 머무실 때, 데와닷따가 선서의 흉내를 낸 일을 두고 하신 말씀이다. 사리뿟따 존자가 「그가 세존을 흉내 내어 제 손에 부채를 쥐여 주고 누웠다가 꼬깔리까에게 무릎으로 가슴을 채여 괴로움을 겪었습니다」 아뢰자, 세존께서 「지금만이 아니라 전에도 나를 흉내 내다 괴로움을 겪었다」 하시고 옛일을 드셨다. 옛날 보살은 사자로 나 히말라야 굴에 살았다. 자칼 하나가 사자를 보고 달아나지 못해 엎드려 「모시겠습니다」 하니, 사자는 데려…</p>
