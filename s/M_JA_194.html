<h1>M_JA_194_마니쪼라(보석 도둑으로 몰린 남편)</h1>
<p>세존께서 웰루와나에 머무실 때 죽이려고 애쓰는 데와닷따를 두고 하신 말씀이다. 세존께서는 예전에도 그러했으나 죽이지 못했다 하시고 옛일을 들려주셨다. 옛날 보살은 바라나시 가까운 마을의 장자 집에 나, 계행과 몸가짐을 갖추고 지아비를 섬기는 수자따를 아내로 얻었다. 아내가 친정을 보고 싶어 해 함께 수레를 타고 성에 들었는데, 코끼리를 타고 성을 돌던 왕이 수레에서 내려 걷는 그를 보고 마음을 빼앗겼다. 남편이 있음을 알고는 사람을 시켜 제 머…</p>
