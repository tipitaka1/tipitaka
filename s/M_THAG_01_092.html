<h1>M_THAG_01_092_위자야 장로의 게송</h1>
<p>선정을 얻고도 부처님을 찾아온 고행자 위자야(Vijaya)는 사왓티 바라문 집안에서 났다. 바라문의 학문을 다 익히고 고행자로 출가해 숲에서 선정을 얻고 지내다가, 부처님께서 나셨다는 말을 듣고 믿음이 일어 세존을 찾아뵈었다. 법을 듣고 비구로 출가해 위빳사나를 시작한 지 오래지 않아 아라한이 되었다. 스스로 얻은 바를 밝히며 이 게송을 읊었다. 번뇌 다하고 음식에 기대지 않으며 공함과 표상 없음의 해탈을 노니는 자리로 삼은 이 허공의 새들처럼…</p>
