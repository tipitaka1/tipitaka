<h1>M_AN_04_07_빳따깜마(마땅히 할 일)</h1>
<p>그때 아나타삔디까 장자가 세존께 다가갔다. 다가가서 세존께 절을 올리고 한쪽에 앉았다. 한쪽에 앉은 아나타삔디까 장자에게 세존께서 이렇게 말씀하셨다 – 장자여, 이런 네 가지 바라고 좋아하고 마음에 들지만 세상에서 얻기 어려운 법들이다. 어떤 넷인가? 「법답게 내게 재물이 생기기를」 하는 것, 이것이 세상에서 얻기 어려운, 바라고 사랑스럽고 마음에 드는 첫 번째 것이다. 「법답게 재물을 얻고서 친척들과 스승들과 더불어 내게 명성이 오기를」 하는…</p>
