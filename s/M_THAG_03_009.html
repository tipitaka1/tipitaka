<h1>M_THAG_03_009_야소자 장로의 게송</h1>
<p>황금빛 큰 물고기를 왕께 바친 어부의 아들 사왓티 성문 밖 어부 마을에서 오백 집을 이끄는 어부의 아들로 태어나 야소자(Yasoja)라 불렸다. 아찌라와띠 강에서 잡은 황금빛 큰 물고기를 빠세나디 왕에게 바쳤고, 세존께서 그 물고기의 전생 내력을 밝히시며 까삘라경을 설하셨다. 그 법문을 듣고 절박함이 일어 벗들과 함께 출가했다. 뒤에 무리와 함께 제따와나에 갔을 때 떠드는 소리가 커 세존께서 물리치시자, 채찍 맞은 좋은 말처럼 절박해져 왁구무다…</p>
