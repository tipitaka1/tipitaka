<h1>M_THIG_07_003_우빠짤라 장로니의 게송</h1>
<p>사리뿟따의 둘째 누이 짤라(Cālā) 장로니의 동생이다. 마가다의 날라까 마을에서 바라문 여인 루빠사리의 딸로, 사리뿟따 존자의 누이로 태어났다. 언니와 마찬가지로 출가하여 위빳사나를 닦아 아라한과를 얻었다. 사띠와 지혜의 눈을 갖추어 고요한 경지를 꿰뚫었다고 감흥을 읊자, 마라가 다가와 태어남을 마다하지 말라고 꾀었다. 태어남이 곧 괴로움임을 밝히며 이 게송을 읊었다. 사띠를 갖추고 눈을 갖추고 기능을 닦은 비구니로서 나는 고요한 경지를 꿰뚫…</p>
