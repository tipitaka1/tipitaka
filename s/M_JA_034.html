<h1>M_JA_034_맛차(욕정에 그물 든 물고기)</h1>
<p>세존께서 제따와나에 머무실 때 옛 아내에게 마음이 끌린 비구를 두고 말씀하셨다. 그 비구는 「옛 아내의 손맛을 버릴 수 없습니다」 하였다. 옛날 바라나시에서 보살은 왕의 제관이었다. 어부들이 강에 그물을 쳤는데, 큰 물고기가 암컷과 어울려 놀다가 암컷은 그물 냄새를 맡고 비켜 갔으나 수컷은 욕정에 눈이 멀어 그물 속으로 들어갔다. 어부들은 그를 죽이지 않은 채 모래밭에 던져 놓고 숯불을 피우고 꼬챙이를 깎았다. 물고기는 불도 꼬챙이도 괴롭지 않…</p>
