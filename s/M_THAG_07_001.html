<h1>M_THAG_07_001_순다라사뭇다 장로의 게송</h1>
<p>기녀의 유혹을 물리친 「잘생긴 사뭇다」 라자가하 큰 장자의 아들 사뭇다(Samudda)인데, 용모가 빼어나 순다라사뭇다, 곧 「잘생긴 사뭇다」로 불렸다. 세존께서 라자가하에 드시는 것을 보고 출가해 사왓티에서 명상 주제를 닦았다. 아들을 그리는 어머니의 부탁을 받은 기녀가 환속시키려 사왓티까지 따라와 탁발길을 막고 청했는데, 장로는 선 자리에서 닦음을 다그쳐 육신통을 갖추었다. 그 일을 그대로 읊었다. 곱게 꾸미고 좋은 옷을 입고 화환을 두르고…</p>
