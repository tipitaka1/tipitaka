<h1>M_JA_545_마하나라다깟사빠(삿된 견해를 깬 범천)</h1>
<p>세존께서 랏티와나 동산에 머무실 때, 우루웰라깟사빠를 길들이신 일을 두고 하신 말씀이다. 마가다 왕과 함께 온 무리 가운데 「깟사빠가 큰 사문의 제자인가, 그 반대인가」 하는 생각이 일자, 장로는 여래의 발등에 머리를 대어 제자임을 밝히고 일곱 번 허공에 솟았다. 사람들이 놀라자 세존께서는 「지금만이 아니다. 예전에도 나는 나라다 범천이 되어 이 사람의 견해 그물을 찢었다」 하시고 옛일을 드셨다. 옛날 위데하의 미틸라에서 앙가띠 왕이 다스렸다.…</p>
