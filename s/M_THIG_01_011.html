<h1>M_THIG_01_011_뭇따 장로니의 게송</h1>
<p>세 가지 굽은 것에서 풀려난 이 꼬살라 지방의 가난한 바라문 오가따까(Oghātaka)의 딸로 태어났다. 나이가 차자 부모가 곱사등이 바라문에게 시집보냈다. 살림살이를 즐기지 않아 남편의 허락을 받고 출가하여 위빳사나를 닦았는데, 마음이 밖으로 내달리자 그것을 다잡으며 이 게송을 읊었고, 읊는 그 자리에서 막힘없는 앎과 함께 아라한이 되었다. 잘 벗어났다, 참으로 잘 벗어났다, 세 가지 굽은 것에서 벗어나. 절구와 절굿공이와 곱사등이 남편에게서…</p>
