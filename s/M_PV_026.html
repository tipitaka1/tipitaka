<h1>M_PV_026_아빗자마나(물을 가르지 않음)</h1>
<p>강가 강 물을 가르지 않고 건너가는 아귀에게 어디로 가느냐 묻고, 대신 꼴리야가 배 위에서 이발사를 거쳐 보시하자 그 보시가 아귀에게 그대로 이른 일, 이어 인색한 이와 베푼 이가 가는 곳을 밝히는 편이다. 갈라지지 않는 물 위로 그대는 여기 강가 강을 건너간다. 앞쪽 반은 벌거벗은 아귀 같은데, 화환을 걸치고 몸을 꾸몄다. 아귀여, 어디로 가려는가. 어디에 머물게 되는가. 쭌닷틸라로 가려 한다고 그 아귀가 말했다. 와사바 마을과 바라나시 사이…</p>
