<h1>M_ITI_003_모하 (어리석음)</h1>
<p>어리석음 한 가지를 버리면 불환과를 보증하겠다고 세존께서 말씀하신 편이다. 세존께서 이렇게 말씀하셨다. 아라한께서 이렇게 말씀하신 것을 나는 들었다 — 비구들이여, 한 가지 법을 버려라. 내가 그대들에게 불환과를 보증하겠다. 어떤 한 가지 법인가? 비구들이여, 어리석음…</p>
