<h1>M_THAG_06_013_시리만다 장로의 게송</h1>
<p>허물은 드러내야 편해진다고 읊은 이 삼수마라기리 바라문 가문에 나 시리만다(Sirimaṇḍa)라 불렸다. 베사깔라 숲에 머무시던 세존께 법을 듣고 출가했다. 어느 포살일에 빠띠목카를 외는 자리에서 「드러내면 편안해진다」는 구절의 뜻을 새기다가 「스승의 가르침은 참으로 청정하다」며 믿음을 얻었고, 그 희열을 가라앉히고 위빳사나를 닦아 아라한이 되었다. 비구들에게 훈계하며 이 게송을 읊었다. 덮어 둔 것에는 비가 퍼붓고 열어 둔 것에는 퍼붓지 않는…</p>
