<h1>M_PV_039_레와띠 (레와띠 아귀)</h1>
<p>인색하여 사문과 바라문을 헐뜯고 남편을 속인 레와띠를 야마의 사자들이 끌고 가는 편이다. 남편 난디야가 이른 천궁을 지나 지옥으로 끌려가는 동안 레와띠가 묻고 사자들이 답하며, 뒤늦게 돌아가 공덕을 짓겠다고 빌지만 그대로 지옥에 던져진다.</p>
