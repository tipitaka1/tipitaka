<h1>M_PTH_05_느낌 삼법</h1>
<p>〔성립하는 조건의 수 — 실측 416건〕 선 삼법의 7분의 1에도 못 미친다. 물질과 열반은 이 삼법의 셋 어디에도 들지 않기 때문이다. 삼법이 늘 모든 법을 남김없이 나누는 것은 아니다. 〔팔리 원문〕 느낌 자신은 자기와 결합할 수 없으므로, 즐거운 느낌은 「즐거운 느낌과 결합한 법」에 들지 않는다. 뒤의 여러 삼법에도 같은 원칙이 걸린다.</p>
