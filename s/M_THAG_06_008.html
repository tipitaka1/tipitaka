<h1>M_THAG_06_008_미가잘라 장로의 게송</h1>
<p>사왓티의 대청신녀 위사카(Visākhā)의 아들 미가잘라(Migajāla)다. 절에 드나들며 자주 법을 들어 믿음을 얻고 출가했고, 위빳사나를 닦아 아라한이 되었다. 얻은 바를 밝히며 이 게송을 읊었다. 눈 있으신 분, 태양의 벗이신 부처님께서 잘 설하셨다.</p>
