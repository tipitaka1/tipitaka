<h1>M_AN_08_08_야마까(짝을 이룬 여덟 법)</h1>
<p>“비구들이여, 비구가 믿음은 있으나 계를 지니지 않으면, 그는 그 요소에서 온전하지 못하다. 그는 그 요소를 채워야 한다 — &quot;어떻게 하면 나는 믿음도 있고 계도 지닐까&quot;라고. 비구들이여, 비구가 믿음도 있고 계도 지니면, 그는 그 요소에서 온전하다.</p>
