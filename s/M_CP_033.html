<h1>M_CP_033_수완나사마 (수완나사마의 행실)</h1>
<p>보살이 숲에서 사마로 지내던 때의 일을 말한다. 사자와 호랑이를 비롯한 뭇 짐승에게 자애를 펴, 서로 두려워하지 않고 함께 지냈다. 내가 숲에서 사마였을 때, 그 태어남은 삭까가 마련한 것이었다. 깊은 숲의 사자와 호랑이에게 나는 자애를 폈다.</p>
