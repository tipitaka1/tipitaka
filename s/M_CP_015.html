<h1>M_CP_015_마힝사라자(참는 큰 물소)</h1>
<p>보살이 숲을 다니는 큰 물소였을 때의 일이다. 못된 원숭이가 날마다 몸에 오줌과 똥을 누며 괴롭혔고 약카가 뿔로 받아 없애라고 부추겼으나, 성을 내면 그보다 낮아지고 계가 깨진다고 여겨 견뎠다고 스스로 말한다. 또 한 번, 내가 숲을 다니는 물소였을 때, 몸집이 크고 힘이 세며 우람하고 보기에 무서웠다. 벼랑에도 험한 산속에도, 나무 밑에도 물가에도, 물소들이 머무는 자리가 있어 이곳저곳에 하나씩 있었다. 큰 숲을 다니다가 좋은 자리를 보았다.</p>
