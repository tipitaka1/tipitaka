<h1>M_PS_3_07_사마시사까타 (고름과 머리의 논의)</h1>
<p>「사마시사」 — 번뇌가 다하는 그 순간에 목숨도 함께 다하는 이 — 를 다룬다. 무엇이 「고름(sama)」이고 무엇이 「머리(sīsa)」인지를 가르고, 다툼 없는 머묾을 함께 짚는다. 정전에서 이 말을 정면으로 다룬 거의 유일한 자리다. 모든 법을 바르게 끊어 버림과 소멸시킴에서 다시 나타나지 않음에 대한 지혜가 고르게 됨과 머리라는 뜻에 대한 앎이다. 「모든 법」이란 다섯 무더기, 열두 감각영역, 열여덟 요소, 유익한 법들, 해로운 법들, 결…</p>
