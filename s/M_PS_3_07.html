<h1>M_PS_3_07_사마시사까타 (고름과 머리의 논의)</h1>
<p>「사마시사」 — 번뇌가 다하는 그 순간에 목숨도 함께 다하는 이 — 를 다룬다. 무엇이 「고름(sama)」이고 무엇이 「머리(sīsa)」인지를 가르고, 다툼 없는 머묾을 함께 짚는다. 정전에서 이 말을 정면으로 다룬 거의 유일한 자리다.</p>
