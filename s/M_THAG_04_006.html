<h1>M_THAG_04_006_세나까 장로의 게송</h1>
<p>가야 나루의 목욕제를 버린 이 우루웰라깟사빠(Uruvelakassapa) 장로의 누이의 아들로 바라문 집안에서 태어났다. 바라문의 학문을 익히고 집에서 살았다. 해마다 팍구나 달이면 가야 나루에서 물에 몸을 담그는 「가야팍구」 축제가 있었는데, 그 날 목욕하러 갔다가 법을 설하시는 세존을 뵙고 법을 듣고 출가했다. 오래지 않아 아라한이 되었고, 걸어온 길을 돌아보며 기쁨에 겨워 이 게송을 감흥으로 읊었다. 가야의 가야팍구 축제에 간 것은 참으로…</p>
