<h1>M_MND_08_빠수라닛데사 (빠수라 해설)</h1>
<p>논쟁으로 이름을 얻으려는 이를 다룬다. 이겨도 우쭐하고 져도 풀죽는 그 자리에 무엇이 있는지를 파헤친다. 「진영을 거둔 이(visenibhūta)」라는 말이 여기서 나온다. 이제 빠수라경 닛데사를 말한다 — &quot;청정은 오직 여기 있다&quot; 하고 그들은 말한다, 다른 법들에는 청정이 없다고 한다; 제가 기댄 그것만 좋다 말하며, 저마다의 진리에 제각기 자리 잡았다. 「청정은 오직 여기 있다 하고 그들은 말한다」란. 오직 여기에 청정과 온전한 청정과 두…</p>
