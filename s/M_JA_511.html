<h1>M_JA_511_낑찬다(밤에만 지킨 포살)</h1>
<p>세존께서 제따와나에 머무실 때 포살을 지키는 일을 두고 하신 말씀이다. 「옛 사람들은 반쪽 포살을 지킨 갚음으로도 큰 영화를 얻었다」 하시고 옛일을 들려주셨다. 옛날 바라나시 브라흐마닷따 왕은 보시와 계와 포살에 게으르지 않았고 신하들도 그렇게 이끌었으나, 제관은 남의 뒷말을 하고 뇌물을 받아 재판을 굽히는 자였다. 포살일에 왕이 묻자 그는 지켰다고 거짓을 말하고는, 집에 가 입을 헹구고 밤만 계를 지켜 반쪽 포살을 삼았다. 또 재판정에 붙들려…</p>
