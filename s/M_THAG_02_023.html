<h1>M_THAG_02_023_소비따 장로의 게송</h1>
<p>전생을 기억하는 앎에 으뜸 사왓티(Sāvatthī) 바라문 집안에 태어났다. 세존의 법문을 듣고 믿음을 얻어 출가하여 위빳사나를 키워 여섯 신통을 갖추었고, 특히 전생을 기억하는 앎에 익숙하였다. 전생에 빠두뭇따라(Padumuttara) 부처님께서 한 비구를 그 앎에서 으뜸의 자리에 세우시는 것을 보고 자기도 그 자리를 서원한 인연이 있다. 하룻밤에 오백 겁을 되짚어 본 것을 밝히며 이 게송을 읊었다. 사띠를 지니고 지혜롭고 굳센 정진을 일으킨…</p>
