<h1>M_THAG_02_023_소비따 장로의 게송</h1>
<p>사왓티(Sāvatthī) 바라문 집안에 태어났다. 세존의 법문을 듣고 믿음을 얻어 출가하여 위빳사나를 키워 여섯 신통을 갖추었고, 특히 전생을 기억하는 앎에 익숙하였다. 전생에 빠두뭇따라(Padumuttara) 부처님께서 한 비구를 그 앎에서 으뜸의 자리에 세우시는 것…</p>
