<h1>M_THAG_12_002_수니따 장로의 게송</h1>
<p>거리의 오물을 치우다 출가한 이 전생에 빳쩨까붓다에게 「집집이 오물이나 치우며 살라」고 욕한 과보로 여러 생을 시든 꽃과 쓰레기 치우는 집안에 났다. 이번 생에도 같은 집안에 나서 오물을 치워 살았으나 먹을 것조차 얻지 못했다. 세존께서 새벽에 그의 마음에 등불처럼 타오르는 아라한의 바탕을 보시고, 라자가하(Rājagaha)에서 그가 일하는 길로 탁발을 나가셨다. 부끄러워 담벼락에 붙어 선 그를 「수니따(Sunīta)여」 부르시며 출가하겠느냐 …</p>
