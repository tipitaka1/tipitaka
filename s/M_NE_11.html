<h1>M_NE_11_위밧띠하라위방가 (나눔의 전달 — 갈라 밝힘)</h1>
<p>열여섯 전달 가운데 나눔의 전달을 낱낱이 갈라 밝힌다. 경의 한 구절을 이 각도로 돌려 무엇을 뽑아내는지가 여기 있다. 거기서 어떤 것이 나눔의 전달인가? 「법과 가까운 원인과 자리를」이라는 것이다. 경은 둘이니 배어듦에 이바지하는 경과 꿰뚫음에 이바지하는 경이다. 길은 둘이니 공덕에 이바지하는 길과 결실에 이바지하는 길이다. 계는 둘이니 단속의 계와 버림의 계이다. 거기서 세존께서는 배어듦에 이바지하는 경을 공덕에 이바지하는 길로 가르치신다.…</p>
