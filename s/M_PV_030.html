<h1>M_PV_030_꾸마라1(버려진 아이)</h1>
<p>시체 버리는 숲에 버려져 겨우 목숨만 붙은 아이를 세존께서 보시고, 이 아이가 그 도시에서 으뜸가는 집안의 사람이 되리라 밝히신다. 이어 무슨 업의 과보냐는 물음과 그 답이 이어진다. 선서의 앎은 놀랍다. 스승께서 사람을 두고 그렇게 밝히셨다. 공덕이 두터운 이도 더러 있고, 공덕이 적은 이도 더러 있다. 이 아이는 시체 버리는 숲에 버려져 엄지의 진액으로 밤을 견딘다. 약카도 정령도 기어 다니는 것들도 공덕 지은 아이를 해치지 못한다.</p>
