<h1>M_VV_005_꾼자라(코끼리 천궁)</h1>
<p>목갈라나 존자가 보석으로 꾸민 코끼리를 타고 허공을 가는 천신에게 그것이 보시의 과보인지 계의 과보인지 묻고, 천신은 선정을 닦는 분께 꽃을 뿌리고 천을 깐 자리를 드린 일을 답한다. 온갖 보석으로 꾸민 그대의 코끼리는 타기 좋고 훌륭합니다. 아름답고 힘세며 빠른 그것이 허공을 나아갑니다. 연꽃을 두르고 연꽃잎 같은 눈을 지녔으며, 연꽃과 청련의 광채를 띠었습니다. 온몸에 연꽃 가루를 뒤집어쓰고 황금 연꽃 화환을 걸었습니다.</p>
