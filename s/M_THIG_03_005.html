<h1>M_THIG_03_005_웁비리 장로니의 게송</h1>
<p>「지완띠야」 하고 울부짖던 왕비 사왓티의 큰 장자 집에 태어나 몹시 아름다웠다. 꼬살라 왕이 궁으로 들였고, 딸 지완띠(Jīvantī)를 낳자 왕은 기뻐하며 그를 왕비로 세웠다. 딸이 뛰어놀 나이에 죽자 날마다 무덤가에 가서 울었다. 어느 날 아찌라와띠 강가에서 우는 것을 보시고, 세존께서 이 화장터에서 태운 네 딸이 팔만 사천인데 누구를 두고 우느냐 하시며 이 게송을 읊으셨다. 「아가, 지와야」 하며 숲에서 우는구나. 웁비리여, 자신을 되찾아…</p>
