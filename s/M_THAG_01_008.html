<h1>M_THAG_01_008_위라 장로의 게송</h1>
<p>이름 그대로 용사였던 이 사왓티에서 빠세나디 왕의 대신 집안에 태어나 위라(Vīra), 곧 「용사」라는 이름을 얻었고 이름대로 싸움에 용감했다. 부모의 성화로 아내를 맞아 아들 하나를 얻은 뒤, 감각적 욕망과 윤회의 허물을 보고 절박함이 일어 출가해 오래지 않아 여섯 신통을 갖추었다. 옛 아내가 환속시키려고 낮 머무는 자리로 찾아와 여인의 몸짓을 지어 보이자, 그 짓이 부질없음을 밝히며 이 게송을 읊었다. 길들기 어렵던 이가 다스림으로 길들었다…</p>
