<h1>M_THAP_406_도따까 장로의 아빠다나</h1>
<p>강가 강에 다리를 놓아 바친 이 빠두뭇따라 부처님을 위해 강가 강에 다리를 놓아 바친 이야기입니다. 강을 건너느라 애쓰는 비구들을 보고 다리를 놓기로 마음먹는 독백(§7–§9)과 다리를 바치며 아뢰는 말(§12)이 들어 있고, 다리 보시의 과보를 하나하나 들어 보이는 긴 수기(§14–§23)가 이어집니다. 바기라티라는 이름의 강가 강이 히말라야에서 흘러나와 그때 항사와띠의 성문을 지나 흘렀다. 소비따라는 이름의 승원이 강가 강 언덕에 잘 지어져…</p>
