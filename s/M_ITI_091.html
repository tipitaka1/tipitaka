<h1>M_ITI_091_지위까(걸식이라는 생계)</h1>
<p>걸식은 생계 가운데 가장 낮은 것이지만 좋은 집안의 아들들은 괴로움을 끝내려고 그 길에 들어선다. 그렇게 출가하고도 감각적 욕망에 물든 이는 양쪽 끝이 타고 가운데는 똥이 묻은 화장터 장작 같다고 세존께서 말씀하신 편이다. 세존께서 이렇게 말씀하셨다. 아라한께서 이렇게 말씀하신 것을 나는 들었다 — 비구들이여, 생계 가운데 가장 낮은 것이 걸식이다. 비구들이여, 세상에서 「발우를 들고 빌어먹으며 돌아다니는구나」 하는 말은 욕이다.</p>
