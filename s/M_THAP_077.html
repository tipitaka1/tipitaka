<h1>M_THAP_077_에까산냐까 장로의 아빠다나</h1>
<p>으뜸 제자 칸다께 한 끼 걸식 음식을 바침 위빳시 부처님의 으뜸가는 제자 칸다께 한 번의 걸식 음식을 바친 이야기입니다. 칸다라는 이름의, 위빳시의 으뜸가는 제자가 계셨다. 세상의 공양을 받으실 만한 그분께 나는 한 번의 걸식 음식을 바쳤다. 그 마음의 맑음으로 — 두 발 가진 이의 왕이시여, 사람 가운데 황소이시여 — 나는 나쁜 곳을 알지 못한다. 이것이 한 번의 걸식 음식을 바친 과보다. 이로부터 마흔 겁 전에 와루나라는 이름의 왕족이 있었…</p>
