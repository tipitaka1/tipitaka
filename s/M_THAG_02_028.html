<h1>M_THAG_02_028_바라따 장로의 게송</h1>
<p>난다까와 함께 나선 형 짬빠의 장자 집안 사람이며, 앞 편 난다까(Nandaka) 장로의 형이다. 소나(Soṇa) 장로가 출가했다는 말을 듣고 「그런 분도 출가하셨구나」 하며 절박함이 일어 출가했고, 할 일을 마친 뒤 위빳사나를 닦아 오래지 않아 육신통을 갖추었다. 앞선 생에는 경행하시던 아노마닷시 부처님께 신 한 켤레를 올린 이였다. 아우 난다까를 불러 은사께 가서 세존 앞에 사자후를 하자며 이 게송을 읊었다. 오라, 난다까여, 은사께로 가자…</p>
