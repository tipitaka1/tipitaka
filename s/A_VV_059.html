<h1>A_VV_059_빠타마나가</h1>
<p>「새하얀 몸에 코끼리를 타고」란 나가 천궁이다. 그 인연은 무엇인가? 세존께서는 사왓티의 제따 숲에 머무셨다. 그때 마하목갈라나 존자가 앞에서 말한 대로 하늘을 두루 다니다가 삼십삼천의 처소에 이르렀다. 거기서 그는 어떤 천자가 온통 흰 큰 하늘 코끼리에 올라, 많은 무리를 거느리고 큰 하늘의 위력으로 허공을 지나며 달처럼 해처럼 모든 방향을 밝히는 것을 보았다. 보고서 그 천자가 있는 곳으로 다가갔다. 그러자 그 천자는 코끼리에서 내려 마하목…</p>
