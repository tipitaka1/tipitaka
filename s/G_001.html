<h1>G_001_삼장이란</h1>
<p>「삐따까(piṭaka)」는 바구니라는 뜻입니다. 부처님 가르침을 세 바구니에 나누어 담았다 하여 띠삐따까(Tipiṭaka), 한역으로 삼장(三藏) 입니다. 이 아카이브는 그 6차 결집본을 인도 위빳사나 연구소가 전산화한 CST를 바탕으로 합니다. 경장이 절반을 넘고, 논장이 그다음입니다. 「경 = 대부분」이라는 인상과 달리 논장이 율장의 두 배가 넘습니다. - 경장 — 다섯 니까야와 쿳다까 20책 - 율장 — 다섯 책과 227·311 학처</p>
