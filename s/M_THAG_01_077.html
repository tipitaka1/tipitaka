<h1>M_THAG_01_077_핫타로하뿟따 장로의 게송</h1>
<p>코끼리 대신 제 마음을 길들인 이 핫타로하뿟따(Hatthārohaputta)는 사왓티의 코끼리 부리는 집안 아들이라 그 이름으로 불린다. 코끼리 다루는 재주를 다 익혔는데, 어느 날 강가에서 코끼리를 길들이다가 「내게 코끼리 길들이기가 무슨 소용인가, 나 자신을 길들이는 것이 낫다」 하는 생각이 일어 세존께 나아가 법을 듣고 출가했다. 위빳사나를 지으면서 오랜 버릇대로 밖으로 달아나는 마음을 다잡으며 이 게송을 읊었고, 그렇게 읊으면서 아라한이…</p>
