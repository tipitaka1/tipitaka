<h1>M_CP_035_마할로마항사 (크게 털이 곤두서는 행실)</h1>
<p>보살이 무덤터에 누워 지내던 때의 일을 말한다. 괴롭히는 이에게나 받드는 이에게나 한결같아 한쪽으로 치우치지 않았다. 짜리야삐따까의 마지막 편이며, 뒤에 결집자가 붙인 갈무리와 맺음말이 이어진다. 나는 무덤터에 주검의 뼈를 베고 누워 잠자리를 삼았다.</p>
