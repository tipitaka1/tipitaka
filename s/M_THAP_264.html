<h1>M_THAP_264_뗄라막키야 장로의 아빠다나</h1>
<p>싯닷타 보리수 난간에 기름을 바른 이 싯닷타 세존께서 열반에 드신 뒤 보리수의 난간에 기름을 발라, 그 과보로 숫차위 전륜성왕이 된 이야기입니다. 싯닷타 세존, 사람 가운데 황소이신 분께서 열반에 드셨을 때, 나는 그때 보리수의 난간에 기름을 발랐다. 구십사 겁 전에 그때 기름을 바른 그 일로, 나는 나쁜 곳을 알지 못한다. 이것이 기름을 바른 과보다. 이로부터 스물네 겁 전에 숫차위라는 이름의 왕족이 있었다. 일곱 보배를 갖춘 큰 힘의 전륜성…</p>
