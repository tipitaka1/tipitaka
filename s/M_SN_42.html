<h1>M_SN_42_가마니(촌장)</h1>
<p>사왓티에서 있었던 일이다. 그때 짠다(Caṇḍa) 촌장이 세존께 다가갔다. 다가가서 세존께 절을 올리고 한쪽에 앉았다. 한쪽에 앉은 짠다 촌장은 세존께 이렇게 말했다 — &quot;존자시여, 무슨 원인 무슨 조건 때문에 여기 어떤 사람은 성마른 자라고 불립니까? 존자시여, 또 무슨 원인 무슨 조건 때문에 여기 어떤 사람은 온화한 자라고 불립니까?&quot; &quot;촌장이여, 여기 어떤 사람에게는 탐욕이 버려지지 않았다. 탐욕이 버려지지 않았기에 남들이 그를 성나게 하…</p>
