<h1>M_DHP_17_꼬다왁가 (분노품)</h1>
<p>분노를 어떻게 다스리는지 말하는 열네 게송이다. 치솟는 분노를 붙드는 이를 마부라 부르고, 세상에 헐뜯기지 않는 사람은 없다고 아뚤라에게 이르며, 몸과 말과 마노를 단속하는 일로 마무리한다. 분노를 버리고 자만을 떨치고, 모든 족쇄를 넘어서라. 정신·물질에 매이지 않고 가진 것 없는 이에게 괴로움은 닥치지 않는다. 치솟는 분노를 흔들리는 수레 붙들 듯 막아 내는 이, 그를 나는 마부라 부른다. 나머지 사람들은 고삐만 쥔 자다.</p>
