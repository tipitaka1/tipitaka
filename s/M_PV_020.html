<h1>M_PV_020_쭐라셋티(인색한 장자)</h1>
<p>밤에 벌거벗고 야윈 몸으로 다니는 이를 임금이 보고 까닭을 묻는다. 바라나시의 인색한 장자였다가 아귀로 난 그가 제 처지를 밝히고, 부처님과 승가에 보시를 올려 자기에게 돌려 달라 청한다. 임금이 그대로 하자 아귀는 큰 신통을 얻은 약카가 되어 다시 나타난다. 존자시여, 벌거벗고 야윈 채 출가한 몸이시군요. 밤에 어디로 가십니까, 무슨 까닭입니까. 저에게 말해 주십시오. 저희가 할 수 있다면 무엇으로든 그대에게 재물을 마련해 드리겠습니다.</p>
