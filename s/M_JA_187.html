<h1>M_JA_187_짜뚜맛타(자칼이 끼자 날아간 백조)</h1>
<p>세존께서 제따와나에 머무실 때, 한 늙은 비구를 두고 하신 말씀이다. 두 상수 제자가 서로 묻고 답하며 앉아 있는데 늙은 비구가 셋째로 끼어 앉아 「저희도 물을 터이니 궁금한 것은 저희에게 물으십시오」 하자, 두 장로가 언짢아 일어나 가 버렸다. 법을 들으려 앉았던 회중이 모임이 흩어진 까닭을 아뢰자, 세존께서는 사리뿟따와 목갈라나가 그를 언짢아하며 말없이 자리를 뜬 것이 이번만이 아니라 하시고 옛일을 들려주셨다. 옛날 보살은 숲속의 나무 신이…</p>
