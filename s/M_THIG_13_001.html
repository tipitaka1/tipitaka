<h1>M_THIG_13_001_암바빨리 장로니의 게송</h1>
<p>망고나무 아래서 얻은 웨살리의 기녀 웨살리 왕의 동산 망고나무 아래에 홀연히 태어나 암바빨리(Ambapālī)라 불렸다. 시키(Sikhī) 부처님 때 비구니로서 다른 장로니를 「기녀」라 꾸짖은 업으로 기녀가 되었다. 제 동산에 절을 지어 승가에 바쳤고, 뒷날 아들 위말라꼰단냐(Vimalakoṇḍañña) 장로에게서 법을 듣고 출가했다. 늙어 무너진 제 몸을 보고 이 게송을 읊었다. 검고 검은 벌 빛깔 같고 끝이 감긴 것, 내 머리카락이 그러했다…</p>
