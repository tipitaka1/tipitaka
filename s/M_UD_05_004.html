<h1>M_UD_05_004_꾸마라까(물고기와 소년들)</h1>
<p>사왓티로 걸식하러 가시던 세존께서 소년들이 물고기를 괴롭히는 것을 보시고, 괴로움이 두렵고 싫으냐고 물으신 뒤 나쁜 업을 짓지 말라고 우다나를 읊으신 편이다. 이와 같이 나는 들었다. 한때 세존께서 사왓티의 제따와나 아나타삔디까 승원에 머무셨다. 마침 그때 여러 소년들이 사왓티와 제따와나 사이에서 물고기를 괴롭히고 있었다. 그때 세존께서 오전에 옷매무새를 가다듬고 발우와 가사를 들고 사왓티로 걸식하러 들어가셨다. 세존께서 그 여러 소년들이 사왓…</p>
