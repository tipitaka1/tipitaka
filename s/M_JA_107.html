<h1>M_JA_107_살릿따까(조약돌로 다스린 수다)</h1>
<p>세존께서 제따와나에 머무실 때, 백조를 맞힌 비구를 두고 하신 말씀이다. 그는 조약돌 던지는 재주에 능해, 아찌라와띠 강가에서 날아가는 백조의 두 눈을 돌로 꿰뚫어 떨어뜨렸다. 세존께서 꾸짖으시고 「이 재주에 능한 것이 지금만이 아니다」 하시며 옛일을 들려주셨다. 옛날에 보살은 바라나시 왕의 대신이었다. 왕의 제관이 말이 너무 많아 아무도 말할 틈을 얻지 못했다. 그때 조약돌로 니그로다 잎에 온갖 모양을 내던 앉은뱅이가 있었다. 왕은 그를 휘장…</p>
