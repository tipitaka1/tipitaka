<h1>M_THIG_01_014_수마나 장로니의 게송</h1>
<p>주석서는 이 분의 내력이 띳사(Tissā) 장로니와 같다고 적었다. 사꺄 왕족으로 보살의 후궁이었다가 마하빠자빠띠 고따미(Mahāpajāpatī Gotamī)와 함께 출가한 이다. 세존께서 빛을 놓아 앞에 계신 듯 모습을 보이시고 이 게송을 읊으셨고, 게송이 끝나자 아…</p>
