<h1>M_DHP_22_니라야왁가 (지옥품)</h1>
<p>무엇이 지옥으로 이어지는지를 말하는 품이다. 거짓말, 계를 어긴 채 가사를 걸침, 남의 아내를 가까이함, 느슨하게 붙든 수행이 어떤 결과에 이르는지 보이고, 끝에서는 그릇된 견해가 중생을 나쁜 곳으로 끌고 감을 말한다. 없던 일을 말하는 자는 지옥에 간다. 저지르고도 &quot;나는 하지 않았다&quot;고 말하는 자도 그렇다. 저열한 업을 지은 그 두 사람은 죽은 뒤 저 세상에서 똑같아진다. 목에 가사를 두른 자가 많으나 성품이 나쁘고 단속이 없다.</p>
