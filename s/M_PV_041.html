<h1>M_PV_041_꾸마라2(베풀지 못한 왕자)</h1>
<p>사왓티의 두 왕자가 눈앞의 즐거움만 탐하다 아귀로 나서, 베풀 것이 있었는데도 베풀지 못했다고 외치는 편이다. 히말라야 기슭에 사왓티라는 이름의 성이 있다. 거기 두 소년이 있었으니 왕의 아들이었다고 나는 들었다. 물들 만한 것들에 취하고 감각적 욕망의 맛을 즐기며 눈앞의 즐거움을 탐하여 그들은 다가올 일을 보지 못했다. 그들은 인간의 몸을 버리고 여기서 저세상으로 갔다. 보이지 않는 몸으로 이곳에서 외친다, 전에 스스로 지은 나쁜 짓을.</p>
