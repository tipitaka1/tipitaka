<h1>M_SNP_04_010_뿌라베다 (무너지기 전)</h1>
<p>몸이 무너지기 전에 이미 고요해진 사람이 어떤 사람인지 묻고 답하는 편이다. 세존께서는 갈애를 여의고 지난 일과 올 일에 기대지 않으며, 성내지 않고 뽐내지 않고 얻고 잃음에 흔들리지 않는 이를 하나하나 들어 보이시고, 그런 이를 「고요한 이」라 부른다고 이르신다.</p>
