<h1>A_PV_010_칼라띠야뻬띠</h1>
<p>「천궁 안에 서서」— 이것은 스승께서 사왓티에 머무실 때 대머리가 된 어떤 여자 아귀를 두고 말한 것이다. 전하는 바로는, 지난날 바라나시에 몸으로 벌어먹는 어떤 여자가 있었으니 모습이 곱고 볼 만하고 마음을 끌었으며, 더없이 아름다운 살빛을 갖추고 머릿결이 몹시 고왔다. 그의 머리카락은 검고 길고 가늘고 부드럽고 윤이 나며 끝이 굽슬거렸고, 두 손으로 잡을 만큼 숱이 많아 풀어 놓으면 허리띠까지 드리웠다. 그 머릿결의 아름다움을 보고 젊은이들…</p>
