<h1>M_UD_03_001_깜마위빠까자(업의 과보인 느낌)</h1>
<p>어떤 비구가 세존에게서 멀지 않은 곳에 앉아, 지난 업의 과보로 생긴 격심한 느낌을 사띠와 알아차림으로 견디며 흔들리지 않는 것을 세존께서 보시고 읊으신 편이다. 이와 같이 나는 들었다. 한때 세존께서 사왓티의 제따와나 아나타삔디까 승원에 머무셨다. 마침 그때 어떤 비구가 세존에게서 멀지 않은 곳에 가부좌를 틀고 몸을 곧게 세우고 앉아, 지난 업의 과보로 생긴 괴롭고 격심하고 거칠고 쓰라린 느낌을 견디며, 사띠를 지니고 알아차리며 시달리지 않고…</p>
