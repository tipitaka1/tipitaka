<h1>M_JA_367_살리야(도마뱀인 줄 안 뱀)</h1>
<p>세존께서 웰루와나에 머무실 때 「도반들이여, 데와닷따는 세존을 놀라게 하지도 못했다」는 비구들의 말을 두고 하신 말씀이다. 세존께서 「비구들이여, 지금만이 아니라 전에도 그는 나를 놀라게 하지 못했다」 하시고 옛일을 드셨다. 옛날 바라나시에서 보살은 시골 살림하는 집에 나, 어릴 적 흙장난하는 아이들과 마을 어귀 니그로다 나무 아래서 놀았다. 그때 재주 없는 의원 하나가 마을에서 아무것도 얻지 못하고 나오다 그 자리에 이르러, 가지 사이로 머리…</p>
