<h1>A_JA_546_01_위두라 본생 주석 ① 네 포살의 장</h1>
<p>나가 왕·가루라 왕·삭까·드와빠 왕 넷이 저마다 제 계가 낫다며 겨루다 위두라 현자에게 판가름을 맡기는 대목이다. 진실의 바라밀(saccapāramī)을 보이는 편의 첫머리다. [546] 9. 위두라 자따까 주석 짜뚜뽀사타 깐다 「창백하고 여위고 힘이 없구나」 — 이것은 세존께서 제따와나에 머무실 때 당신의 지혜 바라밀을 두고 하신 말씀이다. 어느 날 비구들이 법당에서 이런 이야기를 꺼냈다. &quot;도반들이여, 세존께서는 크고 넓고 깊고 빠르고 밝고…</p>
