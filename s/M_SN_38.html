<h1>M_SN_38_잠부카다까(잠부카다까)</h1>
<p>한때 사리뿟따 존자가 마가다의 날라까 마을에 머물렀다. 그때 유행자 잠부카다까(Jambukhādaka)가 사리뿟따 존자에게 다가갔다. 다가가서 사리뿟따 존자와 기쁘게 인사를 나누었다. 기쁘고 정다운 이야기를 나눈 뒤 한쪽에 앉았다. 한쪽에 앉은 유행자 잠부카다까가 사리…</p>
