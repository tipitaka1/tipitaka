<h1>M_SNP_05_018_빠라야낫투띠가타(저 언덕의 기림)</h1>
<p>열여섯 바라문 학도의 물음이 끝난 자리를 갈무리하는 대목이다. 빠사나까 탑에서 세존께서 물음마다 답하신 일을 먼저 산문으로 밝히고, 이어 열여섯 사람의 이름을 차례로 든 뒤, 이 법문을 「빠라야나」라 부르는 까닭을 밝힌다. 세존께서는 마가다에 계실 때 빠사나까 탑에 머무시며 이것을 말씀하셨다. 시중드는 열여섯 바라문의 청을 받아, 물음을 받을 때마다 그 물음에 답해 주셨다. 그 하나하나의 물음에서 뜻을 알고 법을 알아 법을 법답게 따라 실천한다…</p>
