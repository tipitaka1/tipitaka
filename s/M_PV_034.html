<h1>M_PV_034_꾸따위닛차이까(그릇된 재판관)</h1>
<p>꾸미고 빛나는 몸에 시중드는 무리를 거느리고도 제 등살을 스스로 뜯어 먹는 이를 나라다가 보고 그 까닭을 묻자, 재판하는 자리에서 이치와 법을 물리치고 이간하는 말과 거짓말을 일삼았던 내력을 아귀가 말하는 편이다. 화환을 걸고 관을 쓰고 팔찌를 끼었으며, 그대 몸에는 전단향이 짙다. 얼굴빛이 맑고, 해의 빛깔처럼 빛난다. 그대를 시중드는 저 무리는 사람이 아니다. 그대를 시중드는 처녀가 만이나 되고, 그들은 금팔찌와 팔지를 두르고 황금 화관으로…</p>
