<h1>A_PV_038_난다까</h1>
<p>「삥갈라까라는 왕이 있었으니」란 난다까 아귀 이야기다. 그 인연은 무엇인가? 스승께서 완전한 열반에 드신 뒤 이백 해가 지나 수랏타 지방에 삥갈라라는 왕이 있었다. 그의 장군은 난다까라는 이로, 그릇된 견해를 지니고 거꾸로 보아 「보시한 것이란 없다」 하는 따위로 그릇된 주장을 내세우며 다녔다. 그의 딸 웃따라는 청신녀로 걸맞은 집안에 시집갔다. 난다까는 죽어 윈자 숲의 큰 니그로다나무에 천궁 아귀로 태어났다. 그가 죽은 뒤 웃따라는 맑고 시원…</p>
