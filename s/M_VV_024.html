<h1>M_VV_024_우뽀사타 (우뽀사타 청신녀)</h1>
<p>사께따의 청신녀 우뽀사타였던 천신이 목갈라나 존자의 물음에 답한다. 난다나 숲 이야기를 거듭 듣고 그리로 마음을 두었던 일을 뉘우치자, 존자는 그가 예류자로 수기받았으니 두려워할 것 없다고 이른다. 눈부신 빛으로 서 계신 천녀여, 새벽별처럼 모든 방향을 밝히시는 이여.</p>
