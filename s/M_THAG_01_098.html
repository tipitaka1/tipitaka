<h1>M_THAG_01_098_아바야 장로의 게송</h1>
<p>여인의 자태에 흔들린 마음을 다잡은 이 아바야(Abhaya)는 사왓티 바라문 집안의 아들이다. 절에 갔다가 세존의 법문을 듣고 믿음을 얻어 출가해 위빳사나를 닦던 중, 탁발하러 마을에 들어갔다가 곱게 꾸민 여인을 보고 마음이 물들었다. 절로 돌아와 「사띠를 놓고 본 탓에 오염이 일었다. 잘못했다」 하며 스스로 마음을 다잡고, 그 자리에서 위빳사나를 키워 아라한이 되었다. 제 안에 오염이 일던 그 일을 들어 보이며 이 게송을 읊었다. 형색을 보고…</p>
