<h1>M_MN_063_쭐라말룩야(말룽꺄 짧은 경)</h1>
<p>이와 같이 나는 들었다. 한때 세존께서는 사왓티의 제따와나, 아나타삔디까 승원에 머무셨다. 그때 홀로 물러나 앉아 있던 말루꺄뿟따(Mālukyaputta) 존자에게 이런 생각이 일어났다. 세존께서 대답하지 않으시고 제쳐 두시고 물리치신 견해들이 있다. 「세상은 영원하다…</p>
