<h1>M_THAG_01_081_사미띠굿따 장로의 게송</h1>
<p>전생의 악담으로 몹쓸 병을 앓은 이 사미띠굿따(Samitigutta)는 사왓티의 한 바라문 아들이다. 세존의 법문을 듣고 출가해 계를 아주 깨끗이 지녔으나, 지난 생에 빳쩨까붓다를 헐뜯고 계를 지키는 청신사를 저주한 업이 익어 나병으로 몸이 헐어 갔다. 환자 방에 누워 있을 때 사리뿟따(Sāriputta) 존자가 문병 와 「무더기가 굴러가는 한 느낌은 모두 괴로움이다」라며 느낌을 살피는 수행 주제를 일러 주었다. 그 가르침에 서서 위빳사나를 늘…</p>
