<h1>G_002_경장 세부</h1>
<p>「니까야(nikāya)」는 묶음이라는 뜻입니다. 다섯 묶음인데, 나누는 기준이 서로 다른 것이 이 책의 첫 열쇠입니다. 쿳다까 하나가 나머지 넷을 합친 것의 절반에 이릅니다. 「부록」이라는 인상과 달리 경장에서 가장 큰 묶음입니다. 앞의 네 니까야와 4아함은 「번역과 원본」이 아니라, 서로 다른 부파가 따로 전한 평행 자료입니다. 겹치는 경이 많으나 배열도 경 수도 다릅니다. 쿳다까에 통째로 대응하는 한역은 없습니다. ← 삼장이란</p>
