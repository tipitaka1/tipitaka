<h1>M_JA_158_수하누(사나운 말끼리 만나면)</h1>
<p>세존께서 제따와나에 머무실 때, 사나운 두 비구를 두고 하신 말씀이다. 제따와나에 사나운 비구가 하나 있고 지방에도 하나 있었는데, 사미들이 둘이 다투는 것을 보려고 지방에서 온 비구를 그 방으로 보냈다. 그런데 둘은 만나자마자 손발과 등을 주물러 주며 다정하게 지냈다. 세존께서는 전에도 그러했다 하시고 옛일을 들려주셨다. 옛날 보살은 바라나시 왕의 모든 일을 돌보는 대신이었다. 재물을 탐한 왕은 북방 상인들이 말 오백을 끌고 오자, 다른 대신…</p>
