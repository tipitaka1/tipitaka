<h1>M_CP_000_목차 및 개요</h1>
<p>cariyā(행실) + piṭaka(바구니). 한역 所行藏이 직역입니다. 보살이 1인칭으로 자기 전생을 말합니다. 십바라밀을 다룬 책이 아닙니다. 세 품뿐입니다 — 악낏띠왁가(보시) 10편 · 핫티나가왁가(계) 10편 · 유단자야왁가(출리 등이 섞임) 15편. 정진·인욕·지혜·서원은 따로 품이 없습니다. 십바라밀 교설이 확립되기 전 또는 확립 중인 문헌이라는 뜻입니다. 자따까 정전은 게송뿐이고 산문은 주석층에 있습니다.</p>
