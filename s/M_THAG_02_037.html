<h1>M_THAG_02_037_소나뽀띠리야 장로의 게송</h1>
<p>밧디야 왕을 따라 출가한 장군 까삘라왓투의 마을 어른 뽀띠리야의 아들로 태어나 소나라 불렸다. 자란 뒤 사꺄족 밧디야(Bhaddiya) 왕의 장군이 되었다가, 왕이 출가하자 「왕도 출가하셨는데 나에게 재가살이가 무슨 소용인가」 하며 출가했다. 그러나 출가한 뒤로 잠만 즐기고 닦지 않았다. 아누삐야의 망고 숲에 계시던 세존께서 빛을 놓아 그를 깨우시고 첫 게송으로 타이르시니, 부끄러움과 두려움이 일어 노지에 머무는 두타행을 지니고 위빳사나를 닦으…</p>
