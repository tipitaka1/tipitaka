<h1>M_THAG_02_040_깝빠따꾸라 장로의 게송</h1>
<p>누더기 걸치고 밥을 빌던 가난한 이 사왓티의 가난한 집에 태어나, 자랄 때까지 달리 살 길을 몰라 누더기 조각을 걸치고 사발을 든 채 이곳저곳에서 밥을 얻으러 다녀 「누더기와 밥」이라는 뜻의 깝빠따꾸라라 불렸다. 풀을 베어 팔며 살다가 숲에서 만난 아라한 장로에게 법을 듣고 출가했다. 벗어 둔 그 누더기를 볼 때마다 싫증이 가시고 절박함이 되살아나곤 했으나, 그러기를 되풀이하다 일곱 번이나 환속했다. 법당 끝자리에 앉아 졸고 있는 그를 세존께서…</p>
