<h1>M_PV_035_다뚜위완나 (사리를 헐뜯은 자)</h1>
<p>허공에 서서 썩은 냄새를 풍기며 구더기에 입을 파먹히는 아귀에게 그 까닭을 묻자, 라자가하의 부자였던 그가 집안 여인들이 탑으로 나르던 화환을 막고 탑에 올리는 공양을 헐뜯었던 내력을 말하는 편이다. 끝에 3. Cūḷavaggo 의 갈무리 게송이 붙는다.</p>
