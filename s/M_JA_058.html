<h1>M_JA_058_따요담마(아비를 이긴 원숭이)</h1>
<p>세존께서 웰루와나에 머무실 때, 데와닷따가 죽이려 애쓴 일을 두고 이 말씀을 하셨다. 옛날 데와닷따는 원숭이로 나서 히말라야에서 무리를 거느렸는데, 제 새끼들이 자라 무리를 빼앗을까 두려워 씨를 뽑았다. 보살도 그를 인연으로 암원숭이의 태에 들었고, 어미는 다른 산기슭에서 낳았다. 힘이 세어진 보살이 찾아가자 아버지는 껴안는 척하며 죽이려다 도리어 눌렸다. 그러자 락카사가 사는 못에 연꽃을 따 오라 보냈다. 보살은 들어간 발자국만 있고 나온 것…</p>
