<h1>M_ITI_102_아사왁카야(번뇌의 다함)</h1>
<p>번뇌는 알고 보는 이에게 다하지 알지 못하고 보지 못하는 이에게 다하지 않는다고 하시고, 무엇을 알고 보아야 하는지를 네 가지 진리로 밝히신 편이다. 세존께서 이렇게 말씀하셨다. 아라한께서 이렇게 말씀하신 것을 나는 들었다 — 비구들이여, 나는 알고 보는 이에게 번뇌가 다한다고 말한다. 알지 못하고 보지 못하는 이에게가 아니다. 비구들이여, 무엇을 알고 무엇을 보는 이에게 번뇌가 다하는가? 비구들이여, 「이것이 괴로움이다」라고 알고 보는 이에게…</p>
