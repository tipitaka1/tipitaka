<h1>M_AN_05_05_문다라자(재물과 공덕)</h1>
<p>한때 세존께서는 사왓티의 제따와나, 아나타삔디까 승원에 머무셨다. 그때 아나타삔디까 장자가 세존께 다가갔다. 다가가서 세존께 절을 올리고 한쪽에 앉았다. 한쪽에 앉은 아나타삔디까 장자에게 세존께서 이렇게 말씀하셨다 – &quot;장자여, 재물의 쓰임에는 다섯 가지가 있다. 무엇이 다섯인가? 장자여, 여기 성스러운 제자는 애써 노력하여 얻은 재물, 팔의 힘으로 모으고 땀 흘려 이룬, 법답고 법답게 얻은 재물로 자신을 즐겁게 하고 흡족하게 하고 올바로 행복…</p>
