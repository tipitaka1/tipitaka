<h1>M_PV_050_셋티뿟따(끝없는 지옥)</h1>
<p>지옥에서 익어 가는 이가 언제 끝이 오느냐고 묻고, 다른 이가 끝이 없다고 답하는 편이다. 육만 해가 온전히 다 찼다. 지옥에서 익어 가는 우리에게 언제 끝이 오겠는가. 끝은 없다. 어디에 끝이 있겠는가. 끝은 보이지 않는다. 그대와 내가 지은 악이 그러하기 때문이다, 그대여. 우리는 잘못 살았다. 있으면서도 베풀지 않았다. 보시할 것이 있었건만 스스로 섬을 만들지 못했다. 내가 여기서 벗어나 사람의 몸을 얻는다면 너그럽고 계를 갖춘 이로 착한…</p>
