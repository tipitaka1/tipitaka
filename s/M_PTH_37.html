<h1>M_PTH_37_원인 이법 · 선 삼법</h1>
<p>〔성립하는 조건의 수 — 실측 1,730건〕 이 묶음 스물여덟 편 가운데 가장 큰 수다. 뒤따르는 같은 꼴의 장들이 수십에서 수백에 그치는 것과 견주면, 첫 장만 판을 온전히 펴고 뒤는 줄여 간다는 빳타나의 버릇이 수로 드러난다. 〔팔리 원문〕 「원인」(hetu)은 여기서 조건 일반이 아니라 탐·진·치와 불탐·부진·불치라는 여섯 뿌리를 가리킨다. 스물네 조건의 첫째인 원인 조건(hetupaccaya)과 말이 같아 헷갈리기 쉽다.</p>
