<h1>A_VV_045_암바</h1>
<p>「그대에게 하늘의 아름다운 망고 숲이 있고」라 한 것은 암바 천궁이다. 그 인연은 무엇인가? 세존께서는 사왓티의 제따 숲에 머무셨다. 그때 사왓티의 어느 청신녀가 머물 곳을 보시하는 일에 큰 과보와 큰 이익이 있다는 말을 듣고 마음이 일어, 세존께 절하고 이렇게 아뢰었다. 「세존이시여, 저는 머물 곳 하나를 짓고자 합니다. 그런 자리를 얻고 싶으니 일러 주십시오.」 세존께서 비구들에게 이르시자 비구들이 그녀에게 자리를 보여 주었다. 그녀는 거기…</p>
