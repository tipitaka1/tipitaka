<h1>M_UD_08_010_두띠야답바(둘째 답바의 열반)</h1>
<p>세존께서 비구들에게 답바 말라뿟따의 몸이 타고도 재와 검댕이 남지 않은 일을 들려주시고, 바르게 해탈한 이가 간 곳은 알릴 수 없다고 읊으신다. 우다나의 마지막 편이다. 이와 같이 나는 들었다. 한때 세존께서 사왓티의 제따와나 아나타삔디까 승원에 머무셨다. 거기서 세존께서 비구들을 부르셨다 — 비구들이여. 존자시여, 하고 그 비구들이 세존께 대답했다. 세존께서 이렇게 말씀하셨다 — 비구들이여, 답바 말라뿟따가 허공으로 솟아올라 하늘 공중에 가부…</p>
