<h1>M_JA_476_자와나항사(해와 달린 백조)</h1>
<p>세존께서 제따와나에 머무실 때 굳센 활잡이를 든 법문을 두고 하신 말씀이다. 네 방향에 선 활잡이가 쏜 화살을 땅에 닿기 전에 받아 내는 사람보다 해와 달이 빠르고, 그보다도 목숨의 형성이 더 빨리 다한다는 가르침이었다. 이튿날 비구들이 그 힘을 이야기하자 세존께서 「예전 백조로 났을 때에도 목숨이 덧없음을 보여 법을 설했다」 하시고 옛일을 들려주셨다. 옛날 보살은 빠른 백조로 나서 구만 마리를 거느리고 찟따꾸따에 살며 바라나시 왕과 벗이 되었…</p>
