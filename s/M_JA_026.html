<h1>M_JA_026_마힐라무카(나쁜 말 배운 코끼리)</h1>
<p>세존께서 웰루와나에 머무실 때 데와닷따를 두고 하신 말씀이다. 라자가하의 두 벗 가운데 하나는 세존께, 하나는 데와닷따에게 출가했는데, 데와닷따 쪽 비구가 자꾸 권하여 세존 쪽 비구가 가야시사로 가서 데와닷따가 차린 밥을 먹었다. 세존께서는 「그대는 늘 눈에 띄는 대로 가까이한다」 하시고 옛일을 드셨다. 옛날 바라나시에서 브라흐마닷따가 다스릴 때, 보살은 그 왕의 대신이었다. 왕에게 마힐라무카라는 상서로운 코끼리가 있어 계를 지키고 아무도 해치…</p>
