<h1>A_VV_081_아네까완나</h1>
<p>「여러 빛깔에 번민과 슬픔을 없애는」이란 아네까완나 천궁이다. 그 인연은 무엇인가? 세존께서는 사왓티의 제따 숲에 머무셨다. 그때 마하목갈라나 존자는 앞에서 말한 방식대로 천상을 두루 다니다가 삼십삼천의 처소에 갔다. 그러자 아네까완나 천자가 그를 뵙고 공경과 존중이 일어나 다가가 합장하고 섰다. 장로가 — 여러 빛깔에 번민과 슬픔을 없애는, 갖가지로 꾸며진 천궁에 올라; 천녀의 무리에 둘러싸인 그대는 잘 갖추어져 존재들의 주인처럼 기뻐합니다.</p>
