<h1>M_JA_398_수따누(약카를 달랜 아들)</h1>
<p>세존께서 제따와나에 머무실 때, 어머니를 봉양하는 비구를 두고 하신 말씀이다. 지금의 이야기는 수완나사마 자따까에 나온다. 옛날 바라나시에서 보살은 가난한 집안에 나 수따누라 불렸고, 삯일로 어머니를 봉양했다. 그때 왕이 사슴을 쫓다 지쳐 반얀나무 아래서 잠들었는데, 그 나무의 약카 마가데와가 붙들자 왕은 날마다 밥 한 그릇과 사람 하나를 보내기로 하고 풀려났다. 감옥이 비자 왕은 천 냥을 걸고 밥을 나를 이를 찾았다. 보살은 그 돈을 어머니께…</p>
