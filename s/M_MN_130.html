<h1>M_MN_130_데와두따(하늘의 사자)</h1>
<p>이와 같이 나는 들었다. 한때 세존께서는 사왓티의 제따와나, 아나타삔디까 승원에 머무셨다. 거기서 세존께서 비구들에게 이르셨다. 「비구들이여.」 「예, 존자시여.」 그 비구들은 세존께 대답했다. 세존께서 이렇게 말씀하셨다. 비구들이여, 마치 문이 달린 두 채의 집이 있고 눈 밝은 사람이 그 가운데 서서 사람들이 집에 들어가고 나가고 이리저리 거닐고 돌아다니는 것을 보는 것과 같다. 비구들이여, 그와 같이 나는 청정하고 인간을 넘어선 하늘의 눈으…</p>
