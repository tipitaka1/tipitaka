<h1>M_THAG_01_053_왈리야 장로의 게송</h1>
<p>끝까지 방일하지 않겠다 읊은 이 고디까 장로와 같은 게송을 읊되 셋째 구절만 다르다. 방일하지 않는 실천을 끝까지 밀어붙여, 그 오두막에서 성스러운 머묾과 하늘의 머묾으로 지낸다고 하였다. 비구름은 잘 지은 노래처럼 비를 내린다. 내 오두막은 지붕을 덮어 아늑하고 바람이 들지 않는다. 그 안에서 나는 방일하지 않고 지낸다. 그러니 원하거든 비구름이여, 내려라.</p>
