<h1>M_VV_080_고빨라(소치는 이의 보시)</h1>
<p>높은 천궁에 있는 천자를 보고 비구가 어떤 업의 과보인지 묻는다. 천자는 전생에 남의 소를 치던 자기가 사문에게 먹을 것을 싼 보자기를 건네고, 콩밭으로 달려가다 뱀에 물려 죽었다고 답한다. 마지막 세 게송에서 그 사문이 곧 지금 묻고 있는 비구임이 드러나고, 천자는 은혜를 알아 절을 올린다. 높고 오래 서 있는 천궁의 천신을 보고 비구는 물었다, 손에 장신구를 두른 명성 높은 이, 하늘 천궁에서 달과 같은 이에게.</p>
