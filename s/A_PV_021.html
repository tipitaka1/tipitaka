<h1>A_PV_021_앙꾸라</h1>
<p>「우리가 가는 그 까닭」 — 이것은 스승께서 사왓티에 머무실 때 앙꾸라뻬따를 두고 말씀하신 것이다. 여기서 앙꾸라는 아귀가 아니지만, 그의 행적이 아귀와 이어져 있으므로 이를 「앙꾸라뻬따왓투」라고 하였다. 여기서 간추린 이야기는 이러하다 — 북쪽 마두라의 임금인 마하사가라 왕의 아들 우빠사가라에게서, 북쪽 길 깜사의 땅 아시딴자나 성에서 마하깜사의 딸 데와갑바의 태에 태어난 이들이 있었다. 안자나데위와 와수데와, 발라데와, 짠다데와, 수리야데와…</p>
