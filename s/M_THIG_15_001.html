<h1>M_THIG_15_001_이시다시 장로니의 게송</h1>
<p>거듭 소박맞고 지난 생의 업을 본 이 웃제니(Ujjenī) 장자의 외동딸이다. 나이가 차 걸맞은 집에 시집갔으나 한 달 만에 소박맞았고, 뒤의 남편들에게도 거듭 내쳐졌다. 절박해진 끝에 아버지의 허락을 얻어 지나닷따(Jinadattā) 장로니에게 출가했고, 오래지 않아 아라한이 되었다. 빠딸리뿟따에서 걸식을 마치고 강가 모래밭에 앉았을 때, 벗 보디(Bodhī) 장로니가 지난 일을 묻자 이 게송을 읊었다. 꽃 이름을 지닌 도시, 땅의 정수인 빠…</p>
