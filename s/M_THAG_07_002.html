<h1>M_THAG_07_002_라꾼다까밧디야 장로의 게송</h1>
<p>목소리 고운 이 가운데 으뜸인 「작은 밧디야」 사왓티 큰 재산 가문에 나 밧디야(Bhaddiya)라 했다. 키가 아주 작아 라꾼다까밧디야, 곧 「작은 밧디야」로 알려졌다. 전생에 목소리가 고운 이들 가운데 으뜸이 되기를 서원해 수기를 받았고, 이 생에서도 고운 목소리로 법을 설했다. 세존께 법을 듣고 출가했으며, 축제날 수레 위에서 그를 보고 웃은 기녀의 이에서 표상을 잡아 닦음에 들었다. 저 너머 암바따까 동산, 숲 우거진 곳에 밧디야가 있다…</p>
