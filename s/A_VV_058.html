<h1>A_VV_058_두띠야수찌</h1>
<p>「보석 기둥이 선 이 천궁은 높고」란 둘째 수찌 천궁이다. 그 인연은 무엇인가? 세존께서는 라자가하의 웰루와나에 머무셨다. 그때 라자가하에 사는 어떤 바느질꾼이 절을 둘러보려고 웰루와나에 갔다. 거기서 어떤 비구가 웰루와나에서 만든 바늘로 가사를 꿰매고 있는 것을 보고 바늘집과 함께 바늘을 드렸다. 나머지는 모두 앞에서 말한 방식과 같다. 「보석 기둥이 선 이 천궁은 높고 …pe… 그대의 빛이 모든 방향을 비춥니까?」 — 하고 물었다.</p>
