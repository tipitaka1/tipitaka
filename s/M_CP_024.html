<h1>M_CP_024_비사(여덟 남매의 출가)</h1>
<p>까시의 바라문 집안에 여덟 남매의 맏이로 태어났을 때를 말한다. 대를 이으라는 청을 물리치자 부모와 동기들까지 함께 재물을 버리고 숲으로 들어갔다. 또 한때 나는 까시의 으뜸가는 도성에서 누이 하나와 일곱 형제로 학식 있는 바라문 집안에 태어났다.</p>
