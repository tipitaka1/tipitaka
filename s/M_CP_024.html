<h1>M_CP_024_비사(여덟 남매의 출가)</h1>
<p>까시의 바라문 집안에 여덟 남매의 맏이로 태어났을 때를 말한다. 대를 이으라는 청을 물리치자 부모와 동기들까지 함께 재물을 버리고 숲으로 들어갔다. 또 한때 나는 까시의 으뜸가는 도성에서 누이 하나와 일곱 형제로 학식 있는 바라문 집안에 태어났다. 나는 그들 가운데 맏이였고 부끄러움이라는 밝음을 갖추었다. 존재를 두려운 것으로 보고 벗어남을 기뻐했다. 부모가 보낸 벗들이 한마음으로 감각적 욕망으로 나를 청했다. &quot;집안의 대를 이어라.&quot;</p>
