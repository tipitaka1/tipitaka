<h1>M_JA_160_위닐라(분수를 모른 검푸른 새)</h1>
<p>세존께서 웰루와나에 머무실 때, 데와닷따가 선서의 흉내를 낸 일을 두고 하신 말씀이다. 가야시사에 간 두 상수 제자 앞에서 데와닷따가 선서의 흉내를 내어 눕더니 크게 무너졌다고 사리뿟따가 아뢰자, 세존께서는 나를 흉내 내다 무너진 것이 이번만이 아니라 하시고 옛일을 들려주셨다. 옛날 보살은 위데하의 미틸라에서 왕의 아들로 나 왕이 되었다. 그때 황금 백조 왕이 까마귀와 사이에 아들을 두었는데, 어미도 아비도 닮지 않고 검푸르러 위닐라까라 불렀다…</p>
