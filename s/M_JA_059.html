<h1>M_JA_059_베리와다까(쉬지 않고 친 북)</h1>
<p>세존께서 제따와나에 머무실 때, 말을 듣지 않는 비구를 두고 이 말씀을 하셨다. 옛날 보살은 북 치는 집안에 나서 시골 마을에 살았다. 바라나시에 축제가 열렸다는 말을 듣고 아들을 데리고 가 북을 쳐서 많은 돈을 벌었다. 그 돈을 지고 돌아오는 길에 도둑이 드는 숲에 이르자, 쉬지 않고 북을 치는 아들을 말리며 「길 가는 귀인의 북처럼 사이를 두고 쳐라」 했다. 아들은 「북소리로 도둑을 쫓겠다」며 그래도 쉬지 않고 쳤다. 도둑들은 처음에는 귀인…</p>
