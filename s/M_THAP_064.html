<h1>M_THAP_064_아워뿝피야 장로의 아빠다나</h1>
<p>경행처에서 법을 설하실 때 꽃을 허공에 뿌림 시키 부처님께서 경행처에서 네 가지 진리를 설하실 때 갖가지 꽃을 허공에 뿌려 공양한 이야기입니다. 정사에서 나오시어 경행처에 오르시고 네 가지 진리를 밝히시며 죽음 없는 경지를 설하신다. 한결같으신 가장 뛰어난 부처님 시키의 말씀을 알아듣고 갖가지 꽃을 들고 나는 허공에 뿌렸다. 그 업으로 — 두 발 가진 이의 왕이시여, 세상의 어른, 사람 가운데 황소이시여 — 이김과 짐을 버리고 나는 흔들리지 않…</p>
