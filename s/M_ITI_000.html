<h1>M_ITI_000_목차 및 개요</h1>
<p>책 이름은 편마다 끝에 붙는 `iti … vuttaṃ`(이렇게 말씀하셨다)에서 나왔다. 한역 如是語經이 그것을 옮긴 것이다. **112편 전부가 같은 네 마디 틀**로 되어 있다. ① 여는 말   세존께서 이렇게 말씀하셨다. 아라한께서 이렇게 말씀하신 것을 나는 들었다…</p>
