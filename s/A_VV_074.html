<h1>A_VV_074_찟딸라따</h1>
<p>「찟딸라따 숲이 빛나듯이」란 찟딸라따 천궁이다. 그 인연은 무엇인가? 세존께서는 사왓티의 제따 숲에 머무셨다. 그때 사왓티의 어떤 청신사가 가난하고 가진 것이 적어 남의 일을 해 주며 살았다. 그는 믿음이 있고 마음이 맑아 늙고 나이 든 부모를 봉양하면서, 「여자는 남편의 집에 들면 주인 노릇을 하려 하니 시부모의 마음에 들게 하는 이는 얻기 어렵다」 하여 부모의 마음이 상하지 않도록 아내를 들이지 않고 손수 부모를 모셨으며, 계를 지키고 포살…</p>
