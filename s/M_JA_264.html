<h1>M_JA_264_마하빠나다(강에 잠긴 궁전)</h1>
<p>세존께서 강가 강가에 앉으셔서 밧다지 장로의 위력을 두고 하신 말씀이다. 밧디야 성 부호의 외아들 밧다지는 세 철 궁전을 옮겨 다니며 큰 영화를 누리다가, 치장한 채로 세존의 법문을 서서 듣고 아라한이 되어 출가했다. 세존께서 그를 데리고 유행하시다 꼬띠가마에 이르러 배로 강을 건너시며 「밧다지여, 그대가 마하빠나다 왕이던 때 살던 궁전은 어디 있는가」 물으시니 「이 자리에 잠겨 있습니다」 하였다. 범부 비구들이 「없는 것을 말한다」 의심하자 …</p>
