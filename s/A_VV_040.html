<h1>A_VV_040_나가</h1>
<p>「꾸민 그대가 보석과 황금을 박은」이라 한 것은 나가 천궁이다. 그 인연은 무엇인가? 세존께서는 바라나시의 이시빠따나 사슴동산에 머무셨다. 그때 바라나시에 사는 어느 청신녀가 있었으니, 믿음이 있고 마음이 맑으며 계와 행실을 갖춘 이였다. 그녀는 세존을 위하여 옷 한 벌을 짜게 하고 깨끗이 빨게 한 뒤, 다가가 세존의 발치에 놓고 이렇게 아뢰었다. 「세존이시여, 저를 가엾이 여기시어 이 옷 한 벌을 받아 주십시오. 그것이 저에게 오래도록 이익과…</p>
