<h1>M_JA_087_망갈라(조짐 따지는 바라문)</h1>
<p>세존께서 웰루와나에 머무실 때 옷의 표징을 보는 한 바라문을 두고 하신 말씀이다. 그는 조짐을 따지고 삼보를 믿지 않았는데, 함에 둔 옷 두 벌을 쥐가 갉자 불길하다 하여 아들을 시켜 무덤에 버리게 했다. 세존께서는 그 부자가 예류과에 이를 바탕을 갖춘 줄 아시고 무덤 어귀에 앉아 계시다가 아들이 버린 옷을 손수 거두어 가셨다. 바라문이 다른 옷을 가져와 버리시라 하자 「출가자에게는 무덤이나 길가에 버려진 헝겊이면 된다」 하셨다. 옛날 라자가하…</p>
