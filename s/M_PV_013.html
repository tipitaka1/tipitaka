<h1>M_PV_013_상사라모짜까뻬띠(윤회를 벗은 아귀)</h1>
<p>벌거벗고 여윈 아귀 여인이 사리뿟따에게 제 처지를 말하고 공덕을 돌려 달라 청한다. 사리뿟따가 비구들에게 밥과 헝겊과 물을 보시하고 그 공덕을 돌리자, 곧 과보가 나타나 그녀가 천신이 되어 다시 찾아오는 편이다. 그대는 벌거벗고 흉한 모습이며, 여위어 힘줄이 드러났다.</p>
