<h1>M_ITI_028_둑카위하라(괴롭게 머묾)</h1>
<p>세존께서 감각기능의 문을 지키지 않고 음식에 알맞은 양을 모르는 비구는 지금 여기서 괴롭게 머물고 죽은 뒤에도 나쁜 곳이 예상된다고 말씀하신 편이다. 세존께서 이렇게 말씀하셨다. 아라한께서 이렇게 말씀하신 것을 나는 들었다 — 비구들이여, 두 가지 법을 갖춘 비구는 지금 여기서 상함과 절망과 애태움 속에 괴롭게 머문다. 몸이 무너져 죽은 뒤에는 나쁜 곳이 예상된다. 어떤 둘인가? 감각기능의 문을 지키지 않는 것과 음식에 알맞은 양을 모르는 것이…</p>
