<h1>M_VIN_5_14_우빨리빤짜깡(우빨리 다섯 물음)</h1>
<p>그때 부처님이신 세존께서는 사왓티의 제따와나, 아나타삔디까 승원에 머무셨다. 그러자 우빨리 존자는 세존께 다가갔다; 다가가서 세존께 절을 올리고 한쪽에 앉았다. 한쪽에 앉은 우빨리 존자는 세존께 이렇게 여쭈었다 — 「세존이시여, 몇 가지 요소를 갖춘 비구가 평생토록 의지처 없이 지내서는 안 됩니까?」 우빨리여, 다섯 가지 요소를 갖춘 비구는 평생토록 의지처 없이 지내서는 안 된다. 어떤 다섯인가? 포살을 알지 못하고, 포살 갈마를 알지 못하고,…</p>
