<h1>M_JA_178_깟차빠(못을 떠나지 못한 거북)</h1>
<p>세존께서 제따와나에 머무실 때, 돌림병에서 벗어난 한 사람을 두고 하신 말씀이다. 사왓티의 한 집안에 돌림병이 돌자 부모가 아들에게 이 집에 있지 말고 벽을 헐고 달아나 목숨을 지키라 하고, 뒤에 돌아와 어느 자리에 묻어 둔 큰 재물을 파내어 살림을 세우라 했다. 아들은 그대로 하여 병이 가라앉은 뒤 돌아와 재물을 파내어 살림을 세웠다. 어느 날 그가 제따와나에 가 뵙자 세존께서 어떻게 벗어났느냐 물으셨고, 그가 아뢰니 세존께서 예전에도 두려움…</p>
