<h1>M_THAG_02_001_웃따라 장로의 게송</h1>
<p>대신이 주려던 사위 자리를 물리친 이 라자가하 큰 바라문 집안의 아들 웃따라(Uttara). 태생과 용모, 학문과 나이, 계행으로 세상의 존경을 받아 마가다의 대신 왓사까라가 딸을 주려 했으나, 벗어남에 뜻을 두어 물리쳤다. 법의 장군 사리뿟따(Sāriputta)를 자주 찾아 법을 듣고 믿음을 얻어 출가해 그를 시봉했다. 사미이던 때 스승의 약을 구하러 가던 길에, 쫓기던 도둑이 그 발우에 훔친 보물을 넣고 달아나는 바람에 도둑으로 몰려 왓사까…</p>
