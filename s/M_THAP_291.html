<h1>M_THAP_291_붓두빳타이까 장로의 아빠다나</h1>
<p>아버지의 손에 이끌려 큰 성자께 나아가 부처님들을 정성껏 섬긴 이야기입니다. 웨땀비니가〔주1〕 내 이름이었다. 그때 나는 아버지 곁에 있었다.〔주2〕 아버지는 내 손을 잡고 큰 성자께로 데려가셨다. 세상의 으뜸가는 인도자이신 이 부처님들께서 나를 가르치시리라.</p>
