<h1>M_JA_348_아란냐(마을을 모르는 아들)</h1>
<p>세존께서 제따와나에 머무실 때, 한 처녀의 꾐을 두고 하신 말씀이다. 주석은 그 사연이 쭐라나라다 자따까에 자세히 나온다며 넘기는데, 거기서는 사왓티의 한 집에 시집가지 못한 딸이 있어 그 어미가 딸로 비구 하나를 꾀어 환속시켜 그를 의지해 살려 했다. 배움을 버리고 몸치장에 힘쓰던 젊은 비구가 음식에 걸려 그 집을 드나들다 마침내 그 딸에게 홀렸다. 옛날 바라나시에서 보살은 바라문 집에 나 딱까실라에서 배우고, 아내가 죽자 아들을 데리고 선인…</p>
