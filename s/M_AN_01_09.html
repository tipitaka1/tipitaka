<h1>M_AN_01_09_빠마다디(방일 등)</h1>
<p>비구들이여, 명성이 느는 것은 사소한 늚이다. 비구들이여, 여러 늚 가운데 으뜸은 지혜가 느는 것이다. 그러므로 비구들이여, 이렇게 익혀야 한다 – &#x27;우리는 지혜가 자라남으로 자라나리라&#x27;라고. 비구들이여, 그대들은 이렇게 공부해야 한다. 첫 번째. 비구들이여, 이것만큼 이토록 큰 손해로 이끄는 다른 하나의 법도 나는 보지 못한다. 곧, 비구들이여, 방일이 그러하다. 비구들이여, 방일은 큰 해로움으로 이끈다. 두 번째.</p>
