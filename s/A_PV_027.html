<h1>A_PV_027_사나와싯테라</h1>
<p>「꾼디나가라 출신의 장로」라는 이것은 스승께서 웰루와나에 머무실 때 사나와시 장로 존자의 아귀가 된 친족을 두고 말씀하신 것이다. 지난 옛날 바라나시에서 끼따와라는 왕의 아들이 동산에서 놀다 돌아오는 길에, 수넷따라는 빳쩨까붓다가 탁발을 마치고 성을 나서는 것을 보았다. 그는 권세에 취해 「어찌하여 이 까까머리가 나에게 합장도 하지 않고 가는가」 하고 마음이 뒤틀려, 코끼리 등에서 내려 「탁발 음식은 얻었는가」 하고 말을 걸며 손에서 발우를 빼…</p>
