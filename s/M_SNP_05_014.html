<h1>M_SNP_05_014_우다야마나와뿟차(우다야의 물음)</h1>
<p>우다야 바라문 학도가 완전한 앎에 의한 해탈과 무명을 깨뜨림을 여쭙는 편이다. 세존께서는 감각적 욕망에 대한 바람과 근심을 버리고 평온과 사띠로 맑아진 자리를 그것이라 밝히시고, 세상이 즐김에 묶여 있어 갈애를 버림이 열반이며, 안팎의 느낌을 기뻐하지 않는 이에게 의식이 그친다고 이르신다. 선정에 들어 티끌 없이 앉아 계신 분, (우다야 존자가 말했다) 할 일을 다 마쳐 번뇌 없는 분, 모든 현상의 저 언덕에 이르신 분께 물음이 있어 왔습니다.</p>
