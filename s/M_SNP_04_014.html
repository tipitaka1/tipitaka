<h1>M_SNP_04_014_뚜와따까(고요에 이르는 길)</h1>
<p>묻는 이가 홀로 있음과 고요의 자리를 여쭙자, 세존께서 「나는 있다」는 생각의 뿌리를 끊는 데서 시작해 답하시는 편이다. 이어 그 길을 다시 청하자 비구가 날마다 지킬 것을 조목조목 이르신다. 태양의 후예시여, 여쭙습니다. 홀로 있음과 고요의 자리를, 큰 선인이시여. 비구는 무엇을 보고 열반에 들며, 세상에서 아무것도 붙들지 않습니까. 희론에서 난 헤아림, 그 뿌리를 (세존께서 말씀하셨다) 「나는 있다」는 생각까지 헤아려 알아 남김없이 그쳐라.</p>
