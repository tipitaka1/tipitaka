<h1>M_VV_002_두띠야삐타(둘째 의자 천궁)</h1>
<p>목갈라나 존자가 묘안석 자리를 타고 다니는 천신에게 그 빛이 어떤 업의 과보인지 묻고, 천신은 찾아온 이에게 자리를 내어 주고 절하고 합장하며 힘닿는 대로 보시한 일을 답한다. 묘안석으로 만든 그대의 훌륭한 자리는 마음처럼 빨라 가고 싶은 곳으로 갑니다. 꾸미고 화환을 걸고 고운 옷을 입은 그대는 먹구름 속 번개처럼 빛납니다. 무엇으로 그대의 빛이 이러하고, 무엇으로 그대는 여기서 번영합니까? 마음에 드는 온갖 재물이 그대에게 생겨납니까?</p>
