<h1>M_AN_02_12_아야짜나(바르게 원함)</h1>
<p>비구들이여, 믿음 있는 비구가 바르게 원한다면 이렇게 원해야 한다 — 「사리뿟따와 목갈라나 같은 이가 되기를」. 비구들이여, 나의 제자 비구들의 저울이자 척도가 바로 사리뿟따와 목갈라나다. 비구들이여, 믿음 있는 비구니가 바르게 원한다면 이렇게 원해야 한다 — 「케마 비구니와 웁빨라완나 같은 이가 되기를」. 비구들이여, 나의 여제자 비구니들의 저울이자 척도가 바로 케마 비구니와 웁빨라완나다. 비구들이여, 믿음 있는 청신사가 바르게 원한다면 이렇…</p>
