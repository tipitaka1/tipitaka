<h1>M_SNP_05_015_뽀살라마나와뿟차(뽀살라의 물음)</h1>
<p>뽀살라 바라문 학도가 물질에 대한 지각이 사라지고 안팎으로 아무것도 없다고 보는 이를 어떻게 이끄는지 여쭙는 편이다. 세존께서는 여래가 의식이 머무는 자리를 모두 곧바로 아신다 하시고, 아무것도 없음이 어떻게 생겨나는지 알고 즐김이 족쇄인 줄 알아 거기서 꿰뚫어 보는 것이 그 앎이라고 이르신다. 지난 일을 밝히시는 분, (뽀살라 존자가 말했다) 흔들림 없고 의심을 끊으신 분, 모든 현상의 저 언덕에 이르신 분께 물음이 있어 왔습니다.</p>
