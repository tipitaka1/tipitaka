<h1>M_THAG_05_007_가야깟사빠 장로의 게송</h1>
<p>가야에서 이백 제자를 이끌던 깟사빠 바라문 집안에 태어나 집을 마다하고 고행자로 출가한 가야깟사빠(Gayākassapa)다. 이백 명의 고행자와 함께 가야에 살고 성이 깟사빠여서 「가야의 깟사빠」라 불렸다. 우루웰라깟사빠·나디깟사빠와 형제로 셋 가운데 막내다. 세존께서 그와 그 무리에게 「오라, 비구여」로 구족계를 주셨고, 불타오름의 법문으로 이끄시자 아라한이 되었다. 뒤에 자기가 걸어온 길을 돌아보며 악을 씻어 낸 일을 들어 이 게송을 읊었다…</p>
