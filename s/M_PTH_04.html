<h1>M_PTH_04_선 삼법</h1>
<p>…이 장에는 자리 1,141개가 더 있다. 전체는 MPTH77조건관계 매트릭스 에 모았다. 〔성립하는 조건의 수 — 실측 2,876건〕 이 수는 「참인 명제의 수」가 아니라 스물네 조건 × 법의 짝 × 일곱 장 × 네 논에서 성립한다고 셈해진 자리의 수다. 다른 장의 수와 견주는 데 뜻이 있지 그 자체를 외울 것이 아니다. 〔팔리 원문〕 되풀이가 지루한 것이 흠이 아니다. 빳타나는 「빠짐없이 훑었다」를 보이는 것이 목적이라, 성립하지 않는 자리…</p>
