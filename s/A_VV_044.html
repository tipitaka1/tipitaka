<h1>A_VV_044_짜뚜릿티</h1>
<p>「눈부신 빛으로」라 한 것은 짜뚜릿티 천궁이다. 그 인연은 무엇인가? 세존께서 사왓티에 머무실 때, 마하목갈라나 존자가 앞에서 말한 방식대로 천상을 다니다가 삼십삼천에 이르렀다. 그는 거기 나란히 선 네 천궁에서 저마다 천 명의 천녀를 거느리고 하늘의 성취를 누리는 네 천녀를 보고, 그들이 지난날 지은 업을 물으며 — 눈부신 빛으로 …pe… 그대의 빛이 모든 방향을 비춥니까?」 — 이 게송들로 차례로 물었다. 그들도 그가 묻자 곧 차례로 답하였…</p>
