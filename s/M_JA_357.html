<h1>M_JA_357_라뚜끼까(메추라기의 앙갚음)</h1>
<p>세존께서 웰루와나에 머무실 때, 데와닷따를 두고 하신 말씀이다. 비구들이 법당에서 「데와닷따는 모질고 거칠고 사나워 중생에게 가엾이 여기는 마음이 조금도 없다」 하자 세존께서 「비구들이여, 지금만이 아니다. 전에도 가엾이 여김이 없었다」 하시고 옛일을 드셨다. 옛날 바라나시에서 보살은 코끼리로 나 팔만 마리를 거느린 무리의 우두머리가 되어 히말라야에 살았다. 그때 메추라기 한 마리가 코끼리들이 다니는 자리에 알을 낳아 새끼가 깨었는데 아직 날지…</p>
