<h1>M_JA_108_바히야(부끄러움 지킨 여인)</h1>
<p>세존께서 웨살리 중각강당에 머무실 때, 한 릿차위를 두고 하신 말씀이다. 그는 부처님과 승가를 청해 크게 보시했는데, 그의 아내는 몸이 굵고 볼품이 없었다. 비구들이 「저토록 잘생긴 이가 어떻게 저런 아내와 즐거워하는가」 하자 세존께서 「지금만이 아니다」 하시며 옛일을 들려주셨다. 옛날에 보살은 바라나시 왕의 대신이었다. 품을 팔던 몸집 큰 시골 여인이 왕궁 뜰 가까이에서 뒤가 급해지자, 부끄러움과 두려워함을 버리지 않고 옷으로 몸을 가린 채 …</p>
