<h1>M_THIG_05_005_난둣따라 장로니의 게송</h1>
<p>잠부 가지를 들고 논쟁하던 니간타 꾸루의 깜마사담마(Kammāsadhamma) 마을 바라문 집안에 태어나 여러 학문과 기예를 익힌 뒤 니간타(Nigaṇṭha)로 출가했다. 논쟁을 즐겨 잠부 나뭇가지를 들고 온 잠부디빠를 돌아다녔다. 마하목갈라나(Mahāmoggallāna) 존자를 찾아가 물음을 던졌다가 지고, 그 가르침에 따라 세존의 가르침에 출가하여 오래지 않아 아라한이 되었다. 예전에 하던 고행과 지금을 견주어 이 게송을 읊었다. 불과 달과…</p>
