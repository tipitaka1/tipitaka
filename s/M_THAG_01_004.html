<h1>M_THAG_01_004_뿐나 장로의 게송</h1>
<p>꼰단냐의 조카, 설법제일 까삘라왓투에서 멀지 않은 도나왓투 바라문 마을의 큰 바라문 집안에, 안냐시꼰단냐(Aññāsikoṇḍañña) 장로의 조카로 태어나 뿐나라 이름했다. 외숙인 꼰단냐 장로 밑에서 출가해 구족계를 받고, 세존을 뵈러 가지 않고 까삘라왓투 가까이 홀로 남아 마음을 근원에서부터 기울여 위빳사나를 키워 아라한이 되었다. 앞선 생에 빠두뭇따라 부처님께 법을 설하는 이 가운데 으뜸이 되기를 서원해 수기를 받았다. 참된 이들과 사귀라고…</p>
