<h1>M_JA_022_꾹꾸라(개들을 살린 개 왕)</h1>
<p>세존께서 제따와나에 머무실 때, 친족을 이롭게 하신 일을 두고 하신 말씀이다. 그 일은 열두 게송 모음의 밧다살라 자따까에서 밝혀진다. 옛날 바라나시에서 브라흐마닷따가 다스릴 때, 보살은 개로 태어나 수백 마리를 거느리고 큰 무덤터에 살았다. 어느 밤 왕의 수레가 비에 젖자 궁 안 개들이 내려와 가죽과 가죽끈을 뜯어 먹었다. 왕이 노하여 보이는 대로 개를 죽이라 명하자 개들이 무덤터로 달아나 보살에게 왔다. 보살은 궁 안 개들의 짓임을 헤아리고…</p>
