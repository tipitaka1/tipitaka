<h1>M_THIG_04_001_밧다까삘라니 장로니의 게송</h1>
<p>전생을 기억함에 으뜸, 마하깟사빠의 옛 아내 사갈라(Sāgala)의 꼬시야 가문 바라문의 딸로 태어나, 마하띳타 마을의 삔팔리 꾸마라(Pipphali Kumāra), 곧 뒷날의 마하깟사빠(Mahākassapa)에게 시집갔다. 남편이 출가하러 집을 나서자 큰 재산도 일가붙이도 버리고 자기도 뒤따라 출가했다. 전생에 빠두뭇따라(Padumuttara) 부처님 곁에서 전생을 기억하는 비구니 가운데 으뜸인 분을 뵙고 그 자리를 서원한 이다. 깟사빠 장로…</p>
