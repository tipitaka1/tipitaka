<h1>M_JA_379_네루(가림 없는 산을 떠나다)</h1>
<p>세존께서 제따와나에 머무실 때, 어떤 비구를 두고 하신 말씀이다. 그는 명상 주제를 받아 변두리 마을에 갔는데, 사람들이 처음에는 그를 받들다가 영원하다는 자들이 오자 그리로 옮기고, 다시 끊어진다는 자들에게, 다시 벗은 고행자들에게로 옮겨 갔다. 좋고 나쁨을 가리지 못하는 이들 곁에서 괴롭게 안거를 지내고 돌아와 아뢰니, 세존께서는 「옛 현자들은 짐승으로 나서도 그런 자들과 하루도 함께 살지 않았다」 하시고 옛일을 드셨다. 옛날 바라나시 시절…</p>
