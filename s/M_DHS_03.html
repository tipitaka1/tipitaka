<h1>M_DHS_03_루빠깐다 (물질)</h1>
<p>어떤 법들이 무기(無記, 그 어느 쪽도 아닌 법)인 법인가? 유익한 법과 해로운 법의 과보로서 감각적 욕망의 세계에 속하거나 물질의 세계에 속하거나 물질 없는 세계에 속하거나 딸리지 않은 느낌의 무더기와 지각의 무더기와 형성의 무더기와 의식의 무더기, 작용일 뿐이어서 유익하지도 해롭지도 않고 업의 과보도 아닌 법들이며, 모든 물질, 그리고 형성되지 않은 요소 — 이 법들이 무기인 법이다. 여기서 어떤 것이 모든 물질인가? 네 큰 요소와, 네 큰…</p>
