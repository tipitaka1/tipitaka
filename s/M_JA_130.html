<h1>M_JA_130_꼬시야(꾀병에 맞는 약)</h1>
<p>세존께서 제따와나에서 사왓티의 한 여인을 두고 하신 말씀이다. 믿음 깊은 청신사 바라문의 아내인데, 계를 지키지 않고 밤이면 나다니고 낮에는 앓는 척했다. 「바람이 쑤신다」 하며 기름지고 단 음식을 달라 했고 바라문은 다 해 주었다. 사정을 아뢰자 세존께서는 「옛 현자들도 그런 병에 쓸 약을 일러 주었다」 하시고 옛일을 드셨다. 옛날 보살은 바라나시의 이름난 스승이었고, 그 밑에서 배운 학인의 아내도 그러했다. 보살은 알아채고 약을 일러 주었다…</p>
