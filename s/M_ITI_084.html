<h1>M_ITI_084_바후자나히따(많은 이의 이익)</h1>
<p>세상에 나타나 많은 사람을 이롭게 하는 세 부류의 사람을 세존께서 말씀하신 편이다. 여래와, 아라한인 제자와, 아직 배우는 제자가 그 셋이다. 세존께서 이렇게 말씀하셨다. 아라한께서 이렇게 말씀하신 것을 나는 들었다 — 세 부류의 사람이 세상에 나타날 때, 그들은 많은 사람의 이익을 위해, 많은 사람의 행복을 위해, 세상을 가엾이 여겨, 신과 인간의 유익과 이로움과 행복을 위해 나타난다. 어떤 셋인가? 비구들이여, 여기 여래가 세상에 나타난다.…</p>
