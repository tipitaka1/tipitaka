<h1>M_THAG_03_016_위말라 장로의 게송</h1>
<p>바라나시 바라문 집안에서 태어났다. 소마밋따(Somamitta) 장로를 의지해 출가했고, 그의 권유로 위빳사나를 시작하여 오래지 않아 아라한이 되었다. 벗인 비구에게 훈계를 주면서 이 게송을 읊었다. 나쁜 벗을 멀리하고 으뜸가는 사람을 가까이하라.</p>
