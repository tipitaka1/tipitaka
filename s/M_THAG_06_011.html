<h1>M_THAG_06_011_Nhātakamuni 장로의 게송</h1>
<p>들벼를 먹으며 불을 섬기던 고행자 라자가하 바라문 가문에 나 학문을 다 이루었고, 베다 학업을 마친 표징을 따라 Nhātaka로 불렸다. 고행자로 집을 떠나 숲에서 들벼로 연명하며 불을 섬겼는데, 세존께서 찾아와 사흘 공양을 받으신 뒤 성스러운 만족을 설하시니 예류자가 되어 출가하고 아라한이 되었다. 뒤에 풍병에 시달릴 때 세존께서 안부를 물으시자 그에 답해 이 게송을 읊었다. 그대는 풍병에 시달리며 숲, 인적 없는 수풀에 머문다. 걸식할 곳도…</p>
