<h1>A_VV_004_짜뚯타삐타</h1>
<p>「묘안석으로 만든 그대의 자리는」이란 넷째 자리 천궁이다. 이것의 이야기도 라자가하에서 일어났으니, 둘째 천궁에서 말한 방식대로 알아야 한다. 푸른 천을 깔아 걸상을 드렸으므로 이 여인의 천궁도 묘안석으로 되었다. 나머지는 첫째 천궁에서 말한 것과 같다. 그래서 이렇게 말하였다 — 「묘안석으로 만든 그대의 훌륭한 자리는, 마음처럼 빨라 가고 싶은 곳으로 갑니다; 꾸미고 화환을 걸고 고운 옷을 입은 그대는, 먹구름 속 번개처럼 빛납니다.</p>
