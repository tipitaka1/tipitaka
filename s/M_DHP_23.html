<h1>M_DHP_23_나가왁가 (코끼리품)</h1>
<p>싸움터의 코끼리가 화살을 견디듯 험한 말을 견디라 하고, 잘 길들인 코끼리보다 자기를 길들인 이가 낫다고 말하는 품이다. 뒤쪽에서는 진창에 빠진 코끼리, 숲 속의 코끼리에 빗대어 벗을 만나는 일과 홀로 가는 일, 그리고 무엇이 즐거움인지를 이어 읊는다. 싸움터의 코끼리가 활에서 날아온 화살을 견디듯, 나는 험한 말을 견디리라. 뭇사람은 계를 지키지 않기 때문이다. 길들여진 것을 모임으로 끌고 가고, 길들여진 것에 왕이 올라탄다.</p>
