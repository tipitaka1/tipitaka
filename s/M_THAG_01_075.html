<h1>M_THAG_01_075_수사라다 장로의 게송</h1>
<p>어수룩하다 불리던 사리뿟따의 친척 수사라다(Susārada)는 법의 대장군 사리뿟따(Sāriputta) 존자의 친척 바라문 집안에서 태어났다. 슬기가 무디어 「수사라다(아주 어수룩한 이)」라는 이름을 얻었다. 뒷날 사리뿟따 존자께 법을 듣고 믿음을 얻어 출가했고, 위빳사나를 늘려 아라한이 되었다. 참된 이를 가까이한 덕을 기려 자신이 얻은 것을 밝히며 이 게송을 읊었다. 잘 다스려진 이들을 뵙는 것은 좋다. 의심이 끊기고 슬기가 자란다. 어리석…</p>
