<h1>M_PE_5_하라위방가 (전달을 갈라 밝힘)</h1>
<p>다섯째 자리. 열여섯 전달을 하나씩 갈라 밝힌다. 넷띠의 「빠띠닛데사와라」에 해당한다. 거기서 어떤 것이 전달을 갈라 밝힘인가? 거기서 열여섯 전달이 글자마다 갈라진다. 거기서 처음에 오는 것이 가르침의 전달이다. 거기서 이 게송은 유익한 것이거나 해로운 것이거나 진리이거나 진리의 한 부분이다. 「무엇이 설해졌는가?」 하고 경에서 따져 보는 것이 가르침의 전달이다. 이를테면 성스러운 진리들을 놓음이니, 네 가지 진리는 공통된 것이기도 하고 공통…</p>
