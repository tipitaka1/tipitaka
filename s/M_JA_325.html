<h1>M_JA_325_고다라자(도마뱀을 노린 고행자)</h1>
<p>세존께서 제따와나에 머무실 때, 속임수를 쓰는 어떤 비구를 두고 하신 말씀이다. 사연은 앞에서 자세히 말한 것과 같다고 주석은 넘긴다. 여기서도 비구들이 그를 데려와 「존자시여, 이 비구는 속이는 자입니다」 아뢰자, 세존께서 「지금만이 아니라 전에도 속이는 자였다」 하시고 옛일을 드셨다. 옛날 바라나시에서 브라흐마닷따가 다스릴 때, 보살은 큰도마뱀으로 태어나 몸의 힘을 갖추고 숲에 살았다. 계를 지키지 않는 고행자가 그 가까이에 잎 오두막을 짓…</p>
