<h1>M_JA_090_아까딴뉴(은혜 모르는 벗)</h1>
<p>세존께서 제따와나에 머무실 때 아나타삔디까를 두고 하신 말씀이다. 그에게는 얼굴도 모르는 변방 부호 벗이 있었다. 그 벗이 수레 오백 대에 물건을 채워 보내자 아나타삔디까는 사람들에게 묵을 곳과 노자를 주고 물건을 팔아 바꿔 보냈다. 뒤에 아나타삔디까가 오백 대를 보내자 변방 부호는 그 이름을 비웃고 선물만 받은 채 그냥 돌려보냈다. 세 번째로 그가 다시 보내자 아나타삔디까의 사람들이 수레를 성 밖에 세우게 하고 한밤중에 모두 털고 소를 몰아내…</p>
