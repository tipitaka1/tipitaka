<h1>M_SNP_01_003_칵가위사나(무소의 뿔)</h1>
<p>「무소의 뿔처럼 홀로 가라」가 마흔한 게송에 후렴처럼 되풀이된다. 어울리는 데서 애정이 생기고 애정을 따라 괴로움이 온다는 데서 시작해, 벗과 자식과 살림을 두고 홀로 가는 삶을 하나하나 들어 보인다. 다만 §45와 §46 두 게송은 좋은 벗을 얻거든 함께 가라 이르며 후렴이 달라진다. 모든 존재에게 몽둥이를 내려놓고, 그 가운데 어느 하나도 해치지 말고, 자식도 바라지 말라, 하물며 벗이랴. 무소의 뿔처럼 홀로 가라.</p>
