<h1>M_AN_01_14_에따닥가(으뜸가는 제자)</h1>
<p>비구들이여, 내 제자 비구들 가운데 출가한 지 오래된 이로 으뜸은 안냐시꼰단냐(Aññāsikoṇḍañña)다. … 큰 지혜를 지닌 이로는 사리뿟따다. … 신통을 지닌 이로는 마하목갈라나(Mahāmoggallāna)다. … 두타행을 말하는 이로는 마하깟사빠(Mahākassapa)다. … 하늘 눈을 지닌 이로는 아누룻다(Anuruddha)다. … 높은 가문에서 나온 이로는 깔리고다(Kāḷigodhā)의 아들 밧디야(Bhaddiya)다.</p>
