<h1>M_JA_401_빤나까(왕비를 잊게 한 현자)</h1>
<p>세존께서 제따와나에 머무실 때, 옛 아내에게 마음이 끌린 비구를 두고 하신 말씀이다. 세존께서는 「전에도 그대는 이 여인 때문에 마음의 병으로 죽게 되었다가 현자에게 기대어 목숨을 얻었다」 하시고 옛일을 드셨다. 옛날 바라나시의 맛다와 대왕 때에 보살은 바라문 집안에 나 「세나까 현자」로 알려진 대신이 되었다. 왕의 제관 아들이 왕비에게 마음이 묶여 굶고 눕자 왕은 이레 동안 왕비를 주었는데, 둘이 서로 끌려 달아나 버렸다. 왕은 슬픔으로 뱃속…</p>
