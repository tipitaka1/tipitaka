<h1>M_THIG_01_015_웃따라 장로니의 게송</h1>
<p>궁을 버리고 고따미를 좇은 후궁 사꺄 집안에 나서 보살의 후궁이었다가 마하빠자빠띠 고따미(Mahāpajāpatī Gotamī)와 함께 궁을 나와 출가했다. 주석서는 내력이 띳사(Tissā) 장로니와 같다고 적었다. 세존께서 빛을 놓아 읊어 주신 게송으로 아라한이 되고서, 스스로 벅차 이 게송을 읊었다. 몸으로 단속하였다, 말로도 마음으로도. 갈애를 뿌리째 뽑아, 나는 서늘해졌고 꺼졌다.</p>
