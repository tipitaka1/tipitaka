<h1>M_ITI_001_로바(탐욕을 버림)</h1>
<p>탐욕 한 가지를 버리면 불환과를 보증하겠다고 세존께서 말씀하시고, 탐욕에 물든 중생은 나쁜 곳으로 가지만 그것을 바르게 알아 버린 이는 이 세상에 다시 돌아오지 않는다고 게송으로 이으신 편이다. 세존께서 이렇게 말씀하셨다. 아라한께서 이렇게 말씀하신 것을 나는 들었다 — 비구들이여, 한 가지 법을 버려라. 내가 그대들에게 불환과를 보증하겠다. 어떤 한 가지 법인가? 비구들이여, 탐욕이라는 한 가지 법을 버려라. 내가 그대들에게 불환과를 보증하겠…</p>
