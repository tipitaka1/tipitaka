<h1>M_AN_09_01_삼보디(깨달음이 익는 조건)</h1>
<p>이와 같이 나는 들었다. 한때 세존께서는 사왓티의 제따와나, 아나타삔디까 승원에 머무셨다. 거기서 세존께서 비구들을 부르셨다 — 비구들이여, 만일 외도 유행자들이 이렇게 묻는다면 — 「도반들이여, 깨달음에 이바지하는 법들을 닦는 데는 무엇이 바탕이 됩니까?」 비구들이여, 그렇게 물음을 받으면 너희는 그 외도 유행자들에게 그대들은 어떻게 대답하겠는가?」 「저희에게는 세존께서 뿌리이시고, 세존이시여, 법은…pe… 세존께 듣고서 비구들이 지닐 것입니…</p>
