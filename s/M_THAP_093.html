<h1>M_THAP_093_수다삔디야 장로의 아빠다나</h1>
<p>싯닷타 탑의 틈을 회반죽으로 메운 이 싯닷타 부처님의 탑에 갈라진 틈을 회반죽 덩이로 메워 드린 이야기입니다. 공양받으실 만한 분들께 공양하는 이에게 — 부처님이든 제자들이든, 희론을 뛰어넘으시고 슬픔과 비탄을 건너신 분들께 — 그와 같이 고요해지시고 어디서도 두려움 없는 분들께 공양하는 이의 공덕은 누구도 이만큼이라고 헤아릴 수 없다. 여기서 네 대륙의 주인 노릇을 한다 해도 그것은 한 번의 공양의 십육분의 일에도 미치지 못한다. 사람 가운데…</p>
