<h1>M_PTH_71_역순론 삼법 빳타나</h1>
<p>〔성립하는 조건의 수 — 실측 27건〕 순역론과 역순론은 부정을 어느 자리에 거는가만 다른 짝이지만 서로의 거울이 아니다. 뽑힌 숫자만 견주어도 65↔27, 225↔136, 101↔153처럼 어긋나고, 어느 쪽이 늘 크다고도 못 한다. 〔성립하는 조건의 수 — 실측 27건〕 조건 관계에는 방향이 있다. 앞자리는 조건이 되는 법, 뒷자리는 그 조건에서 생기는 법이다. 이 방향을 놓치면 순역론과 역순론이 같은 말로 보인다.</p>
