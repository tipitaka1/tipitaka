<h1>M_THIG_01_004_띳사 장로니의 게송</h1>
<p>보살의 후궁이었다 출가한 이 까삘라왓투의 사꺄 왕족 집안에 태어나 자라서는 보살의 후궁이 되었다. 뒤에 마하빠자빠띠 고따미(Mahāpajāpatī Gotamī)와 함께 궁을 나와 출가하여 위빳사나를 닦았다. 세존께서 빛을 놓아 앞에 계신 듯 모습을 보이시고 이 게송을 읊으셨고, 그 게송을 듣고 아라한이 되었다. 띳사여, 배울 것을 배우라. 매임이 그대를 덮치지 못하게 하라. 모든 매임에서 풀려나, 번뇌 없이 세상을 다니라. 〔§4〕 「배울 것」…</p>
