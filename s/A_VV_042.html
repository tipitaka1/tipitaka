<h1>A_VV_042_깐지까다이까</h1>
<p>「눈부신 빛으로」라 한 것은 깐지까다이까 천궁이다. 그 인연은 무엇인가? 세존께서 안다까윈다에 머무셨다. 그때 세존의 배에 바람의 병이 생겼다. 세존께서는 아난다 존자를 부르셨다. 「아난다여, 그대는 탁발하러 다니다가 내 약으로 쓸 신 죽을 얻어 오라.」 「그리하겠습니다, 세존이시여」 하고 아난다 존자는 세존께 대답한 뒤, 대왕이 올린 발우를 들고 제 시중드는 의사의 집 문 앞에 섰다. 그를 보고 의사의 아내가 마주 나와 절하고 발우를 받아 들…</p>
