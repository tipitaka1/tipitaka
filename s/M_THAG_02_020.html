<h1>M_THAG_02_020_시리마 장로의 게송</h1>
<p>사왓티(Sāvatthī) 장자 집안에 태어났다. 그가 난 날부터 집안이 번영하였다 하여 시리마라 이름하였고, 걸음마를 뗄 무렵 태어난 아우는 시리왓다(Sirivaḍḍha)라 하였다. 형제가 함께 제따와나(Jetavana) 봉헌 때 부처님의 위력을 보고 믿음을 얻어 출가…</p>
