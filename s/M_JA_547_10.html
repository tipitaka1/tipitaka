<h1>M_JA_547_10_삭까빱바(아내마저 보시하다)</h1>
<p>삭까는 「어떤 낮은 자가 와서 맛디마저 청해 데려가면 저이가 홀로 남으리라. 내가 청해 완성의 꼭대기를 잡게 하고 다시 맡겨 누구도 청하지 못하게 하리라」 하고 해 뜰 무렵 바라문 모습으로 내려왔다. 안부를 나눈 뒤 아내를 청하니 보살은 흔들림 없이 물을 부어 주었고, 그때 온갖 조짐이 나타났다. 맛디는 찌푸리지도 울지도 않고 잠자코 바라보며 「남편이 주인이니 팔든 죽이든 그의 뜻이다」 하였다. 삭까는 그 뜻을 기려 맛디를 도로 맡긴 뒤 제 모…</p>
