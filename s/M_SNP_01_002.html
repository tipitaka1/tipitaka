<h1>M_SNP_01_002_다니야(소치는 다니야)</h1>
<p>마히 강가에서 소를 치는 다니야가 살림이 넉넉해 비가 와도 걱정 없다며 「바란다면 비를 내려라」 하고 읊자, 세존께서 같은 가락에 말을 하나씩 맞바꾸어 답하신다. 오두막과 불, 아내와 마음, 소와 말뚝이 나란히 놓인다. 큰비가 내린 뒤 다니야는 아내와 함께 귀의하고, 끼어든 마라가 아들과 소의 기쁨을 말하자 세존께서 그 말을 그대로 되돌려 주신다. 밥은 지었고 젖도 짜 두었다 — (소치기 다니야가 말했다) 마히 강가에서 식구들과 함께 산다.</p>
