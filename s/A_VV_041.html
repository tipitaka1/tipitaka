<h1>A_VV_041_알로마</h1>
<p>「눈부신 빛으로」라 한 것은 알로마 천궁이다. 그 인연은 무엇인가? 세존께서 바라나시의 이시빠따나 사슴동산에 머무실 때, 오전에 옷을 갖추어 입으시고 발우와 가사를 들고 바라나시로 탁발하러 드셨다. 거기에 알로마라는 가난한 여인이 있었는데, 세존을 뵙고 마음이 맑아져 달리 드릴 것이 없자 「이런 것이라도 세존께 올리면 저에게 큰 과보가 되리라」 하고 생각하여, 빛깔이 바래고 소금기도 없는 마른 보리떡을 올렸고 세존께서는 받으셨다. 그녀는 그 보…</p>
