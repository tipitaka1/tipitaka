<h1>M_SN_28_사리뿟따(사리뿟따)</h1>
<p>한때 사리뿟따 존자가 사왓티의 제따와나, 아나타삔디까 승원에 머물렀다. 그러자 사리뿟따 존자는 오전에 옷을 입고 발우와 가사를 들고 사왓티로 탁발하러 들어갔다. 사왓티에서 탁발한 뒤, 공양을 마치고 탁발에서 돌아와 낮 동안 머물기 위해 안다와나로 갔다. 안다와나로 들어가 어떤 나무 아래에 낮 동안 머물려고 앉았다. 그때 사리뿟따 존자는 해 질 무렵 홀로 앉음에서 일어나 제따와나의 아나타삔디까 승원으로 갔다. 아난다 존자는 사리뿟따 존자가 멀리서…</p>
