<h1>A_PV_050_셋티뿟따</h1>
<p>「육만 해가」 — 이것은 셋티뿟따 아귀 이야기다. 그 인연은 무엇인가? 세존께서는 사왓티의 제따 숲에 머무셨다. 그때 꼬살라의 빠세나디 왕이 몸을 꾸미고 차려입고 훌륭한 코끼리 등에 올라 큰 왕의 위세와 큰 왕의 위력으로 성안을 돌아보고 있었다. 그러다 어떤 집 위층 누각에서 창을 열고 그 왕의 행차를 내려다보는, 모습이 빼어나 하늘의 천녀 같은 한 여인을 보았다. 전에 본 적 없는 대상에 갑자기 일어난 번뇌의 움직임에 마음이 사로잡혀, 궁 안…</p>
