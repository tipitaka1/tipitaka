<h1>M_JA_262_무두빠니(손을 잡고도 놓친 딸)</h1>
<p>세존께서 제따와나에 머무실 때, 즐겁지 않아 하던 한 비구를 두고 하신 말씀이다. 세존께서 「옛 현자도 제 딸을 지키지 못했다. 아버지가 손을 잡고 섰는데도 딸이 오염에 끌려 남자와 달아났다」 하셨다. 옛날 바라나시 왕이 된 보살은 딸과 조카를 궁 안에서 함께 길렀다. 처음에는 둘을 맺어 주려 했으나 뒤에 마음을 바꾸어 조카를 궁 밖에 내보냈다. 둘은 이미 서로 마음이 묶여 있었다. 조카가 유모를 통해 길을 묻자 공주는 첫 게송을 지어 보냈다.…</p>
