<h1>M_ITI_004_꼬다(분노를 버림)</h1>
<p>분노 한 가지를 버리면 불환과를 보증하겠다고 세존께서 말씀하신 편이다. 세존께서 이렇게 말씀하셨다. 아라한께서 이렇게 말씀하신 것을 나는 들었다 — 비구들이여, 한 가지 법을 버려라. 내가 그대들에게 불환과를 보증하겠다. 어떤 한 가지 법인가? 비구들이여, 분노이라는 한 가지 법을 버려라. 내가 그대들에게 불환과를 보증하겠다. 세존께서 이 뜻을 말씀하셨다. 그것에 대해 이렇게 말씀하셨다 — 그 분노에 휩싸여 중생들은 나쁜 곳으로 간다.</p>
