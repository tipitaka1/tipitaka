<h1>M_THAG_02_013_헤란냐까니 장로의 게송</h1>
<p>도둑을 다스리던 벼슬자리를 버린 이 꼬살라(Kosala) 왕 밑에서 마을을 다스리고 도둑을 다루던 이의 아들이다. 아버지가 죽자 왕이 그 자리를 잇게 하였으나, 제따와나(Jetavana) 봉헌 때 부처님의 위력을 보고 믿음을 얻어 그 자리를 아우에게 넘겨주게 하고 왕께 여쭈어 출가하였고, 위빳사나를 닦아 오래지 않아 아라한이 되었다. 그 일에 재미를 붙인 아우를 돌이키려고 꾸짖으며 이 게송을 읊었다. 낮과 밤이 지나가고 목숨은 그친다. 죽을 것…</p>
