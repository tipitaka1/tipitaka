<h1>M_THAG_16_001_아디뭇따 장로의 게송</h1>
<p>도둑 앞에서도 떨지 않은 사미 삼낏짜(Saṃkicca) 장로의 누이의 아들로 태어나 아디뭇따(Adhimutta)라 불렸다. 자라서 외숙인 장로 곁에 출가하여 위빳사나를 닦아, 아직 사미의 자리에 있으면서 아라한이 되었다. 구족계를 받으려고 어머니께 여쭈러 가던 길에, 신에게 바칠 제물을 찾아다니던 도적 오백 명에게 붙잡혔다. 붙잡히고도 두려워 떨지 않고 얼굴빛이 오히려 맑았다. 그것을 본 도적 우두머리가 놀라 그를 기리며 물었고, 이에 답하여 …</p>
