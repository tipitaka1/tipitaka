<h1>M_JA_207_앗사까(죽은 왕비가 벌레로 나다)</h1>
<p>세존께서 제따와나에 머무실 때, 옛 아내에게 마음이 끌려 답답해하는 비구를 두고 하신 말씀이다. 세존께서 「그 여인이 너를 사랑한 것이 아니다. 전에도 너는 그 여인 때문에 큰 괴로움을 겪었다」 하시고 옛일을 들려주셨다. 옛날 까시국 빠딸리 성의 앗사까 왕은 사랑하던 왕비 우빠리가 죽자 시신을 기름에 담가 침상 밑에 두고 이레를 먹지도 않고 울었다. 히말라야에 머물던 보살은 다섯 곧바른 앎을 갖춘 고행자로 이를 천안으로 보고 내려와 동산의 바위…</p>
