<h1>M_JA_239_하리따만두까(통발에 갇힌 물뱀)</h1>
<p>세존께서 웰루와나에 머무실 때, 아자따삿뚜를 두고 하신 말씀이다. 그는 어머니의 목욕값으로 받은 까시 마을을 두고 외삼촌인 꼬살라 왕과 싸워, 이기면 수레에 깃발을 세우고 성에 들고 지면 아무에게도 알리지 않고 들어왔다. 비구들이 그 일을 이야기하자 세존께서 「전에도 이기면 기뻐하고 지면 시름했다」 하시고 옛일을 들려주셨다. 옛날 보살은 푸른 개구리로 났다. 사람들이 물고기를 잡으려 통발을 놓았는데, 물뱀 하나가 물고기를 먹으며 통발에 들었다가…</p>
