<h1>A_VV_025_닛다수닛다</h1>
<p>여덟째와 아홉째 천궁은 라자가하에서 일어난 일이다. 인연담에서는 차례대로 「닛다라는 청신녀가 …pe… 명성 높으신 고따마의. 그러기에 저의 빛이 이러하고 …pe… 수닛다라는 청신녀가」라고 말해야 한다. 나머지는 앞에서 말한 방식과 같다. 게송에도 새로운 것은 없다. 그래서 어떤 책에서는 이 성전 구절을 되풀이 구로 줄여 두었다. 그래서 이렇게 말하였다 — 눈부신 빛으로 …pe… 그대의 빛이 모든 방향을 비춥니까?」</p>
