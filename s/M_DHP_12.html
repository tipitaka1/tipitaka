<h1>M_DHP_12_앗따왁가 (자기품)</h1>
<p>자기를 어떻게 다룰 것인가를 말하는 열 게송이다. 먼저 자기를 알맞은 자리에 세운 뒤에 남을 가르치라 하고, 자기가 자기의 의지처이며 깨끗함과 더러움도 각자의 몫이라고 한다. 자기가 사랑스러운 줄 안다면 자기를 단단히 지켜야 한다. 밤의 세 때 가운데 어느 한때라도 현자는 깨어 지켜야 한다. 먼저 자기를 알맞은 자리에 세워야 한다. 그런 뒤에 남을 가르치면 현자는 더럽혀지지 않는다. 남을 가르치는 그대로 자기도 그렇게 해야 한다.</p>
