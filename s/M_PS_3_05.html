<h1>M_PS_3_05_짜리야까타 (행의 논의)</h1>
<p>여덟 가지 「행(cariyā)」을 세우고, 그 하나하나가 누구의 것인지를 밝히는 짧은 편이다. 거동에서 시작해 세상의 이익으로 끝나는 여덟 갈래는, 몸가짐부터 남을 위한 삶까지가 모두 같은 하나의 「닦음」임을 보인다. 뒤이어 다섯 기능과 팔정도 여덟 지분이 각각 어떤 행으로 나타나는지를 한 줄씩 맞세운다. 「행(行)」이란 여덟 가지 행이니, 거동의 행, 감각영역의 행, 사띠의 행, 삼매의 행, 앎의 행, 도의 행, 얻음의 행, 세상의 이익의 행…</p>
