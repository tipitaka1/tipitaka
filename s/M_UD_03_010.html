<h1>M_UD_03_010_로까(불타는 세상)</h1>
<p>깨달으신 지 이레째, 세존께서 삼매에서 일어나 부처의 눈으로 세상을 둘러보시고, 중생들이 탐욕과 성냄과 어리석음에서 난 불길에 타들어 가는 것을 보신다. 존재로써도 존재하지 않음으로써도 존재에서 벗어나지 못한다는 것을, 게송과 산문을 번갈아 가며 길게 읊으신 편이다.</p>
