<h1>M_JA_099_빠로사핫사(천 사람보다 나은 하나)</h1>
<p>세존께서 제따와나에 머무시며 범부의 다섯 물음을 두고 하신 말씀이다. 비구들이 법당에 모여, 세존께서 줄여 말씀하신 것을 사리뿟따 존자가 넓혀 풀었다며 기리자, 세존께서 지금만이 아니다 하시고 옛일을 들려주셨다. 옛날 보살은 바라문 집안에 나서 선인으로 출가해, 곧바른 앎과 여덟 증득을 이루고 히말라야에 오백 제자와 함께 머물렀다. 맏제자가 절반을 데리고 내려간 사이 보살이 목숨을 마쳤는데, 제자들이 무엇을 얻으셨냐 묻자 「아무것도 없다」고 답…</p>
