<h1>M_THAG_05_002_수부따 장로의 게송</h1>
<p>외도를 거쳐 세존께 온 마가다 장자의 아들 마가다의 장자 집안에 태어난 수부따(Subhūti)다. 벗어남에 뜻을 두어 집을 떠났으나 처음 몸담은 외도에게서는 알맹이를 얻지 못했다. 우빠띳사와 꼴리따를 비롯한 많은 이가 세존 곁에 출가해 사문의 즐거움을 누리는 것을 보고 믿음을 얻어 다시 출가했고, 수행주제를 받아 홀로 지내며 위빳사나를 닦아 아라한이 되었다. 그러고서 이 게송을 읊었다. 그른 자리에 자신을 매어 두고 일 이루기를 바라는 사람, …</p>
