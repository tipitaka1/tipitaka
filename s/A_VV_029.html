<h1>A_VV_029_웃추다이까</h1>
<p>「신들을 포함한 땅을 밝히며」는 웃추다이까 천궁이다. 그 인연은 무엇인가? 「세존께서 라자가하에 머무셨다」 등은 모두 바로 앞의 천궁에서 말한 것과 같다. 다른 것은 이것이다 — 여기서는 사탕수수를 주었고, 시어머니가 의자로 때렸으며, 그 자리에서 죽어 삼십삼천에 태어났고, 바로 그날 밤에 장로를 뵈러 와서, 깃자꾸따 온 산을 달처럼 해처럼 밝히며 장로께 절하고 합장하여 예배하며 한쪽에 서 있었다. 그러자 장로가 그에게 —</p>
