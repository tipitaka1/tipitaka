<h1>M_JA_123_낭갈리사(쟁기채 같다는 제자)</h1>
<p>세존께서 제따와나에서 랄루다이 장로를 두고 하신 말씀이다. 그는 어느 자리에 무엇을 말할지 몰라 경사에 흉한 말을, 흉사에 경사스러운 말을 했다. 이를 들으신 세존께서는 「지금만이 아니다」 하시고 옛일을 드셨다. 옛날 바라나시에서 보살은 이름난 스승으로 오백 제자를 가르쳤다. 그중 한 제자는 굼떠서 배우지 못했으나 스승을 종처럼 섬겨, 어느 밤에는 침상 다리를 제 넓적다리에 얹고 밤을 새웠다. 그 정성을 본 보살은 그를 지혜롭게 만들려고 본 것…</p>
