<h1>M_SNP_05_011_깝빠마나와뿟차(깝빠의 물음)</h1>
<p>깝빠 바라문 학도가 크게 두려운 물살이 인 호수 한가운데에서 늙음과 죽음에 짓눌린 이들에게 섬이 될 곳을 일러 달라 여쭙는 편이다. 세존께서는 아무것도 지니지 않고 붙잡지 않는 것, 곧 늙음과 죽음이 다한 열반이 다시없는 섬이라고 이르신다. 호수 한가운데 서 있는 이들에게 (깝빠 존자가 말했다) 크게 두려운 거센 물살이 일었습니다. 늙음과 죽음에 짓눌린 이들에게 섬을 일러 주소서, 존자시여. 이런 일이 다시 없도록 제게 그 섬을 밝혀 주소서.</p>
