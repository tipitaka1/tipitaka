<h1>M_THAG_02_041_꾸마라깟사빠 장로의 게송</h1>
<p>빛깔 고운 설법에 으뜸 라자가하의 부호 딸이 아이를 밴 줄 모르고 비구니로 출가해 낳은 아들이다. 시비가 일자 세존께서 우빨리(Upāli) 장로에게 가리게 하셨고, 장로는 「출가 전에 든 태이니 출가에 허물이 없다」고 판가름했다. 꼬살라의 빠세나디 왕이 길렀고, 어린 나이에 출가한 탓에 늙어서까지 「동자 깟사빠」라는 뜻의 꾸마라깟사빠로 불렸다. 앞선 생에 빠두뭇따라 부처님 회상에서 다채롭게 설하는 이들 가운데 으뜸이 되기를 서원한 이다. 안다와…</p>
