<h1>M_THIG_05_012_짠다 장로니의 게송</h1>
<p>돌림병에 일가를 잃고 빌어먹던 이 어느 바라문 마을의 이름 없는 바라문 집에 태어났는데, 태어난 뒤로 집안이 기울어 어렵게 살았다. 게다가 돌림병이 돌아 일가붙이가 모두 죽자 바리때를 들고 집집이 빌어먹었다. 어느 날 빠따짜라(Paṭācārā) 장로니 일행이 공양하는 자리에 이르렀는데, 비구니들이 굶주린 그를 딱하게 여겨 먹여 주었다. 그 몸가짐에 감복해 장로니에게 법을 듣고 출가했고, 가르침대로 닦아 오래지 않아 아라한이 되어 이 게송을 읊었…</p>
