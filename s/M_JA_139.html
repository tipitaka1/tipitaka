<h1>M_JA_139_우바또밧타(양쪽에서 다 잃다)</h1>
<p>세존께서 웰루와나에 머무시며 데와닷따를 두고 이 말씀을 하셨다. 비구들이 법당에서 「데와닷따는 양끝이 타고 가운데는 더러운 화장터 나무처럼 양쪽에서 다 떨어져, 재가의 즐거움도 잃고 사문의 뜻도 채우지 못한다」고 이야기하고 있었다. 옛날 바라나시에서 브라흐마닷따가 다스릴 때, 보살은 나무의 신으로 태어났다. 한 마을의 어부가 어린 아들과 함께 웅덩이에 낚시를 던졌는데 바늘이 물속 그루터기에 걸렸다. 큰 고기가 걸린 줄 안 그는 몫을 나누지 않으…</p>
