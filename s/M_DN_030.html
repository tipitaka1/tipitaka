<h1>M_DN_030_락카나(삼십이상경)</h1>
<p>이와 같이 나는 들었다. 한때 세존께서는 사왓티의 제따와나, 아나타삔디까 승원에 머무셨다. 거기서 세존께서 비구들에게 이르셨다. 「비구들이여.」 「예, 존자시여」라며 그 비구들은 세존께 대답했다. 세존께서 이렇게 말씀하셨다 — &quot;비구들이여, 대인에게는 이러한 서른두 가지 대인의 표시가 있다. 그것들을 갖춘 대인에게는 두 가지 길만 있을 뿐 다른 길은 없다. 만일 집에 머물면 법답고 법으로 다스리며 사방을 정복하고 나라를 안정시키고 일곱 가지 보…</p>
