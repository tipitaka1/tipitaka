<h1>M_THIG_01_009_밧라 장로니의 게송</h1>
<p>좋은 것을 기뻐하라는 게송을 받은 이 주석서에 이 분의 내력이 전하지 않는다. 믿음으로 출가하였으니 좋은 것을 기뻐하는 이가 되어 선한 법을 닦으라고, 「밧라여」 하고 이르는 게송이다. 믿음으로 출가하였으니, 밧라여, 좋은 것을 기뻐하는 이가 되라. 선한 법을 닦으라, 위없는 안온을. 〔§9〕 「밧라」는 「좋은 이」라는 뜻이다. 이름과 「좋은 것」이 같은 말이다.</p>
