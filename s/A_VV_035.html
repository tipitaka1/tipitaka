<h1>A_VV_035_말리까</h1>
<p>「노란 옷에 노란 깃발」은 말리까 천궁이다. 그 인연은 무엇인가? 법의 바퀴를 굴리신 일을 처음으로 하여 수밧다 유행자를 이끄신 일까지 부처님으로서 하실 일을 다 마치시고, 꾸시나라의 우빠왓따나에 있는 말라 왕들의 살라 숲에서 두 그루 살라나무 사이에서, 위사카 보름날 새벽녘에 남음 없는 열반의 요소로 세상의 의지처이신 세존께서 완전한 열반에 드시자, 신들과 사람들이 그 몸을 기리는 일을 하고 있었다. 그때 꾸시나라에 살던, 반둘라 말라의 아내…</p>
