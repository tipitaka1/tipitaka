<h1>M_THAG_02_010_와사바 장로의 게송</h1>
<p>부처님의 위력을 보고 출가한 릿차위 웨살리(Vesālī) 릿차위(Licchavi) 왕가에 태어났다. 세존께서 웨살리에 오셨을 때 부처님의 위력을 보고 믿음을 얻어 출가하였고, 위빳사나를 닦아 오래지 않아 아라한이 되었다. 전생에 많은 고행자를 거느린 스승이었을 때 정작 자기가 공경할 분이 없음을 안타까이 여겨 모래탑을 세우고 옛 부처님들께 공양한 인연이 있다. 게송은 겉모습으로 바라문 행세를 하며 남보다 제 자신을 먼저 해치는 이를 꾸짖는다. …</p>
