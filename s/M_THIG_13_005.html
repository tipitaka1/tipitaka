<h1>M_THIG_13_005_수바깜마라디뚜 장로니의 게송</h1>
<p>금세공사의 딸, 재가살이를 등진 이 라자가하(Rājagaha)의 한 금세공사의 딸이다. 몸이 고와 수바(Subhā)라 불렸다. 세존께서 라자가하에 드셨을 때 법을 듣고 그 자리에서 예류과를 얻었고, 재가살이의 허물을 보아 마하빠자빠띠 고따미(Mahāpajāpatī Gotamī) 곁에서 출가했다. 친척들이 거듭 찾아와 재물을 보이며 감각적 욕망으로 꾀자 그 허물을 낱낱이 밝혀 돌려보냈고, 이어 위빳사나를 닦아 아라한과를 얻고서 이 게송을 읊었다.…</p>
