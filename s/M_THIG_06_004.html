<h1>M_THIG_06_004_수자따 장로니의 게송</h1>
<p>놀이 길에 세존을 뵙고 돌아선 이 사께따(Sāketa) 장자의 딸로 태어나 같은 집안 장자의 아들에게 시집가 남부럽지 않게 살았다. 어느 날 동산에 나가 축제 놀이를 하고 돌아오는 길에 안자나 숲에 들렀다가 세존을 뵙고 법을 들었는데, 그 자리에 앉은 채로 아라한이 되었다. 집에 돌아가 남편과 부모의 허락을 받고 비구니로 출가한 뒤, 걸어온 길을 돌아보며 이 게송을 읊었다. 곱게 꾸미고 좋은 옷을 입고 화환을 두르고 전단향을 바르고 온갖 패물로…</p>
