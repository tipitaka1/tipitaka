<h1>M_THAG_17_002_사리뿟따 장로의 게송</h1>
<p>세존의 상수 제자로 우빠띳사(Upatissa)라고도 불린다. 스스로 「지혜에서 으뜸인 장로」라 하였다. 아득한 전생에 바라문 대부호의 아들 사라다(Sarada)로 나서, 소꿉동무 시리왓다(Sirivaḍḍha) — 뒷날의 마하목갈라나 — 가 마다하자 홀로 산기슭에 들어가…</p>
