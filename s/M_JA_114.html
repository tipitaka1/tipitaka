<h1>M_JA_114_미따찐띠(헤아릴 줄 아는 물고기)</h1>
<p>세존께서 제따와나에 머무실 때, 나이 든 두 장로를 두고 하신 말씀이다. 그들은 시골 숲에서 안거를 마치고 세존을 뵈러 가려 챙겨 놓고도 「오늘 가자, 내일 가자」 하며 석 달을 흘려보낸 뒤에야 왔다. 세존께서 「전에도 게을렀다」 하시고 옛일을 들려주셨다. 옛날에 바라나시 강에 바후찐띠와 압빠찐띠와 미따찐띠라는 물고기 셋이 있었다. 미따찐띠가 「사람 사는 곳은 어부가 그물을 던지는 두려운 곳이니 숲으로 가자」 했으나, 둘은 게으르고 먹이에 욕심…</p>
