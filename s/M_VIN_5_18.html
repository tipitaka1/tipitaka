<h1>M_VIN_5_18_빤짜(다섯의 갈래)</h1>
<p>갈마는 넷이다. 알리는 갈마, 제안 갈마, 제안이 둘째가 되는 갈마, 제안이 넷째가 되는 갈마 — 이것이 네 가지 갈마다. 이것들은 몇 가지 방식으로 어그러지는가? 이 네 가지 갈마는 다섯 가지 방식으로 어그러진다 — 사안으로, 제안으로, 알림으로, 경계로, 무리로다. 어떻게 사안으로 갈마가 어그러지는가? 대면하여 해야 할 갈마를 대면하지 않고 하면 사안이 어긋난 법답지 않은 갈마다. 되물어 해야 할 갈마를 되묻지 않고 하면 사안이 어긋난 법답…</p>
