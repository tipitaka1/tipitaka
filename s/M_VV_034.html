<h1>M_VV_034_닷달라(두 자매의 보시)</h1>
<p>지난 생에 한집안의 두 자매였던 천신들이 천상에서 만나, 서로 무엇을 얼마나 보시했는지 견주는 편이다. 적게 주고도 더 뛰어난 곳에 난 까닭을 묻자 승가에 드린 보시였다는 답이 나오고, 끝에서 신들의 왕이 부처님께 여쭈어 들은 말을 전한다. 빛으로 눈부시게 빛나고 명성으로 명성 높은 이여, 삼십삼천의 모든 신들보다 빛으로 뛰어나게 빛나십니다. 뵌 기억이 없습니다. 이것이 첫 만남입니다. 어느 신들의 무리에서 오셨기에 저의 이름을 부르십니까?</p>
