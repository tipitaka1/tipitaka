<h1>M_SN_04_마라(마라)</h1>
<p>이와 같이 나는 들었다. 한때 세존께서는 깨달음을 이루신 지 얼마 되지 않아 우루웰라의 네란자라 강가 아자빨라 니그로다 나무 아래에 머무셨다. 그때 홀로 물러나 앉으신 세존의 마음에 이런 생각이 일어났다 — &quot;나는 참으로 그 어려운 고행에서 벗어났다. 이롭지 않은 그 어려운 고행에서 벗어난 것은 참으로 잘된 일이다. 굳게 서서 벗어나 깨달음을 얻은 것은 참으로 잘된 일이다.&quot; 그때 마라 빠삐만이 세존의 마음속 생각을 마음으로 알고 세존께 다가갔…</p>
