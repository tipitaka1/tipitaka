<h1>M_THAG_01_090_사미닷따 장로의 게송</h1>
<p>사미닷따(Sāmidatta)는 라자가하 한 바라문의 아들이다. 부처님의 위력을 전해 듣고 청신사들을 따라 절에 가 법을 설하시는 세존을 뵙고 한쪽에 앉았는데, 세존께서 그 뜻을 살펴 알맞게 설하시자 믿음과 절박함을 얻어 출가했다. 앎이 익지 않아 한동안 게으르게 지냈으…</p>
