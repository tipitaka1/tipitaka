<h1>M_VV_064_마하라타(큰 수레 천궁)</h1>
<p>천 마리 말이 끄는 큰 수레를 타고 동산을 거니는 천자에게 목갈라나가 수레와 곁을 따르는 여인들을 하나하나 그려 보이며 어떤 업의 과보인지 묻는다. 천자는 깟사빠 부처님께 먹을 것과 마실 것과 가사를 올린 일을 답한다. 천 마리 말이 매인 아름다운 수레, 온갖 무늬를 새긴 이 수레에 올라 동산을 두루 거니는 그대는 존재들의 주인 와사와 뿌린다다 같습니다. 그대의 두 수레채는 황금으로 되었고, 판과 모서리가 빈틈없이 맞물렸습니다.</p>
