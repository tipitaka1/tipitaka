<h1>M_JA_057_와나린다(바위인 척한 악어)</h1>
<p>세존께서 웰루와나에 머무실 때, 데와닷따가 죽이려 애쓴 일을 두고 이 말씀을 하셨다. 옛날 보살은 원숭이로 나서 홀로 강가에 살았다. 강 가운데 섬에 열매나무가 우거져, 기슭에서 뛰어 바위를 딛고 다시 뛰어 섬으로 건너다녔다. 악어의 아내가 원숭이의 염통을 먹고 싶어 하자 악어가 그 바위에 엎드렸다. 저녁에 보살은 물이 그대로인데 바위만 높아 보이자 「바위여」 하고 세 번 불렀다. 대답이 없자 「오늘은 왜 답이 없느냐」 하니 악어가 그만 대답했…</p>
