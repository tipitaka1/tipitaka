<h1>M_THAG_01_051_고디까 장로의 게송</h1>
<p>비구름을 향해 「내리려거든 내려라」 지붕을 덮어 아늑하고 바람 들지 않는 오두막에 들어, 열반을 대상으로 마음이 더없이 잘 모인 채 지냈다. 안팎으로 걸릴 것이 없어 「내리려거든 내려라」 하고 비구름을 향해 이 게송을 읊었다. 비구름은 잘 지은 노래처럼 비를 내린다. 내 오두막은 지붕을 덮어 아늑하고 바람이 들지 않는다. 내 마음은 잘 삼매에 들었다. 그러니 원하거든 비구름이여, 내려라. 〔§51〕 「비구름이여」는 비를 내리는 구름을 사람 부르…</p>
