<h1>A_PV_040_웃추</h1>
<p>「이 큰 사탕수수 숲은 제 것입니다」란 사탕수수 아귀 이야기다. 그 인연은 무엇인가? 세존께서 웰루와나에 머무실 때, 어떤 사람이 사탕수수 다발을 어깨에 메고 사탕수수 한 대를 씹으며 가고 있었다. 그때 계를 갖추고 착한 성품을 지닌 어떤 청신사가 어린아이와 함께 그의 뒤를 바짝 따라갔다. 아이가 사탕수수를 보고 「달라」 하며 울었다. 청신사는 아이가 우는 것을 보고 그 사람의 마음을 얻으려고 말을 걸었다. 그러나 그 사람은 그와 한마디도 나누…</p>
