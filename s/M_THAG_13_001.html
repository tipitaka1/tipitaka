<h1>M_THAG_13_001_소나꼴리위사 장로의 게송</h1>
<p>거문고 줄의 비유를 들은 정진제일 짬빠(Campā)의 장자 우사바(Usabha)의 집에 태어났다. 몸이 금빛이고 살결이 고와 소나(Soṇa)라 이름했고, 세 철에 맞는 세 궁전에서 천자처럼 지냈다. 빠두뭇따라(Padumuttara) 부처님 때 세존께서 한 비구를 「정진을 일으킨 이 가운데 으뜸」의 자리에 세우시는 것을 보고 스스로 그 자리를 서원했던 이다. 출가한 뒤 지나치게 힘을 쏟다가 세존께 거문고의 비유로 법을 들은 뒤 정진을 고르게 하여…</p>
