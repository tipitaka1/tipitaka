<h1>M_MN_007_왓타(옷감의 비유)</h1>
<p>이와 같이 나는 들었다. 한때 세존께서는 사왓티의 제따와나, 아나타삔디까 승원에 머무셨다. 거기서 세존께서 비구들에게 이르셨다. 「비구들이여.」 「예, 존자시여.」 그 비구들은 세존께 대답했다. 세존께서 이렇게 말씀하셨다. 비구들이여, 마치 더럽고 때가 낀 천이 있어 염색공이 그것을 어떤 물감에 담그더라도, 푸른 물감이든 노란 물감이든 붉은 물감이든 진홍 물감이든 물이 잘 들지 않고 빛깔이 깨끗하지 않은 것과 같다. 그것은 무슨 까닭인가? 비구…</p>
