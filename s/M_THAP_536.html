<h1>M_THAP_536_답바말라뿟따 장로의 아빠다나</h1>
<p>거처를 마련해 주는 일 제일 거처를 마련하는 이 가운데 으뜸. 깟사빠 부처님의 가르침이 저물 때 일곱 비구가 바위에 올라 사다리를 무너뜨린 이야기와, 어머니의 화장 더미에서 떨어져 나온 출생 이야기가 함께 실려 있습니다. 가르침이 저물 때의 조짐을 그린 §22~§26과 일곱 비구의 결심을 담은 §27~§32는 정형을 벗어난 서사 대목입니다. 빠두뭇따라라는 이름의 승리자, 온 세상을 아시는 성자, 눈 있으신 분이 십만 겁 전에 나오셨다. 가르치시…</p>
