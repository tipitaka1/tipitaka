<h1>M_VV_032_라따(라따의 섬김)</h1>
<p>웻사와나 왕의 딸인 다섯 천신이 강에서 목욕하고 놀다가, 수따가 라따에게 남편에게 더 사랑받고 모습이 더 빼어난 까닭을 묻는다. 라따가 사람이었을 때 남편과 시집 식구를 잘 섬긴 일을 말하자, 다른 이들이 그 법을 따르자고 한다. 이 편에는 목갈라나가 나오지 않는다. 라따와 삿자와 빠와라라는 천신들, 그리고 영화로운 으뜸가는 왕의 딸 앗찌마띠, 또 수따 — 웻사와나 왕의 딸들, 왕가의 딸들이 법의 덕으로 빛났다. 여기 다섯 여인이 목욕하러 왔다…</p>
