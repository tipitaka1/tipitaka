<h1>M_THIG_08_001_시수빠짤라 장로니의 게송</h1>
<p>사리뿟따의 막내 누이 짤라(Cālā)와 우빠짤라(Upacālā)의 막내 동생이다. 마가다의 날라까 마을 바라문 여인 루빠사리의 딸로, 사리뿟따 존자의 누이다. 오라비가 출가했다는 말을 듣고 스스로도 힘을 내어 출가했고, 애쓰고 힘써 오래지 않아 아라한과를 얻었다. 할 일을 마쳤다는 기쁨으로 감흥을 읊자 마라가 하늘 세계를 들어 꾀었고, 그 대답으로 이 게송을 읊었다. 계를 갖추고 기능을 잘 단속한 비구니는 고요한 경지에 이르리라, 무엇도 섞이지…</p>
