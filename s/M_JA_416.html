<h1>M_JA_416_빠란따빠(짐승 말로 드러난 살인)</h1>
<p>세존께서 웰루와나에 머무실 때, 데와닷따가 당신을 죽이려 애쓴 일을 두고 하신 말씀이다. 비구들이 법당에서 활잡이와 바위와 날라기리 이야기를 하자, 세존께서는 「전에도 나를 죽이려 애썼으나 하지 못하고 저만 괴로움을 겪었다」 하시고 옛일을 드셨다. 옛날 바라나시 왕자로 난 보살은 딱까실라에서 온갖 짐승의 소리를 아는 주문을 배워 왔다. 성에 든 자칼 어미가 새끼들에게 나그네의 신과 못에 빠져 죽은 사람의 재물을 먹이겠다 이르는 것을 알아듣고 두…</p>
