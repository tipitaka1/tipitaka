<h1>M_THAP_413_밧달리 장로의 아빠다나</h1>
<p>수메다께 살라 꽃 정자를 지어 덮은 이 수메다 부처님께서 히말라야에서 이레 밤낮을 삼매에 드셨을 때 살라 꽃으로 정자를 지어 덮어 드린 이야기입니다. 신들의 무리 가운데서 내리신 수기가 §10부터 §23까지 길게 이어지고, 그 안에 코끼리와 말과 수레와 마을을 차례로 늘어놓는 대목이 들어 있습니다. 수메다라는 정등각자, 으뜸가고 자비로우신 성자, 홀로 있기를 즐기시는 세상의 으뜸이신 분께서 히말라야로 오르셨다. 세상의 인도자 수메다께서 히말라야…</p>
