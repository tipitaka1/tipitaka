<h1>A_VV_047_웃추</h1>
<p>「신들을 포함한 땅을 밝히며」라 한 것은 웃추 천궁이다. 이것은 앞의 웃추 천궁과 성전의 글로도 인연담으로도 똑같다. 다만 거기서는 시어머니가 며느리를 걸상으로 때려 죽였고 여기서는 흙덩이로 때렸다는 것만이 다르다. 그러나 이야기가 갈리므로 둘 다 따로따로 결집에 올랐다고 알아야 한다. 신들을 포함한 땅을 밝히며 그대는 해와 달처럼 뛰어나게 빛납니다. 영광과 빛과 명성과 위엄으로, 인다와 함께한 삼십삼천의 신들 가운데 브라흐마와 같습니다.</p>
