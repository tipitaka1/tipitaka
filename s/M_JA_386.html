<h1>M_JA_386_카라뿟따(짐승 말을 아는 주문)</h1>
<p>세존께서 제따와나에 머무실 때, 옛 아내에게 마음이 끌린 비구를 두고 하신 말씀이다. 세존께서는 「전에도 이 여인 때문에 불에 들어가 죽을 뻔했다」 하시고 옛일을 드셨다. 옛날 바라나시의 세나까 왕 시절 보살은 삭까였다. 왕이 아이들에게 맞던 나가 왕을 구해 주자, 나가 왕은 벗이 되어 나가 처녀 하나를 곁에 두게 하고 그를 볼 주문을 주었다. 왕이 못에서 그 처녀가 물뱀과 어울리는 것을 보고 대나무로 치자, 처녀는 나가 세계로 가 거짓을 고했…</p>
