<h1>M_THIG_02_002_젠따 장로니의 게송</h1>
<p>일곱 깨달음의 요소로 마라를 꺾은 릿차위 딸 웨살리(Vesālī)의 릿차위(Licchavi) 왕가에 태어났다. 지난 생 이야기는 앞의 아비루빠난다와 같고 태어난 집안만 다르다고 주석서는 적는다. 세존께서 설하시는 법을 듣고 그 자리에서 아라한과를 얻었고, 스스로 이룬 것을 돌아보아 기쁨에 차 이 게송을 읊었다. 이 일곱 깨달음의 요소, 열반에 이르는 길들, 부처님께서 가르치신 그대로 나는 그 모두를 닦았다. 나는 그 세존을 뵈었다. 이것이 마지…</p>
