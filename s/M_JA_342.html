<h1>M_JA_342_와나라(악어를 속인 원숭이)</h1>
<p>세존께서 웰루와나에 머무실 때, 데와닷따가 죽이려 애쓴 일을 두고 하신 말씀이다. 그 사연은 수수마라 자따까에 자세히 나온다. 옛날 바라나시에서 보살은 히말라야에 원숭이로 나 갠지스 가에 살았다. 강에 사는 악어의 아내가 보살의 염통 고기에 입덧이 생겨 남편에게 말하자, 악어는 「저 원숭이를 물에 잠기게 해 죽이고 염통 고기를 얻어다 주리라」 하고 「벗이여, 섬에 열매를 먹으러 가자. 내 등에 태워 주겠다」 했다. 그 마음을 모르는 보살이 뛰어…</p>
