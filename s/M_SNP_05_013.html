<h1>M_SNP_05_013_밧라우다마나와뿟차(밧라우다의 물음)</h1>
<p>밧라우다 바라문 학도가 여러 지방에서 말씀을 바라며 모여든 사람들을 대신해 가르침을 청하는 편이다. 세존께서는 위아래 어디로든 붙잡으려는 갈애를 모두 몰아내라 하시고, 세상에서 무엇이든 집착하면 바로 그것으로 마라가 사람을 뒤쫓는다고 이르신다. 집을 버리고 갈애를 끊고 흔들림 없는 분, (밧라우다 존자가 말했다) 즐김을 버리고 거센 물살을 건너 해탈하신 분, 헤아림을 버린 슬기로운 분께 청합니다. 용의 말씀을 듣고 나면 그들은 여기서 떠날 것입…</p>
