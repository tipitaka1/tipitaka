<h1>M_VV_033_굿띨라(굿띨라의 비파)</h1>
<p>일곱 줄 비파를 가르친 이가 자기를 무대로 불러낸다며 굿띨라가 꼬시야에게 귀의처가 되어 달라 청하고, 꼬시야가 스승이 제자를 이길 것이라 답하는 두 게송으로 시작한다. 이어 천상에서 빛나는 천신들에게 어떤 업의 과보로 그렇게 빛나는지 묻고, 천신들이 지난 생에 무엇을 바쳤는지 하나씩 답한다. 일곱 줄 비파를 감미롭고 아름답게 타도록 가르쳤더니 그가 저를 무대로 불러냅니다. “꼬시야여, 저의 귀의처가 되어 주십시오.”</p>
