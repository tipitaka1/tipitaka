<h1>M_CP_017_마땅가(마땅가의 참음)</h1>
<p>보살이 마땅가라는 이름의 머리를 땋아 올린 수행자였을 때의 일이다. 강가 강 아래쪽에 살던 바라문이 위쪽에 있는 암자를 보고 꾸짖으며 저주를 퍼부었으나, 성을 내지 않고 도리어 그 저주에서 그를 풀어 주었다. 또 한 번, 내가 머리를 땋아 올린 수행자로 절제가 드높았을 때, 이름은 마땅가였고 계를 갖추고 잘 삼매에 들어 있었다. 나와 어떤 바라문, 우리 둘은 강가 강 기슭에 살았다. 나는 위쪽에 살고 바라문은 아래쪽에 살았다.</p>
