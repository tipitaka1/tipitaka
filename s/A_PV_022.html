<h1>A_PV_022_웃따라마뚜뻬띠</h1>
<p>「낮을 보내려 앉은 비구」라는 이것은 웃따라마뚜뻬띠 이야기다. 여기에 그 뜻을 밝힌다 — 스승께서 완전한 열반에 드시고 제일차 대결집이 열린 뒤, 마하깟짜야나 존자는 열두 비구와 함께 꼬삼비에서 멀지 않은 어느 숲에 머물렀다. 그때 우데나 왕의 어떤 대신이 죽었는데, 그는 전에 도성의 여러 일을 맡아 보던 이였다. 그래서 왕은 그의 아들 웃따라라는 젊은이를 불러 「그대는 그대 아버지가 맡아 보던 일들을 이어 맡으라」 하고 그 자리에 앉혔다.</p>
