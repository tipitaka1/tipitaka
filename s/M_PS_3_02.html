<h1>M_PS_3_02_잇디까타 (신통의 논의)</h1>
<p>신통을 열 갈래로 나누어 다룬다. 굳게 다잡아 이루는 것, 몸을 바꾸는 것, 마음으로 이루는 것, 앎이 퍼지는 것, 업의 과보로 생긴 것, 공덕 있는 이의 것 따위다. 신통을 신비가 아니라 무엇이 그것을 떠받치는가 로 풀어 놓는다. 신통이란 무엇인가? 신통은 몇 가지인가? 신통에는 몇 가지 터가 있고, 몇 가지 발판이 있으며, 몇 가지 걸음이 있고, 몇 가지 뿌리가 있는가? 신통이란 무엇인가? 이루어진다는 뜻에서 신통이다. 신통은 몇 가지인가?…</p>
