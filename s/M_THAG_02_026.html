<h1>M_THAG_02_026_뿐나마사 장로의 게송</h1>
<p>그릇마다 금돈이 가득 찼던 이 사왓티의 살림 넉넉한 집안에 태어났다. 태어난 날 집 안의 그릇마다 금과 보배로 된 마사 돈이 가득 찼다 하여 「가득한 마사」라는 뜻의 뿐나마사라 불렸다. 아들 하나를 얻고서 집을 떠나 출가했고, 마을 처소에 머물며 애써 육신통을 갖추었다. 사왓티로 돌아와 무덤가에 머물 때, 아들이 죽자 재산을 지키려던 옛 아내가 많은 이를 거느리고 찾아와 그를 꾀었다. 탐욕이 없음을 보이려고 허공에 서서, 자기가 걸어온 길을 밝…</p>
