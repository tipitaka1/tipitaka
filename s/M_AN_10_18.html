<h1>M_AN_10_18_사두(좋은 업과 나쁜 업)</h1>
<p>비구들이여, 나는 너희에게 좋은 것과 좋지 않은 것을 설하겠다. 그것을 들어라. 잘 마음을 기울여라. 나는 설하겠다. 그렇게 하겠습니다, 존자시여.」 그 비구들은 세존께 대답했다. 세존께서는 이렇게 말씀하셨다 — 비구들이여, 무엇이 좋지 않은 것인가? 살생, 주지 않은 것 가지기, 감각적 욕망에서 그릇되게 행함, 거짓말, 이간하는 말, 거친 말, 쓸데없는 말, 탐냄, 악의, 그릇된 견해다. 비구들이여, 이것을 좋지 않은 것이라 한다.</p>
