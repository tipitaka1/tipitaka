<h1>M_THIG_01_013_위사카 장로니의 게송</h1>
<p>탁발을 마치고 해탈의 즐거움에 지낸 이 주석서는 이 분의 내력이 디라(Dhīrā) 장로니와 같다고만 적었다. 아라한이 되어 해탈의 즐거움으로 지내던 이다. 스스로 탁발에서 돌아와 스승과 은사께 할 일을 마치고 낮 처소에서 발을 씻고 홀로 앉아 목적을 이루었기에, 남들에게도 그리하라 권하며 이 게송을 읊었다. 부처님의 가르침을 행하라, 행하고 나서 뉘우치지 않을 그것을. 어서 발을 씻고, 한쪽에 앉으라.</p>
