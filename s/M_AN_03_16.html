<h1>M_AN_03_16_아쩰라까(세 가지 실천)</h1>
<p>157-163비구들이여, 세 가지 실천이 있다. 무엇이 셋인가? 빠져드는 실천, 태우는 실천, 가운데 실천이다. 비구들이여, 무엇이 빠져드는 실천인가? 비구들이여, 여기 어떤 이는 이렇게 말하고 이런 견해를 지닌다 — 「감각적 욕망에는 허물이 없다」라고. 그는 감각적 욕망에 빠져든다. 비구들이여, 이를 두고 빠져드는 실천이라 한다. 비구들이여, 무엇이 태우는 실천인가? 비구들이여, 여기 어떤 이는 옷을 걸치지 않고 관습을 벗어 던지고 손을 핥으…</p>
