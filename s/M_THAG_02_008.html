<h1>M_THAG_02_008_수라다 장로의 게송</h1>
<p>앞의 라다(Rādha) 장로의 아우다. 형이 출가하자 자기도 뒤따라 출가하여 위빳사나를 닦아 오래지 않아 아라한이 되었다. 가르침이 벗어남으로 이끄는 것임을 드러내려고, 스스로 이룬 바를 밝히며 이 게송을 읊었다. 내 태어남은 다했고 승리자의 가르침을 다 살았다.</p>
