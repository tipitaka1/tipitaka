<h1>M_THAG_16_005_말루꺄뿟따 장로의 게송</h1>
<p>범부이던 때의 뉘우침을 읊은 이 이분 이야기는 앞의 여섯 게송 모음에 나와 있다. 거기 게송들은 아라한이 된 뒤 친족들에게 법을 설하며 읊은 것이고, 여기 실린 것은 아직 범부이던 때의 게송이다. 말루꺄뿟따(Mālukyaputta)가 간추린 법을 청하자, 세존께서는 본 것에는 본 것만큼만 있게 하라고 이르셨다. 그 짧은 가르침을 잘 받아 지녔음을 보이려고 이 게송을 읊었다. 형색을 보고 사띠를 놓친 채 사랑스러운 표상에 마음을 기울이면, 애착에…</p>
