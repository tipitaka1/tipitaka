<h1>M_MND_01_까마닛데사 (감각적 욕망 해설)</h1>
<p>숫따니빠따 4품 첫 경 「까마」를 낱말마다 뜯어 푼다. 「감각적 욕망」이 대상으로서의 것과 오염으로서의 것 둘로 갈린다는 정의가 여기서 나오고, 그 정의가 이 책 전체에서 되풀이된다. 닛데사를 처음 여는 이는 이 편만 꼼꼼히 읽어도 나머지 열다섯 편의 어법이 다 잡힌다. 그분 세존, 아라한, 정등각자께 귀의합니다. 감각적 욕망을 바라는 이에게 그것이 이루어지면, 바라던 것을 얻은 그 사람은 참으로 마음에 희열이 인다.</p>
