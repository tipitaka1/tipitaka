<h1>M_THAP_429_에까담맛사와니야 장로의 아빠다나</h1>
<p>허공을 날던 결발행자가 빠두뭇따라 부처님 위를 지나가지 못하고 내려와, 무상함을 설하시는 가르침 하나만을 듣고 지녀 간 이야기입니다. 뒷생에 일곱 살로 아버지 집에서 그 게송을 다시 듣고 아라한과에 이릅니다. 세 행으로 된 게송이 둘 섞여 있습니다(§6, §11).</p>
