<h1>M_THAG_16_007_깔리고다뿟따밧디야 장로의 게송</h1>
<p>「아, 행복하여라」를 읊은 사꺄 왕족 까삘라왓투 사꺄 왕가 사람으로, 어머니 이름을 딴 「깔리고다의 아들 밧디야(Bhaddiya)」다. 아누룻다(Anuruddha) 등과 함께 아누삐야 망고 숲에서 출가해 아라한이 되었고, 세존께서 좋은 집안 출신 비구 가운데 으뜸으로 꼽으셨다. 「아, 즐겁구나」 하고 되뇌는 까닭을 물으시자, 왕 노릇 할 때는 호위를 두고도 두려웠으나 이제는 그렇지 않다고 세존께 사뢰며 이 게송을 읊었다. 나는 코끼리 목에 타고…</p>
