<h1>M_SNP_05_008_난다마나와뿟차(난다의 물음)</h1>
<p>난다 바라문 학도가 세상에서 성자라 불리는 이가 앎을 갖춘 이인지 사는 방식을 갖춘 이인지 여쭙는 편이다. 세존께서는 견해와 들음과 앎과 계율과 의례로 성자가 되는 것이 아니라 하시고, 그것들을 모두 버리고 갈애를 온전히 알아 번뇌가 없는 이들이 거센 물살을 건넌 이라고 이르신다. 세상에 성자들이 있다고 (난다 존자가 말했다) 사람들이 말합니다. 그것은 어떠합니까. 앎을 갖춘 이를 성자라 합니까, 아니면 사는 방식을 갖춘 이를 성자라 합니까.</p>
