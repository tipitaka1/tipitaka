<h1>M_SNP_02_003_히리(참된 벗)</h1>
<p>부끄러움을 저버리고 말만 앞세우며 마땅히 할 일을 맡지 않는 이는 벗이 아니라 하고, 아들이 어머니 품에 안기듯 기댈 수 있는 이가 참된 벗이라 이르는 다섯 게송이다. 끝에서는 홀로 있음의 맛과 고요함의 맛을 마신 이가 법의 희열을 마신다고 맺는다. 부끄러움을 저버리고 그것을 싫어하면서 &quot;나는 그대 편이다&quot; 하고 말하고, 할 수 있는 일을 맡지 않는 이 — &quot;그는 내 벗이 아니다&quot; 하고 알아야 한다. 벗에게 말만 곱게 하고 그 말을 따르지 않는…</p>
