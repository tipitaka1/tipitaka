<h1>M_JA_153_수까라(사자에게 덤빈 멧돼지)</h1>
<p>세존께서 제따와나에 머무실 때, 한 늙은 비구를 두고 하신 말씀이다. 밤에 사리뿟따 장로가 목갈라나 장로의 물음에 답하고 있는데, 그 비구가 이름을 얻으려 끼어들어 물음을 던졌다. 장로가 부끄러이 여겨 자리에서 내려가자 사람들이 뒤쫓았고, 달아나던 그는 뒷간에 빠져 똥을 뒤집어썼다. 세존께서는 제 힘을 모르고 센 이에게 덤비다 똥을 뒤집어쓴 것이 이번만이 아니라 하시고 옛일을 들려주셨다. 옛날 보살은 사자로 나 히말라야 굴에 살았고, 가까운 못…</p>
