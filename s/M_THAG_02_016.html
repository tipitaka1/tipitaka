<h1>M_THAG_02_016_마하깔라 장로의 게송</h1>
<p>무덤가에서 몸의 무너짐을 지켜본 이 세따뱌(Setabya) 성 대상 집안 사람이다. 장사하러 사왓티(Sāvatthī)에 갔다가 제따와나(Jetavana)로 가는 청신사들을 따라가 법을 듣고 믿음을 얻어 출가하였고, 무덤가에 머무는 두타행을 받아 시신 버리는 곳에 지냈다. 어느 날 깔리(Kāḷī)라는 화장터 여인이 장로의 명상 주제를 위해 갓 죽은 주검의 두 다리와 두 팔을 부수고 머리를 깨뜨려 사지를 도로 맞추어 놓고 한쪽에 앉았다. 그것을 보…</p>
