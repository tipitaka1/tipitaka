<h1>A_VV_007_두띠야나와</h1>
<p>「황금을 씌운 배에」란 두 번째 배 천궁이다. 그 인연은 무엇인가? 세존께서 사왓티에 머무실 때, 번뇌를 다한 어떤 장로가 안거 들 날이 가까워지자 마을 거처에서 안거를 나려고 사왓티에서 그 마을을 향해 오후에 먼 길을 나섰다. 길의 고달픔에 지치고 목마른 채 도중에 어떤 마을에 이르렀는데, 마을 밖에 그늘과 물을 갖춘 그만한 자리가 보이지 않고 고달픔에 짓눌려, 가사를 걸치고 마을에 들어가 첫 번째 집 문 앞에 섰다. 거기서 어떤 여인이 장로…</p>
