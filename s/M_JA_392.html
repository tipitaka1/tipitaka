<h1>M_JA_392_싱가뿝파(향기를 훔친 선인)</h1>
<p>세존께서 제따와나에 머무실 때, 어떤 비구를 두고 하신 말씀이다. 꼬살라의 숲에 살던 그가 연못의 연꽃 냄새를 맡자 숲에 사는 신이 「그대는 향기 도둑이다」 하여 절박하게 하였고, 세존께서는 「옛 현자들도 그렇게 절박함을 얻었다」 하시고 옛일을 드셨다. 옛날 바라나시에서 보살은 까시의 바라문 집안에 나 선인으로 출가해 한 연못에 기대어 살았다. 하루는 활짝 핀 연꽃 냄새를 맡고 섰는데, 한 여신이 나무 등걸 구멍에 서서 그를 향기 도둑이라 하였…</p>
