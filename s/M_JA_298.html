<h1>M_JA_298_우둠바라(무화과를 가로채다)</h1>
<p>세존께서 제따와나에 머무실 때 어떤 비구를 두고 하신 말씀이다. 그는 변방 마을에 절을 지어 살았는데, 절이 아름답고 물이 편하고 탁발할 마을이 멀지도 가깝지도 않아 사람들이 반겨 밥을 주었다. 유행하던 비구 하나가 그 절에 이르러 며칠 좋은 밥을 얻어먹어 보고 「이 비구를 속여 내쫓고 이 절을 차지하리라」 생각하여, 「어찌 부처님을 뵈러 가지 않는가, 그동안은 내가 돌보겠다」 하여 그를 떠나보냈다. 그러고는 그가 없는 동안 사람들에게 그의 허…</p>
