<h1>M_JA_027_아빈하(코끼리와 개의 사귐)</h1>
<p>세존께서 제따와나에 머무실 때 사왓티의 한 청신사와 나이 든 장로를 두고 말씀하셨다. 두 벗 가운데 하나가 출가한 뒤에도 날마다 서로를 찾으니 그 가까움이 비구들 사이에 소문이 났다. 옛날 바라나시에서 브라흐마닷따가 다스릴 때 보살은 그의 대신이었다. 왕의 상서로운 코끼리 곁에 개 한 마리가 드나들며 흘린 밥을 먹다가 둘은 떨어져 지낼 수 없는 사이가 되었다. 어떤 시골 사람이 그 개를 얻어 데려가 버리자 코끼리는 먹지도 마시지도 씻지도 않았다…</p>
