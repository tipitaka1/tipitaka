<h1>M_YAM_06_상카라야마까 (형성)</h1>
<p>세 가지 형성이 있다 — 몸의 형성, 말의 형성, 마음의 형성이다. 들숨과 날숨은 몸의 형성이고, 생각과 살핌은 말의 형성이며, 지각과 느낌은 마음의 형성이다. 생각과 살핌을 제외하고 마음과 결합된 모든 법은 마음의 형성이다. (가) 몸은 몸의 형성인가?</p>
