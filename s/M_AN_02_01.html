<h1>M_AN_02_01_깜마까라나(두 가지 허물)</h1>
<p>이와 같이 나는 들었다. 한때 세존께서는 사왓티의 제따와나, 아나타삔디까 승원에 머무셨다. 거기서 세존께서 비구들에게 이르셨다. 「비구들이여.」 「예, 존자시여.」 그 비구들은 세존께 대답했다. 세존께서 이렇게 말씀하셨다 — 비구들이여, 두 가지 허물이 있다. 어떤 두 가지인가? 지금 여기에서의 허물과 다음 생에서의 허물이다. 비구들이여, 무엇이 지금 여기에서의 허물인가? 비구들이여, 여기 어떤 사람은 도둑질하고 죄를 지은 자를 왕들이 붙잡아 …</p>
