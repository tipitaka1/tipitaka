<h1>M_THAP_020_랏타빨라 장로의 아빠다나</h1>
<p>흰 일산까지 갖춘 코끼리를 통째로 바침 빠두뭇따라 세존, 세상의 어른이신 여여한 분께 나는 훌륭한 코끼리를 바쳤다. 수레채 같은 엄니를 지닌 힘센 것이었다. 흰 일산으로 꾸미고 안장과 코끼리몰이꾼까지 딸려서. 그 모두를 값으로 쳐서 나는 승원을 지었다. 오만 사천 채의 누각을 나는 지었다. 큰 물결 같은 보시를 하고 큰 선인께 바쳤다. 큰 영웅, 스스로 깨달으신 으뜸가는 분이 기뻐하셨다. 모든 사람을 기쁘게 하시며 죽음 없는 자리를 설하셨다. …</p>
