<h1>M_THAG_03_006_쿳자소비따 장로의 게송</h1>
<p>등이 굽어 그리 불린 빠딸리뿟따 사람 빠딸리뿟따 바라문 집안에 태어나 소비따(Sobhita)라 불렸으나, 등이 조금 굽어 쿳자소비따(Khujjasobhita)로 알려졌다. 세존께서 반열반하신 뒤 아난다(Ānanda) 존자 밑에서 출가해 육신통을 갖추었다. 제1차 결집 때 라자가하 삿따빤니 동굴에 모인 승가가 「아난다 존자를 모셔 오라」 이르자, 땅으로 잠겨 들어가 존자 앞에 솟아나 승가의 말을 전하고, 자기가 먼저 허공으로 날아 동굴 문에 이르…</p>
