<h1>A_VV_076_마니투나</h1>
<p>「보석 기둥이 선 이 천궁은 높고」란 마니투나 천궁이다. 그 인연은 무엇인가? 세존께서는 사왓티의 제따 숲에 머무셨다. 그때 여러 장로 비구가 숲속에 머물고 있었다. 그분들이 마을로 탁발하러 가는 길에서 어떤 청신사가 울퉁불퉁한 데를 고르게 하고 가시를 걷어 내고 덤불을 치웠으며, 물이 흐르는 철에는 도랑에 다리를 놓고, 나무 없는 자리에는 그늘 나무를 심고, 물웅덩이에서는 진흙을 걷어 내어 넓고 깊게 하고 물가를 다듬었으며, 살림에 맞게 보시…</p>
