<h1>M_VV_072_빠타마꾼달리(첫째 귀고리 천궁)</h1>
<p>목갈라나가 귀고리를 하고 하늘 천궁에서 달처럼 빛나는 천자에게 묻는다. 천자는 계를 갖춘 사문들께 먹을 것과 마실 것을 정성껏 올린 일을 답한다. 꾸미고 화환을 걸고 고운 옷을 입었으며, 귀고리를 하고 머리와 수염을 다듬은 이여, 손에 장신구를 두른 명성 높은 이여, 하늘 천궁에서 달과 같습니다. 하늘의 비파가 아름답게 울리니, 예순넷이 잘 익혀 곱게 갖추었고, 삼십삼천을 노니는 훌륭한 하늘 처녀들이 춤추고 노래하며 기쁘게 합니다.</p>
