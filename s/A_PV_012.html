<h1>A_PV_012_우라가</h1>
<p>「뱀이 낡은 허물을 벗듯」 — 이것은 스승께서 제따 숲에 머무실 때 어떤 청신사를 두고 말씀하신 것이다. 사왓티의 어떤 청신사에게 아들이 죽었다고 한다. 그는 아들의 죽음으로 슬픔과 울음에 잠겨, 밖으로 나가 아무 일도 하지 못하고 집에만 있었다. 그때 스승께서는 이른 새벽에 큰 연민의 증득에서 일어나 부처의 눈으로 세상을 살펴보시다가 그 청신사를 보시고, 오전에 옷을 입고 발우와 가사를 들고 그의 집으로 가서 문 앞에 서셨다. 청신사는 스승께…</p>
