<h1>M_AN_08_02_마하(긴 경들 여덟)</h1>
<p>나는 이렇게 들었다 — 한때 세존께서 웨란자의 날레루 님바나무 아래에 머무셨다. 그러자 웨란자 바라문이 세존께 다가갔다; 다가가서 세존과 기쁘게 인사를 나누었다. 기쁘고 정다운 이야기를 나눈 뒤 한쪽에 앉았다. 한쪽에 앉은 웨란자 바라문이 세존께 이렇게 말했다 — 「저는 이렇게 들었습니다, 고따마 존자시여 – 「사문 고따마는 늙고 나이 들고 연로하고 살날이 다하고 만년에 이른 바라문들에게 절을 하지도 않고 일어나 맞이하지도 않고 자리를 권하지도…</p>
