<h1>M_THAG_01_023_고살라 장로의 게송</h1>
<p>마가다(Magadha)의 재산가 집안에 태어난 고살라(Gosāla)다. 소나 꼬띠깐나(Soṇa Koṭikaṇṇa)와 가까이 지내던 터에 그가 출가했다는 말을 듣고 「그런 큰 부자도 출가하는데 하물며 나랴」 하며 절박함이 나 세존 곁에서 출가했다. 고향 마을 가까운 산등…</p>
