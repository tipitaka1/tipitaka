<h1>M_UD_01_001_빠타마보디(첫째 깨달음)</h1>
<p>깨달으신 뒤 이레 동안 한자리에 앉아 계시던 세존께서 삼매에서 나오시어, 밤의 첫 무렵에 연기를 순서대로 마음에 기울이시고 읊으신 우다나다. 원인과 함께한 법을 꿰뚫어 아는 이에게 의심이 사라진다고 하신다. 이와 같이 나는 들었다. 한때 세존께서 우루웰라의 네란자라 강기슭 보리수 아래에 머무셨다. 바르게 깨달으신 지 얼마 되지 않은 때였다. 마침 그때 세존께서는 이레 동안 한 가부좌 그대로 앉아 해탈의 즐거움을 누리고 계셨다.</p>
