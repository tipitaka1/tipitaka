<h1>M_THIG_13_003_짜빠 장로니의 게송</h1>
<p>아지와까 우빠까의 마음을 흔든 사냥꾼의 딸 왕가하라 지방 사냥꾼 마을에서 우두머리 사냥꾼의 딸로 태어나 짜빠(Cāpā)라 불렸다. 아지와까 우빠까(Upaka)는 깨달으신 세존을 길에서 뵙고도 샛길로 빠져 이 마을에 와 살았다. 사냥꾼이 먼 사냥길을 떠나며 그를 잘 모시라 이르자, 걸식하러 온 우빠까가 짜빠를 보고 애욕에 사로잡혀 이레를 굶고 누웠다. 이 게송은 그 뒤 두 사람 사이에 오간 말이다. 전에는 지팡이를 든 이였으나 이제는 사슴 사냥꾼…</p>
