<h1>M_THAP_023_수부띠 장로의 아빠다나</h1>
<p>스스로를 꾸짖는 독백으로 시작하는 무쟁제일의 본기 563편 가운데 드물게 정형을 벗어난 편입니다. 앞의 스무 게송이 자기 마음을 꾸짖는 독백으로, 숲에서 나가라고 스스로를 몰아붙입니다. 히말라야에서 멀지 않은 곳에 니사바라는 이름의 산이 있었다. 내 암자는 잘 지어졌고 잎으로 인 초막도 잘 갖추어져 있었다. 꼬시야라는 이름의, 고행이 뛰어난 결발 수행자로 나는 홀로, 짝 없이 그때 니사바 산에 머물렀다. 그때 나는 열매도 뿌리도 잎도 먹지 않았…</p>
