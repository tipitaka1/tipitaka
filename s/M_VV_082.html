<h1>M_VV_082_아네까완나 (여러 빛깔)</h1>
<p>여러 빛깔의 천궁에 올라 천녀들에 둘러싸여 기뻐하는 천자에게, 명성으로도 공덕으로도 견줄 이가 없다며 어떤 업의 과보인지 묻는다. 천자는 예전 수메다 승리자의 제자였을 때 자기에게는 바칠 것이 없어 남들에게 사리탑에 공양하라고 권하였을 뿐이라고 답한다.</p>
