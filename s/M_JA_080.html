<h1>M_JA_080_비마세나(이름만 빌린 활잡이)</h1>
<p>세존께서 제따와나에 머무실 때 잘난 체하는 한 비구를 두고 하신 말씀이다. 그는 제 집안과 재산을 내세워 다른 비구들을 깔보았다. 옛날 보살은 바라문 집안에 나서 딱까실라에서 학예를 익혀 「작은 활잡이 현자」가 되었다. 키가 작아 왕이 써 주지 않을까 하여 훤칠한 직조공 비마세나를 앞세워 활잡이라 하게 하고 자기는 시중꾼이 되어 일은 도맡아 해냈다. 비마세나는 보살이 일러 준 대로 호랑이와 물소를 잡아 큰 상을 얻고는 교만해져 보살을 업신여겼다…</p>
