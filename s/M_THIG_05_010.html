<h1>M_THIG_05_010_빠따짜라 장로니의 게송</h1>
<p>하루에 온 집안을 잃은 지율제일 비구니 사왓티 장자의 딸로 태어나 집안 일꾼과 정을 통하다가, 부모가 혼처를 정하자 그와 함께 달아나 시골 마을에 살았다. 아이를 낳을 때가 되어 친정으로 가던 길에 때아닌 폭풍우를 만났다고 주석서는 전한다. 전생에 빠두뭇따라(Padumuttara) 부처님 곁에서 율을 지닌 비구니 가운데 으뜸인 분을 뵙고 그 자리를 서원한 이다. 게송은 출가한 뒤의 일이다. 발 씻은 물이 흘러가는 것을 보고 마음을 모았고, 등불…</p>
