<h1>M_THAP_408_난다까 장로의 아빠다나</h1>
<p>벽지불께 연꽃 덮은 정자를 세운 사냥꾼 사냥꾼이던 시절 스스로 깨달으신 아누룻다 부처님께 막대 넷으로 정자를 세워 연꽃으로 덮어 드린 이야기입니다. 정자를 지어 드린 과보로 천상에서 더위를 모르고 지낸 대목이 길게 이어지고, §12부터 다섯 게송이 &quot;이것이 부처님께 공양한 과보다&quot;로 맺어집니다. 마지막에는 고따마 부처님께 길을 여쭈어 번뇌의 다함에 이릅니다. 예전에 나는 사냥꾼이었다. 숲속 밀림에서 살았다. 점박이 사슴을 찾다가 나는 스스로 깨…</p>
