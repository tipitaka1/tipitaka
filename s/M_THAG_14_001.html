<h1>M_THAG_14_001_카디라와니야레와따 장로의 게송</h1>
<p>「카디라와니야(Khadiravaniya)」는 「카디라 숲에 사는 이」라는 뜻이다. 아라한이 된 뒤 때때로 세존과 큰 장로들을 뵈러 갔다가 며칠만 머물고는 카디라 숲으로 돌아와 과의 증득과 거룩한 머묾으로 지냈다. 늙은 뒤 세존을 뵈러 가다 사왓티(Sāvatthī) 가까…</p>
