<h1>M_SNP_03_008_살라(슬픔의 화살)</h1>
<p>태어난 것에게 죽음은 정해져 있고, 슬피 울어도 죽은 이에게는 아무 보탬이 없다고 이르는 편이다. 슬픔을 제 몸에 박힌 화살에 견주어, 제 행복을 구하는 이라면 그 화살을 스스로 뽑으라고 권한다. 편 이름 「살라」가 그 화살이다. 여기 죽어야 할 이들의 목숨은 표징도 없고 알 수도 없다. 힘겹고 짧으며, 그것도 괴로움에 얽혀 있다. 태어난 것이 죽지 않게 할 방도는 없다. 늙음에 이르러도 죽음뿐, 목숨 있는 것들은 그런 성질이다.</p>
