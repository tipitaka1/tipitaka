<h1>M_THAP_425_에까사나다야까 장로의 아빠다나</h1>
<p>빠두뭇따라께 나무 침상을 펴 드린 이 히말라야 기슭 고시따 산에 살던 고행자 나라다가 허공길로 오신 빠두뭇따라 부처님께 나무 침상 한 자리를 펴 드린 이야기입니다. 부처님을 의사에 견주어 병을 고쳐 달라고 아뢰는 청이 앞에 놓이고(§6~§8), 부처님의 수기가 그 뒤를 잇습니다(§10~§14). 히말라야에서 멀지 않은 곳에 고시따라는 산이 있었다. 나의 암자는 잘 지어졌고 잎으로 이은 집도 잘 만들어졌다. 이름은 나라다였고 사람들은 나를 깟사빠…</p>
