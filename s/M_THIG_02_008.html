<h1>M_THIG_02_008_아바야마뚜 장로니의 게송</h1>
<p>웃제니의 이름난 기녀 빠두마와띠(Padumavatī)다. 빔비사라 왕이 그 아름다움을 듣고 약카의 힘을 빌려 웃제니로 가 하룻밤을 지냈고, 그때 든 아이가 아바야(Abhaya)다. 일곱 살이 되자 아들을 왕에게 보내어 기르게 했고, 아들은 뒷날 출가하여 장로가 되었다.…</p>
