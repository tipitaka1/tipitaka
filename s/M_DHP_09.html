<h1>M_DHP_09_빠빠왁가 (악품)</h1>
<p>악을 짓지 말고 선한 일은 서두르라고 말하는 게송 열셋입니다. 악과 공덕은 물방울이 물동이를 채우듯 조금씩 쌓이고, 익기 전에는 그 결과가 보이지 않는다고 말합니다. 마지막 두 게송은 지은 업에서도 죽음에서도 벗어날 자리가 이 땅에 없다고 못박습니다. 선한 일은 서둘러 하고, 악에서 마음을 막아라. 공덕 짓기에 굼뜨면 마음은 악을 즐긴다. 사람이 악을 지었거든 그것을 거듭 짓지 마라. 거기에 마음을 두지 마라. 악이 쌓임은 괴롭다.</p>
