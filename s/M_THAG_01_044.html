<h1>M_THAG_01_044_사누 장로의 게송</h1>
<p>환속하려다 어머니 말에 돌아선 사미 사왓티의 청신사 집에 났다. 태 안에 있을 때 아버지가 먼 길을 떠나, 어머니가 홀로 낳아 사누(Sānu)라 이름했다. 일곱 살에 출가시켰고, 「사누 사미」로 알려져 지혜롭고 배움이 많고 법을 설할 줄 알며 뭇 삶에 자애로워 신과 사람에게 사랑받았다. 전생의 어머니는 약카의 몸을 받아 그를 지켰다. 어느 날 환속할 마음을 내자 약카 어머니가 이를 사람 어머니에게 알렸고, 슬픔에 잠겨 우는 어머니를 보고 이 게…</p>
