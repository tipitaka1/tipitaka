<h1>M_THAG_06_012_Brahmadatta 장로의 게송</h1>
<p>꼬살라 왕의 아들로 태어난 이 꼬살라 왕의 아들로 사왓티에서 나 브라흐마닷따(Brahmadatta)라 불렸다. 제따와나 대축제에서 부처님의 위덕을 보고 믿음을 내어 출가했고, 위빳사나를 닦아 막힘없는 앎과 육신통을 갖추었다. 성안에서 탁발하는데 어떤 바라문이 거듭 욕을 퍼부었으나 잠자코 걸었고, 「저 장로는 아무 말이 없다」고 사람들이 수군거리자 그들에게 법을 설하며 이 게송을 읊었다. 성냄 없는 이에게 어디서 성냄이 오랴, 길들고 고르게 사는…</p>
