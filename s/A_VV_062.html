<h1>A_VV_062_쭐라라타</h1>
<p>「굳센 활, 단단한 심재로 만든 활에 기대어」란 쭐라라타 천궁이다. 그 인연은 무엇인가? 세존께서 완전한 열반에 드시고 사리를 나누어 곳곳에 스승의 탑을 세울 때, 마하깟사빠 장로를 앞세워 법을 결집할 제자들을 가려 뽑았는데, 그 제자들이 안거에 들 때까지 저마다 제 무리와 함께 가르침을 받을 이들을 살피며 곳곳에 머물고 있었다. 그때 마하깟짜야나 존자는 변두리 지방의 어느 숲에 머물고 있었다. 그 무렵 앗사까 나라의 뽀딸리 성에서 앗사까 왕이…</p>
