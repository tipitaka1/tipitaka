<h1>M_SNP_01_012_무니(성자의 삶)</h1>
<p>성자(muni)가 어떤 사람인지를 견줌을 바꾸어 가며 거듭 밝히는 편이다. 홀로 다니고 사귐도 거처도 두지 않으며, 비난과 칭찬에 흔들리지 않는 이를 굳센 이들이 성자라 안다고 되풀이해 이른다. 끝에서는 재가자의 삶과 성자의 삶이 서로 멀다고 견준다.</p>
