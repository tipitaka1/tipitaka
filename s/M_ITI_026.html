<h1>M_ITI_026_다나(보시의 과보)</h1>
<p>세존께서 아시는 그대로 중생들이 보시와 나눔의 과보를 안다면 마지막 한 입까지도 나누지 않고는 먹지 않으리라고 말씀하신 편이다. 세존께서 이렇게 말씀하셨다. 아라한께서 이렇게 말씀하신 것을 나는 들었다 — 비구들이여, 내가 아는 그대로 중생들이 보시와 나눔의 과보를 안다면, 그들은 주지 않고 먹지 않을 것이고, 인색이라는 때가 그들의 마음을 사로잡고 있지도 않을 것이다. 마지막 한 입, 마지막 한 덩이가 남았더라도 받을 이가 있다면 나누지 않고…</p>
