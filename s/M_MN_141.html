<h1>M_MN_141_삿짜위방가(진리를 갈라 봄경)</h1>
<p>나는 이렇게 들었다 — 한때 세존께서는 바라나시의 이시빠따나 사슴동산에 머무셨다. 거기서 세존께서 비구들에게 이르셨다. 「비구들이여.」 「예, 존자시여.」 그 비구들은 세존께 대답했다. 세존께서 이렇게 말씀하셨다. 비구들이여, 여래께서 아라한이시고 바르게 깨달으신 분께서 바라나시의 이시빠따나 사슴동산에서 위없는 법의 바퀴를 굴리셨으니, 사문이든 바라문이든 신이든 마라든 브라흐마든 세상의 그 누구든 되돌릴 수 없는 것이다, 곧 네 가지 성스러운 …</p>
