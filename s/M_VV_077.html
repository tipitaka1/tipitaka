<h1>M_VV_077_마니투나(보석 기둥 천궁)</h1>
<p>목갈라나가 보석 기둥이 선 천궁에 사는 천자에게 묻는다. 천자는 인적 없는 길에 다리를 놓고 동산에 나무를 심으며 보시한 일을 답한다. 보석 기둥이 선 이 천궁은 높고, 둘레가 열두 요자나이며, 칠백 채의 훌륭한 첨탑 누각이 묘안석 기둥에 아름다운 자리를 깔고 있습니다. 그대는 거기 머물러 마시고 먹으며, 하늘의 비파가 아름답게 울립니다. 여기 하늘의 맛과 다섯 가닥 감각의 즐거움이 있고, 황금을 두른 여인들이 춤춥니다.</p>
