<h1>M_JA_530_상낏짜(지옥을 일러 준 현자)</h1>
<p>세존께서 지와까의 망고 숲에서 아자따삿뚜가 아버지를 죽인 업을 두고 하신 말씀이다. 그는 데와닷따의 말을 좇아 아버지를 죽인 뒤, 데와닷따가 땅에 삼켜졌다는 말을 듣고 두려워 잠을 이루지 못하다가, 지와까의 이끎으로 세존을 뵙고 청신사가 되어 두려움을 벗었다. 옛날 바라나시에서 보살은 제관의 아들 상낏짜로 나, 브라흐마닷따 왕의 아들과 함께 자라 딱까실라에서 배웠다. 왕자가 부왕의 영화를 탐내 아버지를 죽이려 하자 세 번 말렸으나 듣지 않으므로…</p>
