<h1>M_MN_112_찹비소다나(여섯 가지 청정)</h1>
<p>이와 같이 나는 들었다. 한때 세존께서는 사왓티의 제따와나, 아나타삔디까 승원에 머무셨다. 거기서 세존께서 비구들에게 이르셨다. 「비구들이여.」 「예, 존자시여.」 그 비구들은 세존께 대답했다. 세존께서는 이렇게 말씀하셨다. &quot;비구들이여, 여기 비구가 완전한 앎을 밝힌다. 「태어남은 다했다. 청정한 삶은 완성되었다. 할 일을 다 마쳤다. 다시는 이런 상태로 오지 않는다라고 나는 안다.」 비구들이여, 그의 그 비구의 말을 기뻐해서도 안 되고 물리…</p>
