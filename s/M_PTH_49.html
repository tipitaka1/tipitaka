<h1>M_PTH_49_다툼 있는 것 이법 · 느낌 삼법</h1>
<p>〔성립하는 조건의 수 — 실측 178건〕 사라나(saraṇa)를 「귀의처」로 읽으면 안 된다. 여기서는 라나(raṇa), 곧 다툼·싸움을 가진 것이라는 뜻이고, 다툼이란 번뇌를 가리킨다. 〔팔리 원문〕 느낌 삼법의 세 칸은 즐거운 느낌·괴로운 느낌 그 자체가 아니라 「그 느낌과 결합한 법」이다. 느낌 자신은 자기와 결합할 수 없으므로 셈에서 빠진다.</p>
