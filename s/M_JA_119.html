<h1>M_JA_119_아깔라라위(때 아닌 때 우는 닭)</h1>
<p>세존께서 제따와나에 머무실 때, 때 아닌 때 소리치는 한 비구를 두고 하신 말씀이다. 그는 소임도 학계도 익히지 않아 때를 알지 못했고, 밤에 깰 때마다 큰 소리를 내어 비구들이 잠을 자지 못했다. 세존께서 「전에도 때 아닌 때 울다가 목숨을 잃었다」 하시고 옛일을 들려주셨다. 옛날에 보살은 바라나시에서 이름난 스승으로 오백 학도를 가르쳤다. 학도들은 때맞춰 우는 수탉의 울음에 일어나 배웠는데, 그 닭이 죽자 한 학도가 무덤 숲에서 닭을 데려와…</p>
