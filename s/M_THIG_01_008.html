<h1>M_THIG_01_008_밋따 장로니의 게송</h1>
<p>벗을 기뻐하는 이가 되라는 게송을 받은 이 주석서에서 이 분의 내력을 확인하지 못했다. 믿음으로 출가하였으니 벗을 기뻐하는 이가 되어 선한 법을 닦고 안온에 이르라고, 「밋따여」 하고 이르는 게송이다. 믿음으로 출가하였으니, 밋따여, 벗을 기뻐하는 이가 되라. 선한 법을 닦으라, 안온에 이르기 위하여. 〔§8〕 「밋따」는 「벗」이라는 뜻이다. 이름과 「벗을 기뻐하는 이」가 같은 말이다.</p>
