<h1>M_THIG_01_006_디라 장로니의 게송</h1>
<p>내력은 없고 이름만 불린 장로니 주석서에서 이 분의 내력을 확인하지 못했다. 다만 뒤의 위사카(Visākhā) 장로니와 상가(Saṅghā) 장로니의 내력이 이 분과 같다고 주석서가 적었다. 「디라여」 하고 불러, 지각이 가라앉은 즐거움인 소멸에 닿고 위없는 안온인 열반을 이루라고 이르는 게송이다. 디라여, 소멸에 닿으라, 지각이 가라앉은 즐거움에. 열반을 이루라, 위없는 안온을.</p>
