<h1>M_JA_390_마이하까(내 것이라 우는 새)</h1>
<p>세존께서 제따와나에 머무실 때, 아간뚜까 부호를 두고 하신 말씀이다. 큰 재산을 두고도 스스로 쓰지 않고 남에게도 주지 않던 그가 아들 없이 죽자 왕이 그 까닭을 여쭈었고, 세존께서는 아들을 얻지 못한 까닭으로 옛일을 드셨다. 옛날 바라나시에서 보살은 팔십 꼬띠의 부호 집안에 나 보시당을 세워 크게 보시하다가, 아들이 걸음마할 무렵 재산을 모두 아우에게 넘기고 선인으로 출가했다. 아우는 살림이 둘로 갈릴까 하여 형의 아들을 강물에 밀어 죽였다.…</p>
