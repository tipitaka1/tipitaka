<h1>M_PTH_59_역론 삼법 빳타나</h1>
<p>〔성립하는 조건의 수 — 실측 3건〕 「역」(paccanīya)은 조건이 되지 않는 자리를 센다는 뜻이 아니다. 법의 이름에 부정을 걸어 놓고, 그렇게 세운 법들 사이에서 조건이 성립하는 갈래를 다시 세는 것이다. 〔성립하는 조건의 수 — 실측 3건〕 「선이 아닌 법」(na kusala)은 불선법(akusala)이 아니다. 불선과 무기를 함께 싸잡는다. 셋 가운데 하나를 지우면 나머지 둘이 한 덩어리가 되므로, 역론의 셈은 순론의 셈을 그대로 …</p>
