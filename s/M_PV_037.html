<h1>M_PV_037_세리사까(세리사까 약카)</h1>
<p>땅에 사는 신들 무리에 든 세리사까 약카가 모래벌판에서 길을 잃은 대상(隊商)을 만나 주고받은 문답이다. 약카는 자기가 전생에 꼬살라를 다스리던 빠야시 왕이었고 꾸마라깟사빠 존자의 법문을 듣고 뒤틀린 견해를 버렸다고 밝힌 뒤, 대상 가운데 있던 이발사 삼바와를 가리켜 그를 업신여기지 말라고 이른다. 약카와 상인들의 이야기를 들으십시오. 그때 그들이 어디서 만났는지를. 서로 주고받은 말이 어떠하였는지, 그 잘 설해진 말을 다 함께 들으십시오.</p>
