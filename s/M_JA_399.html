<h1>M_JA_399_마뚜뽀사까깃자(부모를 봉양한 독수리)</h1>
<p>세존께서 제따와나에 머무실 때, 어머니를 봉양하는 어떤 비구를 두고 하신 말씀이다. 지금의 이야기는 수완나사마 자따까에 나온다. 옛날 바라나시에서 보살은 독수리로 나, 늙고 눈먼 부모를 산굴에 두고 고기를 물어다 봉양했다. 그때 바라나시의 무덤에 한 사냥꾼이 독수리를 노려 올가미를 놓았다. 하루는 보살이 먹이를 찾아 들어갔다가 발이 걸렸는데, 제 걱정은 하지 않고 「내가 걸린 줄도 모르고 부모가 산굴에서 말라 죽겠구나」 하며 울부짖었다. 사냥꾼…</p>
