<h1>M_JA_356_꼬란디야(강을 메우려 한 제자)</h1>
<p>세존께서 제따와나에 머무실 때, 법의 장군을 두고 하신 말씀이다. 장로는 오는 대로 계 없는 사냥꾼과 어부 들에게 보이는 대로 「계를 받으시오, 계를 받으시오」 하며 계를 주었다. 그들은 장로가 어려워 거절하지 못해 받고는 지키지 않고 제 일만 했다. 장로가 함께 사는 이들에게 그 말을 하니 「존자시여, 그들이 바라지 않는데 주시니 그렇습니다. 이제부터 그런 이들에게는 주지 마십시오」 했다. 장로는 언짢았다. 비구들이 법당에서 그 일을 이야기하…</p>
