<h1>M_CP_034_에까라자(에까라자의 자애)</h1>
<p>보살이 에까라자라는 이름으로 널리 알려진 왕이었을 때의 일을 말한다. 답바세나에게 나라를 빼앗기고 구덩이에 묻히고서도 그를 사랑하는 아들처럼 보았다. 또 내가 에까라자라고 널리 알려졌을 때, 더없이 높은 계를 굳게 세우고 큰 땅을 다스렸다. 열 가지 착한 업의 길을 남김없이 걸었고, 네 가지 거두어들이는 법으로 많은 사람을 감싸 안았다. 이렇게 내가 이 세상에도 저 세상에도 게으르지 않을 때, 답바세나가 와서 내 성을 빼앗았다.</p>
