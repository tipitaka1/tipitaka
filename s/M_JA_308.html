<h1>M_JA_308_사꾸나(은혜 모르는 사자)</h1>
<p>세존께서 제따와나에 머무실 때 데와닷따의 은혜 모름을 두고 하신 말씀이다. 「비구들이여, 데와닷따는 지금만이 아니라 전에도 은혜를 몰랐다」 하시고 옛일을 드셨다. 옛날 바라나시에서 보살은 히말라야 지방의 딱따구리로 났다. 고기를 먹던 사자 하나가 목에 뼈가 걸려 목이 붓고 먹이를 얻지 못해 심한 아픔을 겪었다. 먹이를 찾던 새가 까닭을 묻고 「뼈를 빼 주겠으나 그대 입에 들어가기가 두렵다」 하니, 사자가 두려워 말라 했다. 새는 사자를 왼쪽으로…</p>
