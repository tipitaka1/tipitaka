<h1>M_UD_08_005_쭌다 (대장장이 아들 쭌다)</h1>
<p>세존께서 빠와에서 대장장이 아들 쭌다가 올린 마지막 공양을 드시고 심한 병을 얻으신 뒤 꾸시나라로 향하시는 이야기다. 세존께서는 그 공양을 올린 쭌다가 뉘우치지 않도록 아난다 존자에게 일러 두시고, 베푸는 이에게 공덕이 자란다고 읊으셨다.</p>
