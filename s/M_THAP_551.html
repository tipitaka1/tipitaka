<h1>M_THAP_551_와나왓차 장로의 아빠다나</h1>
<p>숲에서 태어나 숲에 산 싯닷타의 벗 깟사빠 부처님의 가르침에 출가한 일에서 시작합니다. 숲에서 비둘기로 태어나 선정을 즐기는 비구를 따르던 대목(§4–§8), 어머니가 숲에서 낳아 가사로 받았다는 대목(§12–§13), 싯닷타 왕자의 벗이었고 그분께서 집을 나서시자 함께 출가했다는 대목(§14–§15)이 이어집니다. 정형을 벗어난 서사가 길게 놓여 있습니다. 이 상서로운 겁에 범천의 친족, 큰 명성을 지닌 이, 성이 깟사빠인, 말하는 이 가운데…</p>
