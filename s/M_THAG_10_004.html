<h1>M_THAG_10_004_쭐라빤타까 장로의 게송</h1>
<p>쭐라빤타까(Cūḷapanthaka)는 마하빤타까(Mahāpanthaka)의 아우로, 옛적 빠두뭇따라 부처님 때 「마음으로 이룬 몸을 지어내는 데 으뜸」을 서원한 분이다. 형이 아라한이 된 뒤 외조부인 부호에게 청해 아우도 출가시켰다. 그러나 게송 한 수를 넉 달이 지나…</p>
