<h1>M_JA_246_발로와다(고기 먹는다 나무라다)</h1>
<p>세존께서 웨살리 꾸따가라살라에 머무실 때, 시하 장군을 두고 하신 말씀이다. 그가 세존께 귀의하고 이튿날 고기가 든 공양을 올리자, 니간타들이 성이 나서 「사문 고따마가 저를 위해 죽인 줄 알면서 고기를 먹는다」 하고 욕했다. 비구들이 「니간타 나따뿟따가 무리와 함께 다니며 욕한다」 하고 이야기하자, 세존께서 「전에도 그 일로 나를 나무랐다」 하시고 옛일을 들려주셨다. 옛날 보살은 바라나시 바라문 집안에 나 선인으로 출가했고, 소금과 신맛을 얻…</p>
