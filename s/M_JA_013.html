<h1>M_JA_013_깐디(정에 끌려 죽은 사슴)</h1>
<p>세존께서 제따와나에 머무실 때, 옛 아내에게 마음이 흔들린 비구를 두고 하신 말씀이다. 세존께서는 그에게 「그대는 전에도 이 여인 때문에 목숨을 잃고 숯불에 구워졌다」 하셨다. 옛날 마가다의 라자가하에서, 산에 살던 사슴 하나가 마을 가까이 사는 암사슴과 정을 통해 무리를 따라 산을 내려갔다. 암사슴이 마을 근처는 두렵고 위험하니 오지 말라 했으나 마음이 매인 그는 돌아서지 않았다. 길목 초막에는 사냥꾼이 숨어 있었고, 사람 냄새를 맡은 암사슴…</p>
