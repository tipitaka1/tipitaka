<h1>M_SNP_05_016_모가라자마나와뿟차(모가라자의 물음)</h1>
<p>바라문 학도 모가라자가 앞서 두 번 여쭈고도 답을 얻지 못한 끝에 다시 세존께 나아가, 죽음의 왕에게 보이지 않으려면 세상을 어떻게 보아야 하는지 묻는 편이다. 세존께서는 언제나 사띠를 갖추어 세상을 텅 빈 것으로 보고 자아가 있다는 견해를 뽑으라고 이르신다. 두 번이나 저는 사꺄의 후예께 여쭈었습니다 (모가라자 존자가 말했다) 눈 있는 분께서는 제게 답해 주지 않으셨습니다. 세 번째에 이르면 신들의 선인께서 답해 주신다고 저는 들었습니다.</p>
