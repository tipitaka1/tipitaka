<h1>A_VV_082_맛타꾼달리</h1>
<p>「꾸미고 닦은 귀고리를 하고」란 맛타꾼달리 천궁이다. 그 인연은 무엇인가? 세존께서는 사왓티의 제따 숲에 머무셨다. 그때 사왓티에 사는 어떤 바라문이 있었다. 그는 부유하고 재물이 많고 누리는 것이 컸으나, 믿음이 없고 마음이 맑지 않고 그릇된 견해를 지녀 누구에게도 아무것도 주지 않았다. 주지 않는다 하여 「아딘나뿝바까(전에 준 적 없는 이)」로 알려졌다. 그는 그릇된 견해와 탐하는 성품 때문에 여래도 여래의 제자도 보려 하지 않았다. 맛타꾼…</p>
