<h1>M_JA_409_달하담마(늙어 버림받은 코끼리)</h1>
<p>세존께서 꼬삼비 고시따 승원에 머무실 때, 우데나 왕의 암코끼리 밧다와띠까를 두고 하신 말씀이다. 그 코끼리가 세존의 발치에 엎드려, 젊어 일할 때는 온갖 대접을 받았으나 늙자 다 거두어 가 숲에서 께따까를 먹고 산다며 옛 대접을 돌려 달라 빌었다. 세존께서 왕궁에 가시어 그 공을 말씀하시고 「도와준 이에게 준 영예를 늙었다고 거두는 것은 마땅치 않다」 하시니 왕이 그대로 했다. 비구들이 법당에서 이를 이야기하자 세존께서는 「지금만이 아니다」 …</p>
