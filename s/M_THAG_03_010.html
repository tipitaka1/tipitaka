<h1>M_THAG_03_010_사띠맛띠야 장로의 게송</h1>
<p>믿음 없던 집안을 믿음으로 이끈 이 마가다국 바라문 집안에 태어나 사띠맛띠야(Sāṭimattiya)라 불렸다. 숲에 사는 비구들 밑에서 출가해 위빳사나를 닦아 육신통을 갖추었고, 믿음 없던 한 집안을 믿음으로 이끌었다. 마라(Māra)가 장로의 모습을 하고 가서 그 집 딸의 손을 잡는 바람에 집안 사람들이 장로를 의심하게 되었는데, 이튿날 장로가 그 일을 살펴 마라의 짓임을 알고 꾸짖어 물리쳤다. 집주인이 용서를 빌고 「이제부터는 제가 모시겠습…</p>
