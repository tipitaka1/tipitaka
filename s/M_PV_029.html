<h1>M_PV_029_부사(겨를 먹는 아귀)</h1>
<p>겨와 쌀과 제 살과 똥을 먹는 네 아귀를 두고 무슨 과보냐고 묻자, 똥을 먹는 아귀 여인이 넷의 업을 하나하나 밝힌다. 하나는 겨를, 또 하나는 쌀을, 이 여인은 제 살과 피를, 그대는 더럽고 역겨운 똥을 먹는다. 이것은 무슨 과보인가? 이 사람은 전에 어머니를 해쳤고, 이 사람은 속임수를 쓰는 장사꾼이었습니다. 이 여인은 고기를 먹으며 거짓말로 속였습니다. 저는 사람들 사이에서 사람으로 났을 때 집안을 다 거느린 안주인이었습니다.</p>
