<h1>M_THAG_01_055_안자나와니야 장로의 게송</h1>
<p>안자나 숲에서 닦은 릿차위 왕자 웨살리(Vesālī)의 왓지 왕가에 태어났다. 웨살리에 닥친 가뭄과 질병과 비인(非人)의 세 가지 두려움이 세존께서 오시자 가라앉는 것을 보고, 믿음을 얻어 출가했다. 사께따(Sāketa)의 안자나 숲 무덤가에 머물다가 안거가 다가오자, 사람들이 버린 낡은 평상을 네 돌 위에 얹고 풀로 덮어 오두막으로 삼았다. 첫 달에 아라한이 되었고, 얻은 바를 돌이켜 보며 이 게송을 읊었다. 평상을 오두막 삼아 안자나 숲으로…</p>
