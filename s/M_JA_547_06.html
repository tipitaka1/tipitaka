<h1>M_JA_547_06_쭐라와나완나나(작은 숲을 그려 보이다)</h1>
<p>쩨따의 아들은 바라문에게 밥을 먹이고 길양식으로 꿀 단지와 구운 사슴 넓적다리를 주었다. 그러고서 길에 서서 오른손을 들어 보살이 사는 곳을 가리켰다. 「저것이 간다마다나 산이다. 거기 웻산따라 왕이 아이들과 함께 산다. 바라문 차림에 갈고리와 국자와 상투를 지니고, 가죽옷을 입고 땅에 누우며 불을 섬긴다.」 이어 온갖 열매나무와 꽃나무, 연꽃 덮인 못, 짝지어 우짖는 새들을 들어 그 작은 숲을 그려 보였다. 주자까가 제 미숫가루를 나누어 주려…</p>
