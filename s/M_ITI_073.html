<h1>M_ITI_073_산따따라(더 고요한 것)</h1>
<p>물질보다 비물질이 더 고요하고 비물질보다 소멸이 더 고요하다고 세존께서 말씀하신 편이다. 세존께서 이렇게 말씀하셨다. 아라한께서 이렇게 말씀하신 것을 나는 들었다 — 비구들이여, 물질보다 비물질이 더 고요하고, 비물질보다 소멸이 더 고요하다.</p>
