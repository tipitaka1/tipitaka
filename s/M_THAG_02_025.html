<h1>M_THAG_02_025_위따소까 장로의 게송</h1>
<p>아소까 왕의 아우 담마소까(Dhammāsoka, 아소까) 왕의 아우다. 왕자가 배울 학예를 다 익히고, 기리닷따(Giridatta) 장로를 의지해 재가자인 채로 경장과 아비담마에 밝았다. 어느 날 수염을 다듬다가 이발사에게 거울을 받아 몸을 비추어 보고 주름과 흰머리를 보자 절박함이 일어, 그 자리에서 예류자가 되었다. 이어 기리닷따 장로에게 출가해 오래지 않아 아라한이 되었고, 그 거울 앞의 일을 돌이키며 이 게송을 읊었다. 내 머리를 다듬으…</p>
