<h1>M_JA_410_소마닷따(죽은 코끼리를 울다)</h1>
<p>세존께서 제따와나에 머무실 때, 어떤 늙은 비구를 두고 하신 말씀이다. 그가 출가시킨 사미가 시중을 들다 병으로 죽자 그는 울며 다녔고, 비구들이 법당에서 「죽음에 대한 사띠의 수행주제가 없는 모양이다」 이야기했다. 세존께서는 「지금만이 아니다. 전에도 이 사람이 죽었을 때 울었다」 하시고 옛일을 드셨다. 옛날 보살은 서른셋 하늘에서 삭까 노릇을 했다. 그때 까시의 큰 재산 바라문이 히말라야에 들어 선인으로 출가해 살다가, 새끼 코끼리를 데려와…</p>
