<h1>M_DN_034_다숫따라(십상경)</h1>
<p>이와 같이 나는 들었다. 한때 세존께서 오백 명쯤 되는 큰 비구 승가와 함께 짬빠(Campā)의 각가라(Gaggarā) 연못 기슭에 머무셨다. 그때 사리뿟따(Sāriputta) 존자가 비구들을 불렀다. 「도반인 비구들이여.」 「도반이여.」 그 비구들은 사리뿟따 존자에게 대답했다. 사리뿟따 존자는 이렇게 말했다. 열반에 이르게 하는 법, 열까지 늘어 가는 법을 설하리라 괴로움을 끝내고 모든 매듭에서 풀려나게 하는 법을.</p>
