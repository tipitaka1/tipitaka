<h1>M_PV_033_두띠야미갈룻다까(둘째 사슴 사냥꾼)</h1>
<p>밤에는 누각에서 즐기고 낮에는 무덤터에 버려져 괴로움을 겪는 아귀에게 그 까닭을 묻자, 라자가하의 사슴 사냥꾼이었던 그가 벗의 집에 드나들던 비구의 권유로 밤에만 살생을 그쳤던 내력을 말하는 편이다. 뾰족지붕 누각과 높은 집에서, 긴 털 깔개를 편 자리에서 다섯 갈래 악기가 잘 울리는 가운데 그대는 즐긴다. 그러다 밤이 다하고 해가 떠오를 무렵이면 무덤터에 내던져져 많은 괴로움을 겪는다. 몸으로 말로 마음으로 무슨 나쁜 짓을 지었는가.</p>
