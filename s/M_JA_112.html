<h1>M_JA_112_아마라데위빤하(죽 나르는 처녀의 대답)</h1>
<p>이 편의 주석은 이 물음도 같은 자따까에서 드러난다고만 하고 줄거리를 말하지 않는다. 그 자따까의 주석에 이 게송이 놓인 자리가 나온다. 보살인 마호사다 현자는 아내 될 이를 스스로 찾으려고 바느질꾼 차림으로 북쪽 야와맛지까로 갔다. 길에서 아버지에게 죽을 나르는 아마라데위를 만나 손짓과 에두른 물음으로 그녀를 떠보았는데, 그녀는 하나하나 알아맞혔다. 죽을 얻어 마신 뒤 「그대 어머니 집으로 가려 하니 길을 일러 달라」 하자, 그녀가 길을 일러…</p>
