<h1>M_JA_388_뚠딜라(죽음 앞의 두 돼지)</h1>
<p>세존께서 제따와나에 머무실 때, 죽음을 두려워하는 비구를 두고 하신 말씀이다. 그는 가지 흔들리는 소리나 새와 짐승의 소리에도 놀라 떨며 다녔다. 세존께서는 「전에도 죽음을 두려워하였다」 하시고 옛일을 드셨다. 옛날 바라나시에서 보살은 암퇘지의 배에 들어 두 새끼로 났다. 어미가 인기척에 놀라 새끼를 버리고 달아나자, 목화밭에서 오던 늙은 여인이 그들을 아들로 여겨 데려다 마하뚠딜라와 쭐라뚠딜라라 이름 짓고 길렀다. 뒤에 술꾼들이 고기가 떨어지…</p>
