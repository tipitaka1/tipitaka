<h1>M_THAG_09_001_부따 장로의 게송</h1>
<p>신령이 지켜 살아난 사께따의 아들 부따(Bhūta)는 사께따(Sāketa) 성문 마을 큰 부호의 아들이다. 앞서 난 아이들은 원한 품은 약카가 잡아먹었으나 이 아이는 마지막 생이라 신령들이 지켜 주었고, 「이렇게 하면 비인간들이 가엾이 여겨 지켜 주리라」 하여 부따(신령)라 이름했다. 자라서 사께따에 머무시는 세존께 법을 듣고 믿음을 얻어 출가했고, 아자까라니 강가 굴에 살며 위빳사나를 닦아 오래지 않아 아라한이 되었다. 그 뒤 어느 때 이 게…</p>
