<h1>M_JA_021_꾸룽가미가(사냥꾼을 알아본 사슴)</h1>
<p>세존께서 웰루와나에 머무실 때 데와닷따를 두고 하신 말씀이다. 비구들이 법당에 모여 데와닷따가 여래를 죽이려고 활잡이를 보내고 바위를 굴리고 다나빨라 코끼리를 풀어놓았다며 헐뜯고 있었다. 세존께서는 그가 전에도 죽이려 했으나 죽이지 못했다 하시고 옛일을 드셨다. 옛날 바라나시에서 브라흐마닷따가 다스릴 때, 보살은 꾸룽가 사슴으로 태어나 숲에서 열매를 먹고 살며 열매가 익은 세빤니 나무를 찾았다. 한 사냥꾼이 열매나무 밑 사슴 발자국을 살펴 나무…</p>
