<h1>M_THAP_209_살랄라말리야 장로의 아빠다나</h1>
<p>활을 쏘아 꽃을 잘라 싯닷타께 올린 이 산 사이에 앉으신 싯닷타 부처님께 활을 쏘아 꼭지째 자른 꽃을 올린 이야기입니다. 산 사이에 앉으셔서 까니까라 꽃처럼 빛나시는 분을 모든 방향을 밝히시는 싯닷타, 사람을 이끄시는 분을 그때 나는 활을 빗나가지 않게 잡고 화살을 메겨 꽃을 꼭지째 잘라 부처님께 올렸다. 구십사 겁 전에 그때 꽃을 올린 그 일로, 나는 나쁜 곳을 알지 못한다. 이것이 부처님께 공양한 과보다. 이로부터 쉰한 겁 전에 나는 주띤다…</p>
