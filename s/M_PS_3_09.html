<h1>M_PS_3_09_위빳사나까타 (위빳사나의 논의)</h1>
<p>무상·괴로움·무아를 이어 볼 때 마음이 어느 쪽으로 기울고 무엇에서 놓여나는지를 짚는다. 무상을 이어 보면 표상에서, 괴로움을 이어 보면 바람에서, 무아를 이어 보면 달라붙음에서 벗어난다는 세 짝이 여기서 마무리된다. 이와 같이 나는 들었다. 한때 세존께서는 사왓티의 제따 숲, 아나타삔디까 승원에 머무셨다. 거기서 세존께서는 비구들을 부르셨다 — 「비구들이여」라고. 「존자시여」 하고 그 비구들은 세존께 대답했다. 세존께서는 이렇게 말씀하셨다 —</p>
