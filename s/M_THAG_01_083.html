<h1>M_THAG_01_083_시하 장로의 게송</h1>
<p>세존을 뵙자 마음이 맑아진 말라족 시하(Sīha)는 말라 왕족 집안에서 태어났다. 세존을 뵙고 마음이 맑아져 절하고 한쪽에 앉았는데, 세존께서 그 뜻을 살펴 법을 설하시자 믿음을 얻어 출가했다. 수행 주제를 받아 숲에 머물렀으나 마음이 온갖 대상으로 달아나 한곳에 모이지 않아 제 할 일을 이루지 못했다. 세존께서 그것을 보시고 허공에 서시어 이 게송으로 타이르셨고, 게송이 끝나자 위빳사나를 늘려 아라한이 되었다. 시하여, 방일하지 말고 머물러라…</p>
