<h1>M_JA_305_실라위망사나(훔치지 않은 제자)</h1>
<p>세존께서 제따와나에 머무실 때 오염을 눌러 다스림을 두고 하신 말씀이다. 제따와나에 머물던 오백 비구가 한밤중에 감각적 욕망의 생각을 일으키자, 세존께서 천안으로 보시고 그들을 모으신 뒤 「옛 현자들은 악을 짓는 데 은밀한 곳이란 없다 하여 악을 짓지 않았다」 하시고 옛일을 드셨다. 옛날 바라나시에서 보살은 바라문 집안에 나, 사방에 이름난 스승 밑에서 오백 학인의 우두머리로 배웠다. 스승은 다 자란 딸을 계를 갖춘 이에게 주려고 학인들을 시험…</p>
