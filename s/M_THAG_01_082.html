<h1>M_THAG_01_082_깟사빠 장로의 게송</h1>
<p>어머니를 두고 떠난 우디짜 바라문의 아들 깟사빠(Kassapa)는 사왓티 우디짜 바라문의 아들이다. 어려서 아버지를 여의고 어머니 손에 자랐다. 제따 숲에 갔다가 세존의 법문을 듣고 그 자리에서 예류자가 되었고, 어머니의 허락을 받아 출가했다. 안거를 마치신 세존께서 지방 유행을 떠나시자 자기도 따라가려고 인사하러 갔더니, 어머니가 보내 주며 이 게송을 읊었다. 장로는 이 말을 듣고 아주 슬픔 없는 자리에 이르리라 마음먹어 오래지 않아 아라한이…</p>
