<h1>M_SN_36_웨다나(느낌)</h1>
<p>비구들이여, 이러한 세 가지 느낌이 있다. 무엇이 셋인가? 즐거운 느낌, 괴로운 느낌, 괴롭지도 즐겁지도 않은 느낌 — 비구들이여, 이것이 세 가지 느낌이다. 삼매에 들고 알아차리며 사띠를 지닌 부처의 제자는, 느낌을 꿰뚫어 알고 느낌이 생겨나는 곳도 안다.</p>
