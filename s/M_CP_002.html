<h1>M_CP_002_상카(상카의 일산 보시)</h1>
<p>보살이 상카라는 바라문이었을 때, 바닷길을 앞두고 달구어진 땅을 맨발로 걸어가는 홀로 깨달은 분을 만나 제 일산과 신을 벗어 드린 일을 말한다. 또 내가 상카라 불리는 바라문이었을 때, 큰 바다를 건너려고 항구로 갔다. 거기 오는 길에서 나는 스스로 깨달은 이, 패배를 모르는 분을 보았다. 달구어진 굳은 땅 위로 험한 먼 길을 걸어가고 있었다. 오는 길에서 그분을 보고 나는 이렇게 생각했다. &quot;공덕을 바라는 사람에게 밭이 찾아왔구나.</p>
