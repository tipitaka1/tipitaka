<h1>M_AN_04_25_아빳띠바야(죄에 대한 두려움)</h1>
<p>한때 세존께서는 꼬삼비의 고시따 승원에 머무셨다. 그때 아난다 존자가 세존께 다가갔다. 다가가서 세존께 절을 올리고 한쪽에 앉았다. 한쪽에 앉은 아난다 존자에게 세존께서 이렇게 말씀하셨다 – 「아난다여, 그 다툼은 가라앉았는가?」 「세존이시여, 그 다툼이 어떻게 가라앉겠습니까! 세존이시여, 아누룻다 존자에게 바히야라는 함께 사는 제자가 있는데, 그가 오로지 승가를 깨뜨리려고 버티고 있습니다. 그런데도 아누룻다 존자는 거기에 한마디도 해야 한다고…</p>
