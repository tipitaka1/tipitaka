<h1>A_PV_037_세리사까</h1>
<p>「약카와 상인들의 이야기를 들으십시오」란 세리사까 아귀 이야기다. 이것은 세리사까 천궁 이야기와 다를 것이 없으므로, 거기 인연담과 게송에서 말할 것은 『빠라맛타디빠니』의 위마나왓투 뜻풀이(위마나왓투 주석 1227, 세리사까 천궁 이야기의 뜻풀이)에서 이미 말하였다. 그러므로 거기서 말한 방식대로 알아야 한다. 세리사까 아귀 이야기의 뜻풀이가 끝났다.</p>
