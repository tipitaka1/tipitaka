<h1>M_JA_095_마하수닷사나(보배 성의 전륜왕)</h1>
<p>세존께서 완전한 열반의 자리에 누우셨을 때 아난다 존자가 「이 작은 성에서 완전한 열반에 드시지 마십시오」 하고 여쭌 것을 두고 하신 말씀이다. 존자가 큰 성을 청하자 세존께서는 「나는 옛날 수닷사나 전륜왕으로 이 성에 살았고, 그때 이곳은 열두 요자나의 보배 담으로 둘린 큰 성이었다」 하시고 옛일을 들려주셨다. 마하수닷사나가 야자 숲 자리에 누워 다시 일어나지 않을 자세를 취하자, 수밧다 왕비가 팔만 사천 성을 들어 여기에 뜻을 두라고 했다.…</p>
