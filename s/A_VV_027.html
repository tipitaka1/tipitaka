<h1>A_VV_027_두띠야빅카다이까</h1>
<p>「눈부신 빛으로」는 둘째 빅카다이까 천궁이다. 그 인연은 무엇인가? 세존께서 라자가하에 머무셨다. 거기에 믿음이 있고 마음이 맑은 어떤 여인이 있었는데, 번뇌를 다한 어떤 장로가 탁발하며 다니시는 것을 보고 제 집으로 모셔 들여 음식을 올렸다. 그는 그 뒤 죽어 삼십삼천에 태어났다. 나머지는 바로 앞의 천궁과 같다. 눈부신 빛으로 …pe… 모든 방향을 비춥니까? 그 천신은 기뻐하며 …pe… 이것이 그 업의 과보다.」</p>
