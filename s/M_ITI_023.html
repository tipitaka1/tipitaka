<h1>M_ITI_023_우바얏타(두 가지 이익)</h1>
<p>세존께서 유익한 법들에 게으르지 않은 한 가지 법이 지금 여기의 이익과 다음 생의 이익을 함께 거머쥐게 한다고 말씀하신 편이다. 세존께서 이렇게 말씀하셨다. 아라한께서 이렇게 말씀하신 것을 나는 들었다 — 비구들이여, 한 가지 법을 닦고 많이 지으면 두 가지 이익을 함께 거머쥔다 — 곧 지금 여기의 이익과 다음 생의 이익이다. 어떤 한 가지 법인가? 유익한 법들에 게으르지 않음이다. 비구들이여, 이 한 가지 법을 닦고 많이 지으면 두 가지 이익…</p>
