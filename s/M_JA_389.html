<h1>M_JA_389_수완나깍까따(뱀을 잡은 황금 게)</h1>
<p>세존께서 웰루와나에 머무실 때, 아난다 장로가 세존을 위해 목숨을 버린 일을 두고 하신 말씀이다. 세존께서는 「전에도 아난다는 내 목숨을 위해 제 목숨을 버렸다」 하시고 옛일을 드셨다. 옛날 라자가하 동쪽 살린디야 마을에서 보살은 농사짓는 바라문으로 났다. 밭 끝 웅덩이의 황금빛 게를 늘 겉옷에 안아 옮겨 주어 서로 굳게 믿었다. 보살의 맑은 눈을 먹고 싶어 한 암까마귀가 남편을 시켜 검은 뱀을 섬기게 했고, 뱀이 길목에 숨었다가 보살의 종아리…</p>
