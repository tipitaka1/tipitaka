<h1>M_JA_260_두따(배가 보낸 심부름꾼)</h1>
<p>세존께서 제따와나에 머무실 때, 탐하던 한 비구를 두고 하신 말씀이다. 그 이야기는 나와까니빠따 「짝까와까」 자따까에 나온다. 옛날 바라나시 왕이 된 보살은 음식을 까다롭게 가려 「음식을 가리는 왕」이라 불렸다. 보는 사람들에게 공덕을 짓게 하려고 왕궁 문에 보배 천막을 짓고, 흰 일산을 세운 왕좌에 앉아 황금 그릇에 온갖 맛의 음식을 먹었다. 그것을 보고 먹고 싶어 견디지 못한 사람 하나가 손을 들고 「나는 사자다」 외치며 다가갔다. 그 나라…</p>
