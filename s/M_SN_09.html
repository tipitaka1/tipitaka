<h1>M_SN_09_와나(숲)</h1>
<p>이와 같이 나는 들었다. 한때 어떤 비구가 꼬살라의 어떤 숲에 머물렀다. 그때 그 비구는 낮 동안 머물며 집에 매인 나쁘고 해로운 생각들을 떠올리고 있었다. 그때 그 숲에 사는 신이 그 비구를 가엾이 여기고 이익을 바라며 그 비구를 일깨우고자 그 비구에게 다가갔다. 다가가서 그 비구에게 시로 말했다 – &quot;홀로 있기를 바라 숲에 들어왔으면서 그대의 마음은 밖으로 달려나가는구나. 사람이면서 사람들에 대한 바람을 다스려라.</p>
