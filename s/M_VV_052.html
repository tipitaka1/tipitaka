<h1>M_VV_052_레와띠 (레와띠의 천궁)</h1>
<p>인색하여 사문과 바라문을 헐뜯고 남편을 속인 레와띠가 야마의 사자에게 끌려가면서, 남편 난디야의 천궁을 보고 끝내 지옥에 떨어지는 편이다. 오래 떠나 있던 사람이 먼 곳에서 무사히 돌아오면 친척과 벗과 마음 맞는 이들이 돌아온 그를 반긴다.</p>
