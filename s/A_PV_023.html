<h1>A_PV_023_숫따</h1>
<p>「저는 전에 출가한 비구에게」라는 이것은 숫따 아귀 이야기다. 그 인연은 무엇인가? 사왓티에서 멀지 않은 어느 마을에, 우리 스승께서 아직 세상에 나시기 전 칠백 년도 더 앞서, 어떤 아이가 빳쩨까붓다 한 분을 섬겼다. 그 아이가 자라자 어머니는 그를 위해 걸맞은 집안에서 어느 처녀를 데려왔다. 그런데 혼인하는 바로 그날 그 젊은이는 벗들과 함께 목욕하러 갔다가 뱀에 물려 죽었다. 「약카에게 붙들렸다」고도 한다. 그는 빳쩨까붓다를 섬겨 착한 업…</p>
