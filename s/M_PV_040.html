<h1>M_PV_040_웃추(못 먹는 사탕수수)</h1>
<p>사탕수수 숲을 과보로 받고도 먹지 못하는 아귀가 한 존자에게 까닭을 묻고, 존자가 전생의 업과 먹는 길을 일러 주는 편이다. 이 큰 사탕수수 숲은 제 것입니다. 적지 않은 공덕의 열매로 생겨났습니다. 그런데 이제 그것이 제 먹을거리가 되지 않습니다. 존자시여, 이것이 무슨 과보인지 일러 주십시오. 저는 맞고 뜯기면서도 애를 씁니다. 무엇이든 먹어 보려고 몸부림칩니다. 그러다 힘이 끊겨 가엾이 울부짖습니다. 이것이 무슨 업의 과보입니까.</p>
