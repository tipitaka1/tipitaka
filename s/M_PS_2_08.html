<h1>M_PS_2_08_로꿋따라까타 (세상을 넘어섬의 논의)</h1>
<p>무엇이 「세상을 넘어선 법」인지를 가리는 아주 짧은 편이다. 네 가지 사띠의 확립부터 열반까지를 세상을 넘어선 것으로 세우고, 그 밖의 것과 가른다. 어떤 법들이 세상을 넘어선 것들인가? 네 가지 사띠의 확립, 네 가지 바른 애씀, 네 가지 신통의 발판, 다섯 가지 기능, 다섯 가지 힘, 일곱 가지 깨달음의 요소, 여덟 갈래 성스러운 길, 네 가지 성스러운 도, 네 가지 사문됨의 결실이고, 그리고 열반이다 — 이 법들이 세상을 넘어선 것들이다.</p>
