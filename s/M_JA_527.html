<h1>M_JA_527_움마단띠(넋을 앗은 여인을 참다)</h1>
<p>세존께서 제따와나에 머무실 때, 꾸민 여인에게 마음이 묶인 비구를 두고 하신 말씀이다. 옛날 시위 나라 아릿타뿌라에서 보살은 왕자로 나 왕이 되었고, 장군의 아들 아비빠라까가 벗이었다. 부호의 딸 움마단띠는 보는 이마다 넋을 잃게 했으나 「불길한 여자」라 하여 왕이 들이지 않아 아비빠라까의 아내가 되었다. 깟띠까 축제 밤 성을 도는 왕에게 창가에서 꽃을 던지자 왕은 넋을 잃고 앓아누웠다. 아비빠라까는 귀신의 말인 양 사정을 드러내고 아내를 바쳤…</p>
