<h1>M_MIL_001_뿝바요가디 (전생 인연 등)</h1>
<p>그 세존, 아라한, 정등각자께 귀의합니다. 밀린다라는 그 왕이 으뜸 도성 사갈라에서 나가세나께 다가갔다, 강가강이 바다로 가듯이. 왕은 이야기가 아름다운 분, 횃불을 든 분, 어둠을 몰아내는 분께 다가가 옳고 그름에 걸친 미묘한 물음을 이것저것 여쭈었다. 물음도 대답도 깊은 뜻에 기대어 있어 가슴에 사무치고 귀에 즐거우며, 놀랍고 소름이 돋는다. 아비담마와 위나야에 깊이 잠기고 경의 그물로 짜였으니 나가세나의 이야기는 비유와 방편으로 아름답다.</p>
