<h1>M_JA_505_소마낫사(가짜 행자를 밝힌 왕자)</h1>
<p>세존께서 제따와나에 머무실 때 데와닷따가 당신을 죽이려 애쓴 일을 두고 하신 말씀이다. 「지금만이 아니다」 하시고 옛일을 들려주셨다. 옛날 웃따라빤짤라의 레누 왕에게 아들이 없었는데, 한 엉터리 결발행자가 마하락키따 선인의 말을 가로채 「천안을 지닌 이」로 불리며 왕궁에 눌러앉았다. 보살은 따와띵사에서 죽어 왕자 소마낫사로 태어났다. 일곱 살에 동산에 가 보니 그 행자가 사문의 일은 하지 않고 채소를 길러 팔고 있어 「채소 장자여」 하고 부끄럽…</p>
