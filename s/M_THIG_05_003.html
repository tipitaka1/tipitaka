<h1>M_THIG_05_003_시하 장로니의 게송</h1>
<p>일곱 해를 헤매다 목매려던 순간 깨친 이 웨살리 시하(Sīha) 장군의 조카딸로, 외삼촌의 이름을 따 시하라 불렸다. 세존께서 시하 장군에게 설하시는 법을 듣고 믿음을 내어 부모의 허락을 받고 출가했다. 그러나 일곱 해 동안 밖으로 내달리는 마음을 다잡지 못하고 삿된 생각에 시달리다가, 「이런 못난 목숨이 무슨 소용인가」 하며 목을 매려고 나뭇가지에 올가미를 걸었다. 목에 올가미를 거는 그 자리에서 위빳사나가 익어 아라한이 되었고 올가미는 저절…</p>
