<h1>M_MN_001_물라빠리야야경 (근본법문경)</h1>
<p>&gt; 견본입니다. §1~§3만 채웠습니다. 이와 같이 나는 들었다. 한때 세존께서는 웃깟타의 수바가 숲, 살라 나무 왕의 아래에 머무셨다. 거기서 세존께서는 비구들을 부르셨다. &quot;비구들이여.&quot; &quot;스승이시여.&quot; 하고 비구들은 세존께 대답했다. 세존께서는 이렇게 말씀하셨다.</p>
