<h1>M_THAG_02_043_Brahmāli 장로의 게송</h1>
<p>윤회가 두려워 숲으로 든 이 꼬살라국 바라문 집안에 태어나 브라흐말리(Brahmāli)라 불렸다. 윤회에 절박함이 일어 좋은 벗에 의지해 출가했고, 알맞은 수행 주제를 받아 숲에 머물며 위빳사나를 닦아 오래지 않아 육신통을 갖추었다. 어느 날 정진을 살피던 장로가 그 숲에 머무는 비구들에게 던진 물음을 받아 이 게송을 읊었다. 마부에게 잘 길들여진 말처럼, 누구의 기능들이 고요에 들었는가. 자만을 버려 번뇌 없는 이, 그 한결같은 이를 신들까지…</p>
