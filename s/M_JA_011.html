<h1>M_JA_011_락카나미가(무리를 지킨 락카나)</h1>
<p>세존께서 라자가하 웰루와나에 머무실 때, 데와닷따를 두고 하신 말씀이다. 데와닷따가 승가를 갈라 오백 비구를 데려가자, 세존께서 보내신 사리뿟따와 목갈라나가 법을 설해 그들을 데려왔다. 비구들이 사리뿟따를 기리자 세존께서 「사리뿟따가 빛나는 것도 데와닷따가 무리를 잃는 것도 지금만이 아니다」 하셨다. 옛날 마가다에서 보살은 사슴으로 나 천 마리를 거느렸고, 락카나와 깔라 두 아들에게 오백씩 맡겼다. 곡식이 익어 사슴이 위태로운 철이 되자 두 아…</p>
