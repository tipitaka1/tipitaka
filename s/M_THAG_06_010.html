<h1>M_THAG_06_010_수마나 장로의 게송</h1>
<p>아누룻다(Anuruddha) 장로를 모시던 청신사의 아들이다. 아이를 잇달아 잃은 아버지가 「아들을 얻으면 장로께 출가시키리라」 서원해 얻은 아이로, 일곱 살에 출가해 오래지 않아 육신통을 갖추었다. 은사의 물을 길으러 신통으로 아노땃따 호수에 갔다가 물을 막아선 용왕…</p>
