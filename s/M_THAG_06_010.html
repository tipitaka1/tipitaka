<h1>M_THAG_06_010_수마나 장로의 게송</h1>
<p>아누룻다를 모신 일곱 살의 사미 아누룻다(Anuruddha) 장로를 모시던 청신사의 아들이다. 아이를 잇달아 잃은 아버지가 「아들을 얻으면 장로께 출가시키리라」 서원해 얻은 아이로, 일곱 살에 출가해 오래지 않아 육신통을 갖추었다. 은사의 물을 길으러 신통으로 아노땃따 호수에 갔다가 물을 막아선 용왕을 눌러 이기고 돌아오자, 세존께서 사리뿟따에게 그 덕을 이르셨다. 그 일을 그대로 읊었다. 갓 출가하여 나이 일곱 살이던 때 큰 신통을 지닌 뱀들…</p>
