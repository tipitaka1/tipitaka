<h1>M_THAG_20_001_마하목갈라나 장로의 게송</h1>
<p>신통에 으뜸 바라문 집안의 꼴리따(Kolita)다. 출가한 지 이레째 되던 날 마가다의 깔라왈라 마을에서 닦다가 혼침과 졸음에 눌리자, 세존께서 「성스러운 침묵을 게을리 말라」 하고 일깨우셨다. 이를 떨치고 요소 명상주제를 들으며 위빳사나를 키워 제자가 다다를 지혜의 끝에 닿아, 세존의 둘째 제자가 되었다. 아래 게송은 여러 자리에서 읊은 것이고, 끝은 베사깔라 숲에서 마라를 꾸짖는 대목이다. 숲에 살고 탁발로 살며 빌어서 발우에 든 것을 기뻐…</p>
