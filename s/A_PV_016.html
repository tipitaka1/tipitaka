<h1>A_PV_016_난다뻬띠</h1>
<p>「그대는 검고 흉한 모습에」 — 이것은 스승께서 제따 숲에 머무실 때 난다라는 아귀 여인을 두고 말씀하신 것이다. 사왓티에서 멀지 않은 어떤 작은 마을에 난디세나라는 청신사가 있었는데 믿음이 있고 마음이 맑았다고 한다. 그런데 그의 아내는 난다라는 이름으로, 믿음이 없고 마음이 맑지 않고 인색하고 사납고 말이 거칠었으며, 남편을 공경하지 않고 대놓고 시어머니를 도둑이라 하며 꾸짖고 헐뜯었다. 그녀는 뒷날 죽어 아귀의 태에 태어나 바로 그 마을에…</p>
