<h1>M_JA_516_마하까삐(은혜를 돌로 갚다)</h1>
<p>세존께서 웰루와나에 머무실 때, 데와닷따가 바위를 굴려 던진 일을 두고 하신 말씀이다. 그가 먼저 활잡이를 시키고 나중에는 스스로 바위를 굴린 일을 비구들이 나무라자, 세존께서 「지금만이 아니다. 전에도 데와닷따는 내게 바위를 던졌다」 하시고 옛일을 드셨다. 옛날 바라나시에서 브라흐마닷따가 다스릴 때, 까시의 한 마을에 밭을 가는 바라문이 있었다. 소를 놓아두고 괭이질을 하다 소를 잃고, 찾아 헤매다 숲으로 들어가 히말라야에 이르러 길을 잃었다…</p>
