<h1>M_THAG_01_097_띳사 장로의 게송</h1>
<p>빔비사라가 보낸 그림에 깨친 로루와 왕 띳사(Tissa)는 로루와의 왕자로, 아버지가 죽자 왕위에 올랐다. 얼굴 한 번 본 적 없는 벗 빔비사라 왕이 부처님의 일생을 그린 천과 연기를 새긴 금판을 보내왔다. 그것을 들여다보다 윤회와 그 그침을 헤아리고 「부처님 모습을 보았고 가르침의 길도 얼마쯤 알았다. 이제 집에 살아 무엇하랴」 하며 왕위를 버렸다. 흙 발우 하나 들고 나라를 떠나 라자가하에서 세존께 법을 듣고 아라한이 되어, 이 게송을 읊었…</p>
