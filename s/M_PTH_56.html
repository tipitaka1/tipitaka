<h1>M_PTH_56_선 삼법 · 위가 있는 것 이법</h1>
<p>〔성립하는 조건의 수 — 실측 151건〕 「위 없는」(anuttara)은 훌륭하다는 칭찬이 아니라 「더 넘어설 것이 없는」이라는 자리매김이다. 도와 과와 열반이 여기 들고, 나머지 세간법은 모두 「위가 있는」 쪽이다.</p>
