<h1>M_THAP_049_사야나다야까 장로의 아빠다나</h1>
<p>천을 깔아 마련한 가장 좋은 침상을 바침 싯닷타 세존께 천을 깔아 마련한 가장 좋은 침상을 바친 이야기입니다. 싯닷타 세존, 자애의 마음을 지니신 한결같으신 분께 천을 깔아 마련한 가장 좋은 침상을 내가 드렸다. 세존께서 알맞은 그 침상과 자리를 받으셨다. 그 침상에서 일어나 승리자께서 허공으로 오르셨다. 구십사 겁 전에 침상을 바친 그 일로, 나는 나쁜 곳을 알지 못한다. 이것이 침상의 과보다. 쉰한 겁 전에 나는 신의 이름을 지닌 와라까였다…</p>
