<h1>M_JA_523_알람부사(선인의 아들을 꾄 천녀)</h1>
<p>세존께서 제따와나에 머무실 때 옛 아내 때문에 마음이 흔들린 비구를 두고 하신 말씀이다. 세존께서 「그 여인 때문에 그대는 선정을 잃고 삼 년을 넋 놓고 누워 있었다」 하시고 옛일을 드셨다. 옛날 보살은 까시의 바라문 집에 나 선인으로 출가했다. 암사슴이 그의 소변이 섞인 풀을 먹고 사람 아이를 낳으니, 보살이 길러 이시싱가라 이름하고 출가시켰으며, 늙어서는 「여인은 제 뜻대로 되면 큰 파멸에 이르게 한다」 일러 두고 범천 세계로 갔다. 이시싱…</p>
