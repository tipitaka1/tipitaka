<h1>M_PTH_07_집착된 것 삼법</h1>
<p>〔팔리 원문〕 「집착된 것」(upādinna)은 「지금 집착하고 있는 마음」이 아니라 「갈애와 사견에 거머쥐인 업이 결과로 낳은 것」이다. 능동으로 읽으면 뜻이 뒤집힌다.</p>
