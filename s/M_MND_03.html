<h1>M_MND_03_둣탓타까닛데사 (성난 마음의 여덟 해설)</h1>
<p>남을 헐뜯고 제 견해를 내세우는 이를 다룬다. 「말로 짓는 다툼」이 어떻게 시작되어 어디까지 가는지를, 싸움·말싸움·맞붙음·논쟁·시비의 다섯 낱말로 갈라 보인다. 이제 둣탓타까 경의 닛데사를 말하리라 — 악한 마음으로 말하는 이들이 있고, 참된 마음으로 말하는 이들도 있다. 성자는 일어난 말다툼에 끼어들지 않는다. 그러므로 성자에게는 어디에도 거친 데가 없다. 「악한 마음으로 말하는 이들이 있고」란 그 외도들이 악한 마음으로, 맞서는 마음으로,…</p>
