<h1>M_JA_462_상와라(사람을 얻어 왕이 되다)</h1>
<p>세존께서 제따와나에 머무실 때, 정진을 놓아 버린 비구를 두고 하신 말씀이다. 옛날 바라나시 왕에게 아들 백이 있었고, 막내 상와라의 스승은 지혜로운 신하인 보살이었다. 보살이 일러 준 대로 상와라는 고을을 받지 않고 아버지의 발치에 머물렀으며, 묵은 동산을 얻어 그 꽃과 열매로 성안의 힘 있는 이들을 거두고, 병사들의 밥과 삯을 끊이지 않게 주고, 장사꾼과 손님을 두루 보살펴 모두의 사랑을 받았다. 왕이 죽자 신하들이 그에게 흰 일산을 세웠다…</p>
