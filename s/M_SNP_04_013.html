<h1>M_SNP_04_013_마하뷰하(큰 진리 다툼)</h1>
<p>견해에 눌러앉아 「이것만이 진리다」 하고 다투는 이들을 두고, 그 다툼이 무엇을 낳고 어디서 그치는지를 밝히는 편이다. 법을 가려 살펴 붙든 것이 없기에 다툴 자리마저 넘어선 이를 성자라 이른다. 견해에 눌러앉은 이들은 누구든 「이것만이 진리다」 하며 다툰다. 그들은 모두 비난을 불러들이고, 또 거기서 칭찬도 얻는다. 그것은 적어서 고요에 이르기에 넉넉하지 않다. 다툼의 열매는 둘이라고 나는 말한다. 이것을 보고서 다투지 마라. 다툼 없는 자리…</p>
