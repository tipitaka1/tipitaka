<h1>A_PV_041_꾸마라</h1>
<p>「사왓티라는 이름의 성이 있다」란 스승께서 제따 숲에 머무실 때 두 아귀를 두고 말씀하신 것이다. 사왓티에 꼬살라 왕의 두 아들이 있었는데, 보기에 좋고 한창때에 있어 젊음에 취한 나머지 남의 아내와 잘못을 저지르고, 죽어 해자 둑에 아귀로 태어났다고 한다. 그들은 밤이면 무서운 소리로 울부짖었다. 사람들이 그 소리를 듣고 두려워 떨며 「이렇게 하면 이 불길함이 가라앉는다」 하고 부처님을 으뜸으로 한 비구 승가에 큰 보시를 베푼 뒤 그 일을 세…</p>
