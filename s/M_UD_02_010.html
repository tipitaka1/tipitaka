<h1>M_UD_02_010_밧디야(밧디야의 즐거움)</h1>
<p>깔리고다의 아들 밧디야 존자가 숲에서도 나무 아래에서도 빈집에서도 거듭 「아, 즐겁구나!」 하고 읊자, 비구들은 그가 왕위의 즐거움을 그리워하는 것이라 여겨 세존께 아뢴다. 세존께서 까닭을 물으시자 밧디야는 왕이었을 때는 겹겹이 지켜지면서도 두려웠으나 지금은 홀로 아무 두려움 없이 지낸다고 답한다. 이와 같이 나는 들었다. 한때 세존께서 아누삐야의 망고 숲에 머무셨다. 마침 그때 깔리고다의 아들 밧디야 존자는 숲에 가서도 나무 아래에 가서도 빈…</p>
