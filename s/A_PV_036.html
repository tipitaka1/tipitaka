<h1>A_PV_036_암바삭까라</h1>
<p>「웨살리라는 왓지 사람들의 성이 있고」란 암바삭까라 아귀 이야기다. 그 인연은 무엇인가? 세존께서 제따 숲에 머무실 때, 암바삭까라라는 릿차위 왕이 그릇된 견해를 지니고 아무것도 없다고 말하며 웨살리에서 나라를 다스렸다. 그때 웨살리 성의 어떤 장사꾼의 가게 가까이에 진창이 있었는데, 많은 사람이 그리로 뛰어 건너다가 애를 먹고 더러는 진흙을 뒤집어썼다. 그것을 보고 그 장사꾼은 「이 사람들이 진창을 밟지 않게 하자」 하며 고약한 냄새가 가시고…</p>
