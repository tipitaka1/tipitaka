<h1>M_SNP_01_006_빠라바와(파멸의 문)</h1>
<p>제따 숲에 온 천신이 무엇이 사람을 파멸로 이끄는지 열두 번 거듭 여쭙고, 세존께서 그때마다 한 게송으로 답하시는 편이다. 참되지 못한 이를 가까이하는 것에서 시작해 늙은 부모를 저버림, 혼자만 먹음, 태생을 뽐냄, 노름과 술, 분수에 넘치는 욕심까지 하나씩 짚는다. 이와 같이 나는 들었다. 한때 세존께서는 사왓티의 제따 숲, 아나타삔디까 승원에 머무셨다. 그때 어떤 천신이 밤이 깊어 갈 무렵 빼어난 빛으로 제따 숲을 온통 밝히며 세존께 다가갔…</p>
