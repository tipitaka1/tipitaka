<h1>M_THIG_02_010_사마 장로니의 게송</h1>
<p>사마와띠를 잃은 슬픔을 넘어선 이 꼬삼비의 큰 장자 집에 태어나 이름은 사마다. 청신녀 사마와띠(Sāmāvatī)의 가까운 벗이었는데 그가 죽자 절박함이 일어 출가했다. 벗을 두고 일어난 슬픔을 떨치지 못해 성스러운 길에 오르지 못하다가, 아난다(Ānanda) 장로의 훈계를 듣고 위빳사나를 시작하여 이레 만에 막힘없는 앎과 함께 아라한과를 얻고서 이 게송을 읊었다. 네 번 다섯 번 나는 처소에서 나왔다. 마음의 고요를 얻지 못하고 제 마음을 뜻…</p>
