<h1>M_DHP_03_찟따왁가 (마음품)</h1>
<p>흔들리고 지키기 어려우며 멀리 가고 홀로 다니는 마음을 다루는 품입니다. 화살 만드는 이가 화살대를 곧게 하듯 마음을 곧게 하라고 하고, 바르게 향한 마음은 부모도 해 주지 못할 일을 해낸다고 합니다. 흔들리고 변덕스러운 마음, 지키기 어렵고 막기 어려운 마음을 슬기로운 이는 곧게 만든다, 화살 만드는 이가 화살대를 곧게 하듯. 물에 사는 것이 뭍에 던져져 제 사는 곳에서 끌려 나온 듯, 이 마음은 파닥거린다, 마라의 영역을 벗어나려고.</p>
