<h1>M_THAP_214_빠나디다야까 장로의 아빠다나</h1>
<p>숲에 머무시는 부처님께 신발 바친 이 숲에 머무시며 오랜 세월 절제하신 부처님께 신발을 바친 이야기입니다. 숲에 머무시는 선인, 오랜 세월 절제하며 지내신 분, 자신을 닦으신 부처님께 나는 신발을 바쳤다. 그 업으로 — 두 발 가진 이의 왕이시여, 세상의 어른, 사람 가운데 황소이시여 — 나는 하늘의 수레를 누린다. 이것이 지난 업의 과보다. 이로부터 구십사 겁 전에 그때 그 업을 지은 일로, 나는 나쁜 곳을 알지 못한다. 이것이 신발의 과보다…</p>
