<h1>M_THIG_06_008_위자야 장로니의 게송</h1>
<p>케마를 따라 출가한 옛 벗 라자가하의 어떤 집안에서 태어났고, 케마(Khemā) 장로니의 재가 시절 벗이었다. 케마가 출가했다는 말을 듣고 「왕비조차 출가하는데 나야 말할 것이 있으랴」 하며 찾아가 법을 듣고, 절박함이 일어 그 자리에서 출가를 청했다. 케마 장로니께 출가하여 위빳사나를 닦아 오래지 않아 막힘없는 앎과 함께 아라한과를 얻었고, 걸어온 길을 돌아보며 이 게송을 읊었다. 네 번 다섯 번 나는 정사에서 나왔다. 마음의 고요를 얻지 못…</p>
