<h1>M_THAG_01_079_락키따 장로의 게송</h1>
<p>오백 왕자와 함께 출가한 사꺄 락키따(Rakkhita)는 데와다하 마을의 사꺄 왕족 집안에서 태어났다. 사꺄족과 꼴리야족이 세존을 모시라고 보낸 오백 왕자와 함께 출가했으나, 절박함에서 나온 출가가 아니어서 다들 답답해했다. 세존께서 이들을 꾸날라 호숫가로 데려가 꾸날라 본생담을 설하시어 감각적 욕망의 허물을 밝히시고 수행 주제를 주시자, 이 분도 그것을 붙들고 위빳사나를 늘려 아라한이 되었다. 버려진 오염을 돌이켜 보며 이 게송을 읊었다.</p>
