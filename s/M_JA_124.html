<h1>M_JA_124_암바(가뭄에 물 준 구유)</h1>
<p>세존께서 제따와나에서 소임을 잘 지키는 한 비구를 두고 하신 말씀이다. 그는 사왓티의 좋은 집안 아들로 출가해 스승과 은사를 섬기고 물과 포살당의 소임을 다했다. 사람들이 기뻐해 상시 공양을 올렸고 많은 이가 그에 기대어 편히 지냈다. 이를 들으신 세존께서는 「지금만이 아니다」 하시고 옛일을 드셨다. 옛날 보살은 선인으로 출가해 오백 선인과 살았다. 히말라야에 가뭄이 들어 짐승들이 물을 얻지 못하자 한 고행자가 구유를 만들어 물을 채워 주었다.…</p>
