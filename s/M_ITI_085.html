<h1>M_ITI_085_아수바누빳시(부정을 살펴봄)</h1>
<p>몸에서 아름답지 않음을 살펴보고, 들숨날숨에 사띠를 세우고, 모든 형성에서 무상함을 살펴보라고 세존께서 이르신 편이다. 그 셋이 각각 탐욕의 잠재성향과 바깥으로 흐르는 생각과 무명을 없앤다. 세존께서 이렇게 말씀하셨다. 아라한께서 이렇게 말씀하신 것을 나는 들었다 — 비구들이여, 몸에서 아름답지 않음을 살펴보며 머물러라. 들숨날숨에 대한 사띠를 안으로 앞에 잘 세워 두어라. 모든 형성에서 무상함을 살펴보며 머물러라.</p>
