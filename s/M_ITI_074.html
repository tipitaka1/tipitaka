<h1>M_ITI_074_뿟따(세 가지 아들)</h1>
<p>세상에 있는 아들이 셋이라고 세존께서 말씀하신 편이다. 부모보다 나은 아들, 부모를 따르는 아들, 부모만 못한 아들을 귀의와 계를 잣대로 갈라 보이신다. 세존께서 이렇게 말씀하셨다. 아라한께서 이렇게 말씀하신 것을 나는 들었다 — 비구들이여, 세상에 있고 세상에서 만나게 되는 아들이 셋이다. 어떤 셋인가? 뛰어난 아들, 따르는 아들, 못난 아들이다. 비구들이여, 어떻게 아들이 뛰어난 아들이 되는가? 비구들이여, 여기 아들의 부모는 부처님께 귀의…</p>
