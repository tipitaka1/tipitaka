<h1>M_THAG_10_007_(Apara)-gotama 장로의 게송</h1>
<p>당해 낼 이가 없던 논객 세존께서 나오시기 전 사왓티(Sāvatthī)의 북방 바라문 집안에 태어났다. 세 베다에 통달하고 논쟁술을 익혀 자기를 꺾을 이가 없자 여기저기 다니며 논쟁을 일삼았다. 세존께서 제따와나(Jetavana)를 받으실 때 믿음을 얻어 출가했고, 머리를 깎는 자리에서 아라한이 되었다. 꼬살라(Kosala)에 오래 머물다 사왓티로 돌아오자 바라문 친족들이 「어느 가르침이 벗어남으로 이끕니까」 하고 묻기에 이 게송을 읊었다.</p>
