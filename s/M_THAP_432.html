<h1>M_THAP_432_손나꼰따리까 장로의 아빠다나</h1>
<p>조롱박 물로 부처님 발을 씻어 드린 이 나루터에서 선정에 드신 빠두뭇따라 부처님께 조롱박에 담은 물을 올려 그 발을 씻어 드린 이야기입니다. 부처님의 분부와 그에 응답하는 말과 축원이 §4–§6에 직접화법으로 이어집니다. 마음을 성숙시키시는 부처님, 스스로를 길들이고 삼매에 드신 분, 거룩한 길을 거니시며 마음의 고요함을 기뻐하시는 분, 거센 물을 건너신 정등각자, 선정에 드시고 선정을 기뻐하시는 성자, 나루터에 앉아 선정에 드신, 푸른 연꽃잎…</p>
