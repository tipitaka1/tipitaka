<h1>A_VV_046_삐따</h1>
<p>「노란 옷에 노란 깃발」이라 한 것은 삐따 천궁이다. 그 인연은 무엇인가? 세존께서 완전한 열반에 드신 뒤, 아자따삿뚜 왕이 제 몫으로 받은 세존의 사리를 모셔다 탑을 세우고 큰 공양을 올렸을 때, 라자가하에 사는 어느 청신녀가 이른 아침에 몸을 씻고 매만진 뒤 「스승의 탑에 공양을 올리리라」 하고 마침 얻은 꼬사따끼 꽃 네 송이를 들고, 믿음의 힘에 마음이 북받쳐 길의 위태로움도 살피지 않은 채 탑을 향해 갔다. 그때 갓 낳은 송아지를 둔 암…</p>
