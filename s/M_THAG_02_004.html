<h1>M_THAG_02_004_강가띠리야 장로의 게송</h1>
<p>사왓티 어느 장자의 아들 닷따(Datta). 재가에 살며 가서는 안 될 곳인 줄 모르고 잘못을 저질렀다가 뒤에 알고 절박함이 일어 출가했다. 그 일을 부끄러이 여겨 거친 행을 지켜, 분소의를 입고 시체에 물 붓는 그릇 같은 흙 발우를 들고, 강가(Gaṅgā) 강가에 야…</p>
