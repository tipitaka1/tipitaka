<h1>M_DN_013_떼윗자(삼명경)</h1>
<p>이와 같이 나는 들었다. 한때 세존께서 오백 명쯤 되는 큰 비구 승가와 함께 꼬살라를 유행하시다가 꼬살라의 바라문 마을인 마나사까따(Manasākaṭa)에 이르셨다. 거기서 세존께서는 마나사까따의 북쪽, 아찌라와띠(Aciravatī) 강가의 망고 숲에 머무셨다.</p>
