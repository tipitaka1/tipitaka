<h1>M_JA_076_아상끼야(밤새 거닌 청신사)</h1>
<p>세존께서 제따와나에 머무실 때 사왓티의 한 청신사를 두고 하신 말씀이다. 예류자인 그가 수레 대상과 함께 길을 가다 숲에 진을 친 곳 가까운 나무 아래를 거닐었다. 도둑 오백이 에워쌌으나 「저 사람이 잠들거든 털자」 하며 기다렸고, 그가 밤 내내 거닐기만 하므로 새벽이 되자 틈을 얻지 못하고 집어 들었던 돌과 몽둥이를 버리고 달아났다. 돌아온 그가 「자기를 지키는 이가 남도 지키는 것입니까」 하고 여쭈니 세존께서 「그렇다」 하시고 옛일을 들려주…</p>
