<h1>M_KP_009_멧따경 (자애경)</h1>
<p>이로움에 밝은 이가 저 고요한 자리를 알고자 한다면 이렇게 해야 한다. 유능하고 곧으며 아주 곧고, 말하기 쉽고 부드러우며 잘난 체하지 않아야 한다. 만족할 줄 알고 공양하기 쉬우며, 일이 적고 가볍게 살며, 감관이 고요하고 슬기로우며, 뻔뻔하지 않고 신도 집에 탐착하지 않는다. 아는 이들이 나무랄 만한 사소한 일도 하지 않는다. &quot;모두 행복하고 안온하기를. 모든 중생이 마음 행복하기를.&quot; 살아 있는 것은 무엇이든 — 떠는 것이든 굳건한 것이든…</p>
