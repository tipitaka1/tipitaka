<h1>M_THAG_03_004_다니야 장로의 게송</h1>
<p>라자가하 옹기장이 집안에 태어나 다니야(Dhaniya)라 불렸고 옹기 굽는 일로 살았다. 세존께서 그의 옹기막에서 뿍꾸사띠(Pukkusāti)에게 육계분별경을 설하셨고, 뿍꾸사띠가 하룻밤에 할 일을 마쳤다는 말을 듣고 「하룻밤 익힘으로도 윤회의 괴로움에서 벗어나는구나」…</p>
