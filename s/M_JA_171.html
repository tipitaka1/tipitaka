<h1>M_JA_171_깔랴나담마(잘못 들은 귀먹은 장모)</h1>
<p>세존께서 제따와나에 머무실 때, 귀먹은 한 장모를 두고 하신 말씀이다. 사왓티의 한 살림꾼이 믿음이 깊어 삼귀의와 오계를 갖추었는데, 어느 날 약과 꽃과 옷을 지니고 제따와나로 법을 들으러 갔다. 그 사이 장모가 딸을 보러 와 사위와 사이가 좋으냐 물으니 딸이 그런 분은 출가자 중에도 얻기 어렵다 했다. 귀가 어두운 장모는 출가라는 말만 잡아 어찌하여 네 남편이 출가했느냐 크게 소리쳤고, 온 집안이 울부짖어 지나가는 사람들까지 그 말을 옮겼다.…</p>
