<h1>M_THIG_05_007_사꿀라 장로니의 게송</h1>
<p>하늘눈을 지닌 비구니 가운데 으뜸 사왓티(Sāvatthī) 바라문 집안에 태어나 사꿀라(Sakulā)라 불렸다. 세존께서 제따와나를 받으실 때 믿음을 내어 청신녀가 되었고, 뒷날 번뇌 다한 한 장로에게 법을 듣고 두려움이 일어 출가하여 오래지 않아 아라한이 되었다. 전생에 빠두뭇따라(Padumuttara) 부처님 곁에서 하늘 눈을 지닌 비구니 가운데 으뜸인 분을 뵙고 그 자리를 서원했고, 깟사빠 부처님 탑에 밤새 등불을 밝혀 올린 일이 있다. …</p>
