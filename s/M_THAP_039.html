<h1>M_THAP_039_라수나다야까 장로의 아빠다나 — 마늘을 바친 이</h1>
<p>히말라야 기슭의 고행자가 제 양식인 마늘을 승가에 바친 이야기입니다. 그때 나는 히말라야에서 멀지 않은 곳의 고행자였다. 마늘로 살아갔고 마늘이 내 음식이었다. 바구니를 가득 채워 나는 승원으로 갔다. 기쁘고 기쁜 마음으로 승가에 마늘을 바쳤다.</p>
