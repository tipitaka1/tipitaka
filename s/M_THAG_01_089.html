<h1>M_THAG_01_089_(Paṭhama)-devasabha 장로의 게송</h1>
<p>데와사바(Devasabha)는 어느 지방 왕의 아들로 태어나 젊은 나이에 왕위에 올라 왕의 즐거움을 누렸다. 나이 들어 세존께 나아가니 세존께서 법을 설하셨고, 그 법을 듣고 믿음을 얻어 절박함이 일자 왕위를 버리고 출가했다. 위빳사나를 지어 오래지 않아 아라한이 되었…</p>
