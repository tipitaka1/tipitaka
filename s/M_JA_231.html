<h1>M_JA_231_우빠하나(스승을 문 제자)</h1>
<p>세존께서 제따와나에 머무실 때, 데와닷따를 두고 하신 말씀이다. 비구들이 법당에서 데와닷따가 스승을 저버리고 여래께 맞서는 자, 원수가 되어 크게 무너졌다고 이야기했다. 세존께서는 그가 스승을 저버리고 내게 맞서다 크게 무너진 것이 이번만이 아니라 하시고 옛일을 들려주셨다. 옛날 보살은 바라나시에서 코끼리 부리는 스승의 집에 나 그 기예를 다 이루었다. 까시의 젊은이 하나가 와 배웠는데, 보살들은 기예를 가르칠 때 주먹에 감추어 두는 것이 없으…</p>
