<h1>M_THAG_01_069_찬나 장로의 게송</h1>
<p>보살과 한날 태어난 마부 숫도다나 대왕의 집에서 하녀의 아들로, 보살과 같은 날에 태어났다. 세존께서 친척들을 만나실 때 믿음을 얻어 출가했으나 「우리 부처님, 우리 법」 하며 애착을 내어 사문의 일을 하지 않았다. 세존께서 반열반하시며 분부하신 대로 내려진 브라흐마단다(누구도 말을 걸지 않는 벌)를 받고서야 절박함을 느껴 애착을 끊고 아라한이 되었다. 벅찬 기쁨으로 이 게송을 읊었다. 크신 분의 큰 맛을 지닌 법, 일체지의 빼어난 앎으로 설하…</p>
