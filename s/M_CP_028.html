<h1>M_CP_028_삿짜따빠사(진실의 고행자)</h1>
<p>「진실」이라는 이름의 고행자였을 때를 한 게송으로 말한다. 또 한때 나는 「진실」이라 불리는 고행자였다. 진실로 세상을 지켰고 사람들을 화합하게 했다. 〔§71〕 고행자의 이름 「삿짜(sacca)」가 그대로 「진실」이다. 이름과 행실이 다르지 않다는 것이 이 한 게송의 전부다.</p>
