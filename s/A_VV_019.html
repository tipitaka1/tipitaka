<h1>A_VV_019_라쿠마</h1>
<p>「눈부신 빛으로」란 라쿠마 천궁이다. 그 인연은 무엇인가? 세존께서 바라나시에 머무실 때, 바라나시 성에 께왓따 문이라는 문이 하나 있었는데 거기서 멀지 않은 곳에 자리 잡은 마을도 「께왓따 문」이라 불렸다. 거기에 라쿠마라는 여인이 있어 믿음이 있고 마음이 맑고 슬기를 갖추었는데, 그 문으로 들어오는 비구들을 보고 절하고 자기 집으로 모셔 국자 하나 분량의 탁발 음식을 올렸다. 그렇게 낯이 익어 믿음이 자라자 자리를 마련한 방을 지어 거기 든…</p>
