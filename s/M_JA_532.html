<h1>M_JA_532_소나난다(부모를 봉양한 두 형제)</h1>
<p>세존께서 제따와나에 머무실 때 어머니를 봉양하는 비구를 두고 하신 말씀이다. 지금 이야기는 사마 자따까의 것과 같다. 세존께서는 「이 비구를 나무라지 마라. 옛 현자들은 온 잠부디빠의 왕위를 얻고도 마다하고 부모를 봉양했다」 하셨다. 옛날 바라나시가 브라흐마왓다나라 불릴 때 마노자 왕이 다스렸다. 그곳 큰 바라문 집안에 보살이 소나로, 이어 아우 난다가 났다. 형제가 혼인을 마다하자 부모까지 재물을 버리고 함께 히말라야에 암자를 짓고 출가했다.…</p>
