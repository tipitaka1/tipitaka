<h1>M_THAP_396_마두다야까 장로의 아빠다나</h1>
<p>수메다께 풀 깔개와 숲의 꿀을 바친 이 신두 강가에서 제자들을 가르치던 바라문이 수메다 부처님께 풀 깔개와 숲의 꿀을 바친 이야기입니다. 앞의 세 게송은 암자와 제자들의 학문을 늘어놓은 대목이라 정형을 벗어납니다. 태에 들 때와 태에서 나올 때 꿀비가 내렸다는 §11과 §12가 이 편의 중심입니다. §15는 다른 게송보다 한 행이 긴 운율로 되어 있습니다. 신두 강가에 내 암자가 잘 지어져 있었다. 거기서 나는 제자들에게 옛이야기와 관상을 가르…</p>
