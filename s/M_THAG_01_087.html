<h1>M_THAG_01_087_빠윗타 장로의 게송</h1>
<p>사리뿟따의 출가 소식에 돌아선 유행자 빠윗타(Paviṭṭha)는 마가다 지방 바라문 집안에서 태어났다. 벗어남으로 기우는 성품이라 유행자로 출가해 그 가르침에서 배울 것을 배웠으나, 우빠띳사와 꼴리따가 부처님의 가르침에 출가했다는 말을 듣고 「저런 큰 지혜를 지닌 이들이 거기로 갔으니 그편이 낫겠다」 하여 세존께 나아가 법을 듣고 출가했다. 세존께서 위빳사나를 일러 주시자 오래지 않아 아라한이 되었고, 얻은 것을 밝히며 이 게송을 읊었다. 무더…</p>
