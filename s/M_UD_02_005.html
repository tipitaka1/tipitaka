<h1>M_UD_02_005_우빠사까(바쁜 청신사)</h1>
<p>잇차낭갈라에 사는 한 청신사가 볼일이 있어 사왓티에 왔다가 오랜만에 세존을 뵙는다. 이런저런 할 일에 매여 찾아뵙지 못했다는 말을 들으시고, 세존께서는 아무것도 가진 것 없는 이가 즐겁고 사람은 사람에게 매인다고 읊으신다. 이와 같이 나는 들었다. 한때 세존께서 사왓티의 제따와나 아나타삔디까 승원에 머무셨다. 마침 그때 잇차낭갈라에 사는 어떤 청신사가 무슨 볼일이 있어 사왓티에 왔다. 그때 그 청신사는 사왓티에서 그 볼일을 마치고 세존께 다가갔…</p>
