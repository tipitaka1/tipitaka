<h1>M_ITI_045_빠띠살라나(홀로 앉음)</h1>
<p>홀로 앉기를 좋아하고 안으로 마음을 고요히 하며 위빳사나를 갖추어 머물라고 이르신 편이다. 그렇게 머물면 두 가지 열매 가운데 하나가 예상된다고 하셨다. 세존께서 이렇게 말씀하셨다. 아라한께서 이렇게 말씀하신 것을 나는 들었다 — 비구들이여, 홀로 앉기를 좋아하고 홀로 앉기를 기뻐하며 머물라. 안으로 마음의 사마타에 힘쓰고, 선정을 저버리지 않고, 위빳사나를 갖추고, 빈 집을 즐겨 찾으라. 비구들이여, 홀로 앉기를 좋아하고 홀로 앉기를 기뻐하며…</p>
