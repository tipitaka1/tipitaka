<h1>M_THAG_18_001_마하깟사빠 장로의 게송</h1>
<p>두타행에 으뜸 마가다의 바라문 까삘라의 아들 삡빨리(Pippali)로 태어났다. 밧다 까삘라니(Bhaddā Kāpilānī)와 혼인했으나 부부로 살지 않았고, 부모가 세상을 뜨자 재산을 버리고 함께 출가해 세존의 제자가 되었다. 빠두뭇따라 부처님 때 세운 서원대로, 세존께서는 그를 두타행을 지키는 이 가운데 으뜸으로 꼽으셨다. 무리와 집안을 멀리하고 홀로 바위산에 머무는 삶을 밝혀 이 게송들을 읊었다. 무리에 떠받들려 다니지 마라. 마음이 흩어…</p>
