<h1>M_THAG_06_003_마하나가 장로의 게송</h1>
<p>가왐빠띠의 신통을 보고 그 문하로 든 이 사께따의 바라문 마두와셋타의 아들 마하나가(Mahānāga)다. 세존께서 사께따 안자나 숲에 계실 때 가왐빠띠 존자의 신통을 보고 믿음을 얻어 그 장로에게 출가했고, 그 가르침에 서서 아라한이 되었다. 해탈의 즐거움에 머물던 어느 날, 여섯 무리 비구들이 함께 도 닦는 이들을 공경하지 않고 지내는 것을 보고 그들을 타이르려 이 게송을 읊었다. 함께 도 닦는 이들에게 공경이 없는 사람은 바른 법에서 줄어든…</p>
