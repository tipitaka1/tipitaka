<h1>M_THAG_02_003_왈리야 장로의 게송</h1>
<p>좋은 벗을 만나 감관을 다잡은 이 사왓티 큰 바라문 집안의 아들 왈리야(Valliya). 젊어서는 감각의 기능이 이끄는 대로 지냈으나, 좋은 벗을 사귄 인연으로 세존께 나아가 법을 듣고 믿음을 얻어 출가했다. 위빳사나를 시작해 오래지 않아 아라한이 되었다. 범부이던 시절 마음이 형색 따위의 대상을 제멋대로 좇던 일과, 이제 성스러운 길로 그것을 붙들어 놓은 일을 드러내어, 얻은 경지를 밝히며 이 두 게송을 읊었다. 원숭이가 문 다섯인 이 오두막…</p>
