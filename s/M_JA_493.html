<h1>M_JA_493_마하와니자(소원 나무를 벤 장사꾼)</h1>
<p>세존께서 제따와나에 머무실 때, 사왓티의 장사꾼들을 두고 하신 말씀이다. 그들은 길을 잃고 헤매다 용이 지키는 큰 니그로다 나무를 만나, 동쪽 가지에서 물을, 남쪽에서 밥을, 서쪽에서 여인들을, 북쪽에서 일곱 보배를 얻어 돌아왔다. 세존께 공양하고 그 몫을 나무 신에게 돌리자, 세존께서 「그대들은 만족을 알아 갈애에 끌리지 않았기에 재물을 얻었으나, 옛사람들은 만족을 몰라 갈애에 끌려 재물도 목숨도 잃었다」 하셨다.</p>
