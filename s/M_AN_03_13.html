<h1>M_AN_03_13_꾸시나라(꾸시나라의 여러 경)</h1>
<p>한때 세존께서 꾸시나라의 발리하라나 숲에 머무셨다. 거기서 세존께서 비구들에게 이르셨다. 「비구들이여.」 「예, 존자시여.」 그 비구들은 세존께 대답했다. 세존께서 이렇게 말씀하셨다 — &quot;비구들이여, 여기 비구가 어떤 마을이나 읍에 기대어 머문다. 그러면 장자나 장자의 아들이 다가와 다음 날 공양에 초대한다. 비구들이여, 비구는 원하면 받아들인다. 그는 그 밤이 지나자 오전에 옷을 입고 발우와 가사를 들고 그 장자나 장자의 아들의 집으로 다가간…</p>
