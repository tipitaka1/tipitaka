<h1>M_VIN_2_03_세키야(중학 75조)</h1>
<p>존자들이시여, 이 세키야 법이 외움에 이릅니다. 그때 부처님이신 세존께서는 사왓티의 제따와나, 아나타삔디까 승원에 머무셨다. 그때 여섯 무리 비구들이 앞뒤로 늘어뜨려 옷을 입었다. 사람들이 못마땅해하고 불평하고 비난하였다 — 「어찌하여 사꺄의 아들 사문들이 앞뒤로 늘어뜨려 옷을 입는가? 마치 감각적 욕망을 누리는 재가자들 같지 않은가.」 비구들은 그 사람들이 못마땅해하고 투덜거리고 비난하는 것을 들었다. 욕심이 적은 비구들은 …pe… 못마땅해하…</p>
