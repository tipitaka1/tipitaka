<h1>M_JA_318_까나웨라(기녀를 배신한 도둑)</h1>
<p>세존께서 제따와나에 머무실 때 옛 아내에게 마음이 끌린 비구를 두고 하신 말씀이다. 그 이야기는 인드리야 자따까에 자세히 나온다. 세존께서 그 비구에게 「비구여, 전에도 그대는 이 여자 때문에 칼에 목이 잘렸다」 하시고 옛일을 드셨다. 옛날 바라나시에서 보살은 까시의 한 마을 장자의 집에 도둑의 별자리로 태어나, 자란 뒤 도둑질로 살아 이름이 났다. 어느 날 부호의 집을 뚫고 많은 재물을 훔쳤다. 시민들이 왕에게 아뢰자 성 지키는 이가 밤에 곳…</p>
