<h1>M_PTH_65_순역론 삼법 빳타나</h1>
<p>〔성립하는 조건의 수 — 실측 65건〕 이름의 차례가 곧 물음의 차례다. 「순역」은 앞자리를 순(긍정), 뒷자리를 역(부정)으로 놓는다는 말이지, 순론을 하고 나서 역론을 또 한다는 말이 아니다. 〔성립하는 조건의 수 — 실측 65건〕 부호가 어긋나므로 「선한 법에서 선하지 않은 법이 나온다」처럼 읽히는 줄이 생긴다. 선악의 인과를 말하는 것이 아니라, 두 자리에 부호를 달리 걸어도 조건이 성립하는지를 셈으로 확인하는 것이다.</p>
