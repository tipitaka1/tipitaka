<h1>M_THAG_01_099_웃띠야 장로의 게송</h1>
<p>여인의 노랫소리에 물든 마음을 알아챈 이 웃띠야(Uttiya)는 까삘라왓투 사꺄 왕족으로 났다. 세존께서 친척들을 만나신 자리에서 부처님의 위엄을 보고 믿음을 얻어 출가했다. 탁발 길에 여인의 노랫소리를 듣고 마음이 물들었으나 곧바로 돌이켜 눌러 두고, 절로 돌아와 낮 머무는 자리에 앉았다. 뉘우침이 사무쳐 그 자리에서 위빳사나를 키워 아라한이 되었다. 제 안에 오염이 일던 그 일을 들어 보이며 이 게송을 읊었다. 소리를 듣고 사띠를 놓쳐 사랑…</p>
