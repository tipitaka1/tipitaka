<h1>M_ITI_048_아빠이까(악처에 갈 자)</h1>
<p>버리지 않으면 악처와 지옥에 떨어지는 두 부류를 말씀하신 편이다. 청정한 삶을 살지 않으면서 산다고 내세우는 자와, 참으로 청정하게 사는 이를 근거 없이 헐뜯는 자다. 세존께서 이렇게 말씀하셨다. 아라한께서 이렇게 말씀하신 것을 나는 들었다 — 비구들이여, 이것을 버리지 않으면 악처에 가고 지옥에 갈 두 부류가 있다. 어떤 둘인가? 청정한 삶을 살지 않으면서 청정한 삶을 산다고 내세우는 자, 그리고 온전하고 깨끗하게 청정한 삶을 사는 이를 근거…</p>
