<h1>M_THAG_01_106_수헤만따 장로의 게송</h1>
<p>삼장에 통달해 막힘없는 앎을 갖춘 이 수헤만따(Suhemanta)는 빠리얀따 지방 넉넉한 바라문의 아들이다. 상깟사의 사슴 동산에 계신 세존께 법을 듣고 출가해 삼장에 통달했고, 위빳사나를 닦아 여섯 신통과 막힘없는 앎을 갖추었다. 「제자로서 얻을 것은 다 얻었으니 이제 비구들을 돕자」 하고, 찾아오는 이들의 의심을 끊어 주고 명상 주제를 훤히 일러 주며 지냈다. 어느 날 그들에게 슬기로운 이와 어리석은 이의 차이를 일러 주며 이 게송을 읊었다…</p>
