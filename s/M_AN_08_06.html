<h1>M_AN_08_06_고따미(비구니 승가의 시작)</h1>
<p>한때 세존께서는 삭까족 땅의 까삘라왓투에 있는 니그로다 승원에 머무셨다. 그때 마하빠자빠띠 고따미(Mahāpajāpatī Gotamī)가 세존께 다가갔다. 다가가서 세존께 절을 올리고 한쪽에 섰다. 한쪽에 선 마하빠자빠띠 고따미는 세존께 이렇게 말씀드렸다 — &quot;존자시여, 부디 여인들이 여래께서 드러내신 법과 율에서 집을 떠나 집 없이 출가할 수 있게 해 주십시오.」 &quot;고따미여, 그만두어라. 고따미여! 여래께서 밝히신 법과 율에서 여인이 집을 떠…</p>
