<h1>M_UD_04_002_웃다따(들뜬 비구들)</h1>
<p>꾸시나라의 살라 숲에서 멀지 않은 숲속 오두막에 여러 비구가 들뜨고 뽐내며 사띠를 놓친 채 지내는 것을 세존께서 보시고, 몸을 지키지 않는 이는 마라의 손아귀에 들고 마음을 지키는 비구는 모든 나쁜 곳을 버린다고 읊으신 편이다. 이와 같이 나는 들었다. 한때 세존께서 꾸시나라의 우빠왓따나 말라족 살라 숲에 머무셨다. 마침 그때 여러 비구가 세존에게서 멀지 않은 숲속 오두막에 머물고 있었다. 그들은 들뜨고 뽐내고 촐랑대고 입이 거칠고 말이 흐트러…</p>
