<h1>M_THIG_06_007_굿따 장로니의 게송</h1>
<p>좀처럼 나아가지 못하다 훈계를 받은 이 사왓티 바라문 집안의 딸이다. 철이 들자 재가 생활을 싫어하여 부모의 허락을 받고 마하빠자빠띠고따미(Mahāpajāpatigotamī) 곁에서 출가했다. 위빳사나를 시작했으나 오래 길든 마음이 바깥 대상으로 달아나 한곳에 모이지 않았다. 세존께서 이를 보시고 향실에 앉으신 채 광명을 놓아 그녀 곁 허공에 앉은 모습을 보이시며, 이 게송으로 훈계하셨다. 굿따여, 사랑하는 아들과 재산을 버리고 출가한 그 목적…</p>
