<h1>M_CP_009_웻산따라(웻산따라의 보시)</h1>
<p>흰 코끼리를 바라문들에게 준 일로 나라에서 쫓겨나, 왕까 산으로 들어가 두 아이와 아내까지 내준 일을 보살이 스스로 말하는 편이다. 이야기의 굽이마다 땅이 흔들렸고, 마지막 게송이 그 일곱 번을 셈한다. 나를 낳은 어머니는 풋사띠라는 왕족 여인이었다. 그는 지난 생들에서 삭까의 사랑받는 왕비였다. 그의 수명이 다한 것을 알고 신들의 왕이 이렇게 말했다. &quot;그대에게 열 가지 소원을 주겠다. 복된 이여, 바라는 것을 말하라.&quot;</p>
