<h1>M_THAG_05_011_소나꾸띠깐나 장로의 게송</h1>
<p>아완띠 꾸라라가라의 큰 부잣집 아들 소나(Soṇa)다. 값이 일 꼬띠나 나가는 귀걸이를 달고 다녀 꾸띠깐나라 불렸다. 마하깟짜나 존자에게 법을 듣고 그를 섬기다 출가했는데, 변방이라 비구 열 분을 모으기 어려워 힘들게 구족계를 받았다. 세존을 뵈러 사왓티에 가 한 향실…</p>
