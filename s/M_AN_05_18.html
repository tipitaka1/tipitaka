<h1>M_AN_05_18_우빠사까(재가 신자의 길)</h1>
<p>이와 같이 나는 들었다. 한때 세존께서는 사왓티의 제따와나, 아나타삔디까 승원에 머무셨다. 거기서 세존께서 비구들에게 이르셨다. 「비구들이여.」 「예, 존자시여.」 그 비구들은 세존께 대답했다. 세존께서는 이렇게 말씀하셨다 — &quot;비구들이여, 다섯 가지 법을 갖춘 청신사는 주눅이 든다. 어떤 다섯인가? 살아 있는 것을 죽인다. 주지 않은 것을 가진다. 감각적 욕망에 대해 그릇되게 행한다. 거짓말을 한다. 곡주와 과일주 같은 취하게 하는 것에 빠져…</p>
