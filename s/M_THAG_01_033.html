<h1>M_THAG_01_033_소빠까 장로의 게송</h1>
<p>사왓티(Sāvatthī)의 가난한 여인의 아들이다. 어머니가 달이 차도 해산하지 못하고 정신을 잃고 쓰러지자, 친척들이 죽은 줄 알고 무덤으로 옮겨 장작더미에 올렸으나 비바람이 일어 불을 붙이지 못했다. 아이는 마지막 생을 받은 몸이라 탈 없이 태어났고 어머니는 죽었다…</p>
