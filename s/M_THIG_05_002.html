<h1>M_THIG_05_002_위말라 장로니의 게송</h1>
<p>목갈라나를 꾀려다 도리어 깨친 기녀 웨살리(Vesālī)에서 몸을 팔아 살던 여인의 딸로 태어나 위말라(Vimalā)라 불렸고, 자라서 어머니와 같은 일로 살았다. 탁발하는 마하목갈라나(Mahāmoggallāna) 존자에게 마음을 빼앗겨 그의 처소로 찾아가 꾀려 하다가, 몸의 더러움을 들어 꾸짖으시는 가르침을 듣고 부끄러움을 알았다. 청신녀가 되었다가 뒷날 비구니로 출가하여 오래지 않아 아라한이 되었고, 지난 삶과 지금을 견주어 이 게송을 읊었…</p>
