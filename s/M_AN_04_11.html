<h1>M_AN_04_11_왈라하까(구름 등의 비유)</h1>
<p>이와 같이 나는 들었다. 한때 세존께서는 사왓티의 제따와나, 아나타삔디까 승원에 머무셨다. 거기서 세존께서 비구들에게 이르셨다. 「비구들이여.」 「예, 존자시여.」 그 비구들은 세존께 대답했다. 세존께서는 이렇게 말씀하셨다 — 비구들이여, 이러한 네 가지 구름이 있다. 어떤 넷인가? 천둥은 치되 비는 내리지 않는 것, 비는 내리되 천둥은 치지 않는 것, 천둥도 치지 않고 비도 내리지 않는 것, 천둥도 치고 비도 내리는 것이다. 비구들이여, 이것…</p>
