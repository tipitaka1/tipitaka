<h1>M_PTH_48_봄으로 버릴 것 이법 · 선 삼법</h1>
<p>〔성립하는 조건의 수 — 실측 349건〕 「봄」(dassana)은 눈으로 보는 것이 아니라 예류도를 가리키는 말이다. 도의 첫 자리에서 끊기는 법을 「봄으로 버릴 것」이라 한다. 〔팔리 원문〕 「봄으로 버릴 것이 아닌 법」을 「닦음으로 버릴 법」과 같은 것으로 읽으면 안 된다. 닦음으로 버릴 것은 따로 선 이법이고, 여기 반대항에는 버릴 것이 없는 법까지 다 들어온다.</p>
