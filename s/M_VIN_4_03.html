<h1>M_VIN_4_03_사뭇짜약칸다깡(죄를 거두는 다발)</h1>
<p>그때 부처님이신 세존께서는 사왓티의 제따와나, 아나타삔디까 승원에 머무셨다. 그때 우다이 존자가 고의로 정액을 내보낸 죄 하나를 짓고서 감추지 않았다. 그는 비구들에게 알렸다 — 「도반들이여, 저는 숨기지 않은, 일부러 정액을 내보내는 한 가지 죄를 지었습니다. 저는 어떻게 해야 합니까?」 세존께 이 일을 아뢰었다. 「비구들이여, 그러니 승가는 우다이 비구에게, 고의로 정액을 내보내고 감추지 않은 죄 하나에 대하여 엿새 동안의 참회처벌을 주어라…</p>
