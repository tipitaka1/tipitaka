<h1>A_VV_034_뻬사와띠</h1>
<p>「수정과 은과 황금의 그물로 덮이고」는 뻬사와띠 천궁이다. 그 인연은 무엇인가? 세존께서는 사왓티의 제따 숲에 머무셨다. 그때 마가다의 날라까 마을 어떤 큰 재산을 지닌 장자 집안에 뻬사와띠라는 며느리가 있었다. 그는 깟사빠 세존의 한 요자나 되는 황금 탑을 세울 때 어린 소녀로서 어머니와 함께 탑 자리에 가서 어머니에게 물었다고 한다. 「어머니, 이 사람들은 무엇을 합니까?」 「탑을 세우려고 황금 벽돌을 만든다.」 그 말을 듣고 소녀는 마음이…</p>
