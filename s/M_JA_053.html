<h1>M_JA_053_뿐나빠띠(독을 탄 술 대접)</h1>
<p>세존께서 제따와나에 머무실 때, 독을 탄 술을 두고 이 말씀을 하셨다. 사왓티의 술꾼들이 술값이 떨어지자, 아나타삔디까가 왕을 뵈러 가는 길목에 술자리를 차려 놓고 약을 탄 술을 먹여 반지와 옷을 빼앗기로 꾀했다. 예류자인 그가 술을 마실 리 없었으나, 저들을 살피려 들어가 하는 짓을 보고 까닭을 알아챈 뒤 꾸짖어 쫓아내고 세존께 아뢰었다. 옛날 바라나시에서 브라흐마닷따가 다스릴 때, 보살은 그 성의 부호였다. 그때도 건달들이 똑같이 술을 차려…</p>
