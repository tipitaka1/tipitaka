<h1>M_PTH_57_순론 삼법·삼법 빳타나</h1>
<p>〔성립하는 조건의 수 — 실측 218건〕 「순론」(anuloma)은 조건을 있는 그대로 「원인 조건으로」 묻는 방식이다. 이에 맞서 「역론」(paccanīya)은 「원인 조건이 아닌 것으로」 뒤집어 묻고, 「순역론」은 긍정으로 세운 판을 부정으로 세며, 「역순론」은 그 차례를 뒤집는다. 뒤집는 것은 법의 내용이 아니라 묻고 세는 꼴이다.</p>
