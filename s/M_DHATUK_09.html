<h1>M_DHATUK_09_앗타마나야(여덟째 방식)</h1>
<p>물질의 무더기와 결합하지 않은 법들은, 그 법들은 몇 무더기와 몇 감각영역과 몇 요소와 결합하는가? 없다. 느낌의 무더기… 지각의 무더기… 형성의 무더기… 의식의 무더기…pe… 다툼이 있는 법… 다툼이 없는 법과 결합하지 않은 법들, 그 법들은 몇 무더기와 몇 감각영역과 몇 요소와 결합하는가? 없다. 법의 감각영역과 법의 요소, 또 생명과 정신과 물질; 여섯 감각영역과 태어남과 늙음과 죽음, 그리고 삼법(三法)에서 둘은 얻어지지 않는다.</p>
