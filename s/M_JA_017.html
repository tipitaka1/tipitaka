<h1>M_JA_017_말루따(바람 불 때가 추울 때)</h1>
<p>세존께서 제따와나에 머무실 때, 늙어서 출가한 두 비구를 두고 하신 말씀이다. 둘은 꼬살라의 어느 숲에 살았는데 한 사람은 깔라 장로, 한 사람은 준하 장로였다. 준하가 깔라에게 추위는 어느 때 오느냐고 묻자 깔라는 「어두운 보름에 온다」 했고, 뒷날 깔라가 준하에게 같은 것을 묻자 준하는 「밝은 보름에 온다」 했다. 둘 다 의심을 풀지 못해 세존께 여쭈었다. 옛날 어느 산기슭 한 굴에 사자와 호랑이가 벗으로 살았다. 그때 보살도 선인으로 출가…</p>
