<h1>A_PV_034_꾸따위닛차이까</h1>
<p>「화환을 걸고 관을 쓰고 팔찌를 끼었으며」란 스승께서 웰루와나에 머무실 때 거짓으로 판결하던 아귀를 두고 말씀하신 것이다. 그때 빔비사라 왕은 한 달에 엿새 포살을 지켰고, 그를 따라 많은 사람이 포살을 지켰다. 왕은 자기에게 오는 사람마다 물었다 — 「그대들은 포살을 지켰는가, 지키지 않았는가?」 그 가운데 재판을 맡은 한 사람이 있었으니, 이간하는 말을 하고 속임수를 쓰며 뇌물을 받는 자였다. 그는 「지키지 않았습니다」라고 말할 엄두가 나지…</p>
