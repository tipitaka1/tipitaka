<h1>M_THAP_042_깝빠룩키야 장로의 아빠다나 — 여의수를 세운 이</h1>
<p>싯닷타 부처님의 탑 앞에 여의수(kapparukkha)를 세우고 고운 천을 걸어 둔 이야기입니다. 싯닷타 세존의 가장 뛰어난 탑 앞에 고운 천을 걸고〔주1〕 나는 여의수를 세웠다. 신으로든 사람으로든 어느 태에 태어나더라도 내 문 앞을 빛내며 여의수가 서 있다.</p>
