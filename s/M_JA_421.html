<h1>M_JA_421_강가말라(반나절 포살의 갚음)</h1>
<p>세존께서 제따와나에 머무실 때 포살을 두고 하신 말씀이다. 옛 현자들은 반나절 포살 하나로 큰 영화를 얻었다 하셨다. 옛날 바라나시 부호 수찌빠리와라의 집은 온 식구가 달에 엿새 포살을 지켰다. 보살은 가난한 집에 나 그 집에서 품을 팔았는데, 축제날 아무도 일러 주지 않아 종일 일하고 저물어서야 알았다. 반나절 포살이라도 된다는 말에 그 밤을 굶으며 지키다 목숨이 다해, 왕의 위엄을 보고 왕위를 바란 탓에 왕비의 태에 들어 우다야 왕이 되었다…</p>
