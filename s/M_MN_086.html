<h1>M_MN_086_앙굴리말라(앙굴리말라경)</h1>
<p>이와 같이 나는 들었다. 한때 세존께서는 사왓티의 제따와나, 아나타삔디까 승원에 머무셨다. 그 무렵 꼬살라의 빠세나디 왕의 영토에 앙굴리말라(Aṅgulimāla)라는 도둑이 있었다. 그는 잔혹하고 손에 피를 묻혔으며 죽이고 해치는 데 빠져 있어 살아 있는 존재에게 자비가 없었다. 그 때문에 마을은 마을이 아니게 되었고 성읍은 성읍이 아니게 되었고 지방은 지방이 아니게 되었다. 그는 사람들을 죽이고 또 죽여 손가락으로 만든 화환을 걸고 다닌다. …</p>
