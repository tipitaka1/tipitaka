<h1>A_VV_049_랏주말라</h1>
<p>「눈부신 빛으로」라 한 것은 랏주말라 천궁이다. 그 인연은 무엇인가? 세존께서는 사왓티의 제따 숲에 머무셨다. 그때 가야 마을의 어느 바라문의 딸이 바로 그 마을의 어떤 바라문 총각에게 시집가 남편의 집으로 가서, 그 집에서 안주인 노릇을 하며 지냈다. 그녀는 그 집에서 하녀의 딸을 보면 참지 못하였다. 본 그때부터 화가 치밀어 부글부글 끓으며 욕하고 헐뜯고 손찌검을 하였다. 그 아이가 나이 들어 일할 만하게 되자, 지난 생에 원한이 맺힌 이가…</p>
