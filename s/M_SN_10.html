<h1>M_SN_10_약카(약카)</h1>
<p>이와 같이 나는 들었다. 한때 세존께서 라자가하의 인다꾸따 산, 인다까 약카의 처소에 머무셨다. 그때 인다까 약카가 세존께 다가갔다. 다가가서 세존께 시로 이렇게 아뢰었다 – &quot;부처들은 물질이 생명이 아니라고 말합니다. 그러면 이 존재는 어떻게 이 몸을 얻습니까. 뼈와 살덩이는 어디서 옵니까. 어떻게 이 존재가 모태에 매입니까.&quot; &quot;먼저 깔랄라가 되고, 깔랄라에서 압부다가 된다. 압부다에서 뻬시가 생기고, 뻬시에서 가나가 이루어진다.</p>
