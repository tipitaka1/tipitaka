<h1>M_PS_1_10_만다뻬이야까타 (정수를 마심의 논의)</h1>
<p>가르침을 「정수(maṇḍa)」와 「마실 것(peyya)」과 「찌꺼기(kasaṭa)」로 나누어 보는 비유의 편이다. 무엇이 마셔야 할 정수이고 무엇이 버려야 할 찌꺼기인지를 계·삼매·지혜의 순서로 짚는다. 마하왁가를 닫는 편이다. 「비구들이여, 이 청정한 삶은 정수를 마시는 것이다. 스승께서 눈앞에 계시니 이것이 참으로 정수이다. 스승께서 눈앞에 계실 때 가르침의 정수가 있고, 받아 지님의 정수가 있고, 청정한 삶의 정수가 있다」.</p>
