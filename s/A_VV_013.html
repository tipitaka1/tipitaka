<h1>A_VV_013_빠타마수니사</h1>
<p>「눈부신 빛으로」란 며느리 천궁이다. 그 인연은 무엇인가? 사왓티의 어떤 집에 한 며느리가 있었는데, 탁발하러 집에 들어온 번뇌를 다한 장로를 보고 기쁨과 즐거움이 솟아 「이제 나에게 가장 훌륭한 공덕의 밭이 왔다」 하며, 자기가 받은 떡 몫을 들어다 정성껏 장로께 올렸다. 장로는 그것을 받고 기뻐하는 말을 해 주고 떠났다. 그는 뒷날 죽어 삼십삼천에 태어났다. 나머지는 모두 앞에서 말한 것과 같다. 그래서 이렇게 말하였다 —</p>
