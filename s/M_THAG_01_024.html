<h1>M_THAG_01_024_수간다 장로의 게송</h1>
<p>전단향 공양으로 몸에 향기를 얻은 이 사왓티(Sāvatthī)의 넉넉한 바라문 집안에 태어난 수간다(Sugandha)다. 전생에 깟사빠(Kassapa) 부처님의 향실을 값진 전단향으로 발라 올리며 「태어나는 곳마다 내 몸에서 이런 향기가 나기를」 하고 서원했다. 그 과보로 어머니 태에 든 때부터 집안이 향기로웠고 태어난 날에는 이웃집까지 향기가 퍼져, 부모가 「제 이름을 스스로 가지고 왔구나」 하며 수간다, 곧 향기로운 이라 이름 지었다. 자라…</p>
