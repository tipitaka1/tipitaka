<h1>A_VV_073_웃따라빠야시</h1>
<p>「신들의 왕의 수담마 모임터」란 웃따라 천궁이다. 그 인연은 무엇인가? 세존께서 완전한 열반에 드시고 사리를 나누어 곳곳에 탑을 세울 때, 법과 율을 결집할 이들로 마하깟사빠를 앞세운 대장로들이 가려 뽑혔고, 안거에 들 때까지 다른 장로들도 저마다 제 무리와 함께 곳곳에 머물고 있었다. 그때 꾸마라깟사빠 존자는 오백 비구와 함께 세따비야 성으로 가서 씽사빠 숲에 머물렀다. 빠야시 왕족은 장로가 거기 머문다는 말을 듣고 많은 사람을 거느리고 다가…</p>
