<h1>M_DN_026_짝까왓띠(전륜성왕사자후경)</h1>
<p>이와 같이 나는 들었다. 한때 세존께서는 마가다의 마뚤라에 머무셨다. 거기서 세존께서 비구들에게 이르셨다. 「비구들이여.」 「예, 존자시여」라며 그 비구들은 세존께 대답했다. 세존께서 이렇게 말씀하셨다 — &quot;비구들이여, 자신을 섬으로 삼고 자신을 귀의처로 삼아 머물러라. 남을 귀의처로 삼지 마라. 법을 섬으로 삼고 법을 귀의처로 삼아 머물러라. 남을 귀의처로 삼지 마라. 비구들이여, 어떻게 비구는 자기를 섬으로 삼아 머물고 자기를 의지처로 삼으…</p>
