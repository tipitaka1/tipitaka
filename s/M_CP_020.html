<h1>M_CP_020_상카빨라(상카빨라의 인욕)</h1>
<p>보살이 신통이 큰 뱀들의 왕 상카빨라였을 때의 일이다. 큰길가에 누워 제 몸을 누구든 가져가라 내놓았고, 보자족의 아들들이 꿰어 메고 가며 찔러 대는데도 성내지 않았다. 편 끝에 핫티나가 품 열 편을 갈무리한 목록 게송이 붙는다. 또 한 번, 내가 신통이 큰 상카빨라였을 때, 어금니를 무기로 삼고 무서운 독을 지녔으며 혀가 둘인 뱀들의 왕이었다. 네 갈래 길이 만나는 큰길, 온갖 사람으로 붐비는 그곳에서 네 가지 몸의 부분을 굳게 다짐하고 거기…</p>
