<h1>A_VV_067_빠타마우빳사야다야까</h1>
<p>「구름 걷힌 하늘의 달이」란 우빳사야다야까 천궁이다. 그 인연은 무엇인가? 세존께서는 라자가하의 웰루와나에 머무셨다. 그때 어떤 비구가 작은 마을의 거처에서 안거를 지내고, 안거를 마쳐 자자를 한 뒤 세존께 절을 올리려고 라자가하로 가다가, 도중에 저녁 무렵 어떤 마을에 들어가 묵을 곳을 찾다가 한 청신사를 보고 물었다. 「청신사여, 이 마을에 출가한 이가 묵을 만한 곳이 있소?」 청신사는 마음이 맑아져 집으로 가서 아내와 의논하고, 장로가 묵…</p>
