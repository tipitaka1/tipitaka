<h1>M_THAG_06_001_우루웰라깟사빠 장로의 게송</h1>
<p>천 명을 이끌던 결발 고행자 삼형제의 맏이 바라나시의 바라문 집안에 난 삼형제의 맏이다. 오백 제자를 데리고 우루웰라에 가서 고행자로 출가해 우루웰라깟사빠(Uruvelakassapa)라 불렸고, 나디깟사빠와 가야깟사빠가 그의 아우다. 세존께서 그의 처소에 오시어, 불 모신 집의 용을 길들이신 일부터 삼천오백 가지 신통으로 그와 무리를 이끄시고 출가시키셨다. 큰 회중을 거느린 이들 가운데 으뜸으로 꼽히신 분이다. 시샘과 자만으로 굽히지 않던 그때…</p>
