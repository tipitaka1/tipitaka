<h1>M_THAP_424_에까둣사다야까 장로의 아빠다나</h1>
<p>항사와띠 성에서 풀을 베어 살던 사람이 하나뿐인 천을 빠두뭇따라 부처님께 바친 이야기입니다. 집에 앉아 혼자 헤아리는 독백이 앞에 놓이고(§3~§4), 부처님의 수기가 그 뒤를 잇습니다(§8~§11). 끝에서는 그 천의 과보가 아직 다하지 않았다고 말합니다.</p>
