<h1>A_VV_078_암바</h1>
<p>「보석 기둥이 선 이 천궁은 높고」란 암바 천궁이다. 그 인연은 무엇인가? 세존께서는 라자가하의 웰루와나에 머무셨다. 그때 라자가하의 어떤 가난한 사람이 남의 집에 밥과 삯을 받고 매여 망고 숲을 지키고 있었다. 그는 어느 날, 여름철에 햇볕이 뜨겁게 내리쬐고 모래가 달아오르며 아지랑이가 아른아른 퍼지는 땅 위로, 그 망고 동산에서 멀지 않은 길을 땀에 젖은 몸으로 지나시는 사리뿟따 존자를 보고 공경하고 우러르는 마음이 일어나 다가가 이렇게 말…</p>
