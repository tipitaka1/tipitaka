<h1>M_PTH_27_작은 중간 이법</h1>
<p>〔팔리 원문〕 「작은 중간」은 다루는 법이 작다는 뜻이 아니라 다발과 다발 사이에 낀 자리를 가리키는 이름이다. 〔성립하는 조건의 수 — 실측 369건〕 조건 없는 법·형성되지 않은 법으로 세워진 칸에는 열반만 든다. 그 칸들의 셈이 유난히 짧은 것은 그 때문이다.</p>
