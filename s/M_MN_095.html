<h1>M_MN_095_짱끼(짱까)</h1>
<p>이와 같이 나는 들었다. 한때 세존께서는 큰 비구 승가와 함께 꼬살라에서 유행하시다가 꼬살라의 바라문 마을인 오빠사다(Opāsāda)에 이르셨다. 세존께서는 그곳 오빠사다의 북쪽, 데와와나의 살라 숲에 머무셨다. 그때 짱끼(Caṅkī) 바라문이 오빠사다를 다스리고 있었…</p>
