<h1>M_SNP_05_003_띳사멧떼이야마나와뿟차(멧떼이야의 물음)</h1>
<p>열여섯 물음 가운데 둘째다. 바라문 학도 띳사멧떼이야가 세상에서 누가 만족한 이인지, 누구에게 흔들림이 없는지, 누구를 위대한 사람이라 하는지를 여쭙고, 세존께서 감각적 욕망 가운데서 청정한 삶을 사는 이를 들어 답하신다. 세상에서 누가 만족한 이입니까 (띳사멧떼이야 존자가 여쭈었다) 누구에게 흔들림이 없습니까. 누가 양끝을 잘 알아, 가운데에도 슬기로 물들지 않습니까. 누구를 위대한 사람이라 하십니까. 여기서 누가 꿰매는 이를 넘어섰습니까.</p>
