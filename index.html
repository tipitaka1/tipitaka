<script>
async function getData(){
  const r = await fetch('data.bin');
  if(!r.ok) throw new Error('data.bin ' + r.status);
  const tot = +(r.headers.get('content-length') || 12810515);
  const rd = r.body && r.body.getReader();
  if(!rd) return new Uint8Array(await r.arrayBuffer());
  const parts = []; let got = 0;
  for(;;){
    const {done, value} = await rd.read();
    if(done) break;
    parts.push(value); got += value.length;
    prog(Math.min(90, got / tot * 90), '자료 받는 중 ' + Math.round(got/tot*100) + '%');
  }
  const out = new Uint8Array(got); let o = 0;
  for(const p of parts){ out.set(p, o); o += p.length; }
  return out;
}
</script>
<script>
'use strict';
let D=null, path=[], cur=null, tab='tree', mode=0;   // mode 0 둘다 1 한글만 2 팔리만

/* ── 저장 ─────────────────────────────── */
const S={
  get(k,f){ try{ return JSON.parse(localStorage.getItem('kyl3_'+k)) ?? f }catch(e){ return f } },
  set(k,v){ try{ localStorage.setItem('kyl3_'+k,JSON.stringify(v)) }catch(e){} }
};
let stars=S.get('stars',[]), recent=S.get('recent',[]), hits=S.get('hits',{});
const DEF={fs:15, fw:700, lh:1.75, ff:'KR', theme:'dark', marks:1, mode:0, den:2, code:1, plink:1, dlg:1, hits:0};
const _sv=S.get('cfg',{});
let C=Object.assign({}, DEF, _sv);
if(_sv.v!==2){ C.plink=1; C.v=2; }      // 쓰던 기기도 미리보기 주소로 한 번 맞춘다
mode=C.mode;
function apply(){
  const R=document.documentElement.style, H=document.documentElement;
  R.setProperty('--fs',C.fs+'px'); R.setProperty('--fw',C.fw);
  R.setProperty('--lh',C.lh);      R.setProperty('--ff',C.ff);
  H.dataset.theme=C.theme; H.dataset.marks=C.marks; H.dataset.den=C.den;
  const b=document.getElementById('bold'); if(b) b.classList.toggle('act',C.fw>=700);
  S.set('cfg',C);
}
apply();

/* ── 자료 펴기 ─────────────────────────── */
const prog=(p,m)=>{ const b=document.getElementById('lbar'), s=document.getElementById('lmsg');
  if(b) b.style.width=p+'%'; if(s&&m) s.textContent=m; };
async function unzip(bin){
  // 서버가 이미 풀어서 보냈으면(Content-Encoding) 그대로 쓴다
  if(!(bin[0]===0x1f && bin[1]===0x8b)) return new TextDecoder().decode(bin);
  if('DecompressionStream' in window){
    const st=new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));
    return await new Response(st).text();
  }
  throw new Error('이 브라우저는 압축을 풀지 못합니다');
}
async function boot(){
  try{
    const bin=await getData();
    prog(92,'펴는 중…');
    D=JSON.parse(await unzip(bin));
  }catch(e){
    prog(100,'자료를 읽지 못했습니다 — '+e.message); return;
  }
  const L=document.getElementById('loading'); if(L) L.remove();
  const want=byId(location.hash);
  if(location.hash.length>1 && !want) setTimeout(()=>toast('그런 이름의 경을 찾지 못했습니다'),600);
  if(want){                                   // 링크로 들어온 경우 — 그 경을 바로 연다
    cur=want; hits[cur]=(hits[cur]||0)+1; S.set('hits',hits);
    recent=[cur].concat(recent.filter(x=>x!==cur)).slice(0,60); S.set('recent',recent);
  }
  render();
  try{ history.replaceState(snap(),'',hashNow()); }catch(e){}
  askInstall();
}

/* ── 마크다운 → 화면 ───────────────────── */
function isPali(l){
  if(/[가-힣]/.test(l)) return false;
  return /[a-zA-Zāīūṃṅñṭḍṇḷ]/.test(l);
}
/* 표지(§1 · §1-게송2)가 본문과 한 줄에 붙어 있는 꼴을 가른다.
   산문은 「§1 Evaṃ me…」, 게송은 「§1-게송1」 혼자 — 둘 다 받아야 한다. */
const MKRE=/^(§\S+)[ \t]+(.*)$/;
/* 대화 — 새 인용이 열리는 자리에서 줄을 나눈다.
   여는 부호 셋: " “ 「   (팔리의 ‘ ’ 는 건드리지 않는다) */
const DLG=/(?<=[.?!…][”"』」]?)[ \t]+(?=[“"「])/g;
const QOPEN=/[“"「]/g;
/* 문서 첫머리의 길잡이 줄 — 목록·용어는 앱에 이미 있으니 버리고 나머지는 단추로 */
const NAVRE=/^(목록|차례) → /;
let navLinks=[];

function md2html(src,h1){
  const out=[]; navLinks=[];
  const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  let pend='', unit='';                      // 앞 문단에서 넘어온 표지 · 지금 단위
  const mk=t=>(C.marks&&t)?'<span class="mkin">'+esc(t)+'</span> ':'';
  const U=u=>u?' data-u="'+esc(u)+'"':'';
  for(const blk of src.split(/\n\s*\n/)){
    let b=blk.trim(); if(!b) continue;
    if(/^# /.test(b)){ out.push('<h1>'+esc(h1||b.slice(2))+'</h1>'); continue; }
    if(/^#{2,4} /.test(b)){ const lv=b.match(/^#+/)[0].length>2?'h3':'h2';
      out.push('<'+lv+'>'+esc(b.replace(/^#+ /,''))+'</'+lv+'>'); continue; }
    if(/^>/.test(b)){
      let inner=b.split('\n').map(l=>l.replace(/^>\s?/,'')).join('\n');
      const cm=inner.match(/^\[!(\w+)\](-?)[ \t]*(.*)/);
      if(cm){                                 // 콜아웃 — 접었다 폈다 하는 상자
        const cap=cm[3].trim()||'펼치기';
        const nl=inner.indexOf('\n');
        inner = nl<0 ? '' : inner.slice(nl+1);
        if(cm[2]==='-')                        // [!note]- 는 접힌 채로
          out.push('<details class="cal"><summary>'+esc(cap)+'</summary>'+md2html(inner)+'</details>');
        else                                   // [!info] 는 펼친 상자
          out.push('<div class="cal open"><div class="cap">'+esc(cap)+'</div>'+md2html(inner)+'</div>');
      } else {                                 // 그냥 인용 — 뽑아 쓴 글귀
        out.push('<blockquote>'+md2html(inner)+'</blockquote>');
      }
      continue;
    }
    let lines=b.split('\n');
    /* 첫 줄에서 표지를 떼어낸다 */
    let mark='';
    const m=lines[0].match(MKRE);
    if(m){ mark=m[1]; lines[0]=m[2]; b=lines.join('\n'); unit=mark; }
    else if(/^§\S+$/.test(lines[0]) && lines.length===1){ pend=unit=lines[0]; continue; }
    if(!b.trim()){ if(mark) pend=mark; continue; }
    const tag=mark||pend;
    /* 길잡이 줄 */
    if(NAVRE.test(b) && lines.length===1){
      for(const seg of b.split(' · ')){
        const mm=seg.match(/^(.+?) → \[\[([^\]|]+?)\]\]/);
        if(!mm) continue;
        const k=mm[1].trim();
        if(k==='목록'||k==='차례'||k==='용어') continue;
        navLinks.push([k,mm[2]]);
      }
      continue;
    }
    const pali=lines.every(isPali);
    if(pali){
      pend='';
      if(mode!==1) out.push('<p class="pali"'+U(unit)+'>'+mk(tag)+esc(b)+'</p>');
      else if(tag) pend=tag;               // 한글만 — 표지를 다음 한글 문단으로 넘긴다
      continue;
    }
    const ink=t=>esc(t)
      .replace(/\[\[([^\]|]+?)\|([^\]]+?)\]\]/g,(m,x,y)=>'<a href="#" data-link="'+x+'">'+y+'</a>')
      .replace(/\[\[([^\]|]+?)\]\]/g,(m,x)=>'<a href="#" data-link="'+x+'">'+x+'</a>')
      .replace(/`([^`]+)`/g,'<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
    if(/^\|/.test(lines[0]) && lines.length>=2 && /^\|[\s:|-]+\|?$/.test(lines[1].trim())){
      const cut=r=>r.replace(/^\|/,'').replace(/\|$/,'').split(/(?<!\\)\|/);
      const cell=r=>cut(r).map(x=>ink(x.trim().replace(/\\\|/g,'|')));
      const al=cut(lines[1]).map(x=>{
        const t=x.trim();
        return t.endsWith(':')? (t.startsWith(':')?'center':'right') : 'left';
      });
      const th=cell(lines[0]);
      let t='<div class="tw"><table><thead><tr>'
        +th.map((c,i)=>'<th style="text-align:'+(al[i]||'left')+'">'+c+'</th>').join('')
        +'</tr></thead><tbody>';
      for(const r of lines.slice(2)){
        if(!/\|/.test(r)) continue;
        const cs=cell(r);
        t+='<tr>'+cs.map((c,i)=>'<td style="text-align:'+(al[i]||'left')+'">'+c+'</td>').join('')+'</tr>';
      }
      out.push(t+'</tbody></table></div>'); continue;
    }
    if(mode===2){ if(tag) pend=tag; continue; }
    pend='';
    if(/^[-*] /.test(lines[0])){                 // 목록 — 들여쓴 줄은 앞 항목에 붙인다
      const items=[];
      for(const l of lines){
        if(/^[-*] /.test(l)) items.push(l.replace(/^[-*] /,''));
        else if(items.length) items[items.length-1]+='\n'+l.trim();
      }
      out.push('<ul class="bul">'+items.map(t=>'<li>'+ink(t)+'</li>').join('')+'</ul>');
      continue;
    }
    let h=ink(b);
    if(C.dlg){                                   // 대화 줄나눔
      const nq=(b.match(QOPEN)||[]).length;
      if(nq>=2) h=h.replace(DLG,'<br>');
    }
    out.push('<p'+U(unit)+'>'+mk(tag)+h+'</p>');
  }
  return out.join('');
}

/* 팔리 진단부호를 벗겨 둔다 — vessantara 로도 Vessantara 를 찾게 */
let IDX=null;
const DIA={'ā':'a','ī':'i','ū':'u','ṃ':'m','ṁ':'m','ṅ':'n','ñ':'n','ṭ':'t','ḍ':'d',
           'ṇ':'n','ḷ':'l','ṣ':'s','ś':'s','ṛ':'r','ē':'e','ō':'o'};
/* 글자 수가 바뀌지 않게 한 글자씩 바꾼다 — 조각 잘라 낼 자리가 어긋나지 않도록 */
const flat=s=>s.toLowerCase().replace(/[āīūṃṁṅñṭḍṇḷṣśṛēō]/g,c=>DIA[c]);
function buildIdx(){
  IDX={};
  for(const r in D.docs){ const d=D.docs[r]; IDX[r]=flat(d.t+' '+d.p+' '+d.c); }
}
function runFind(){
  const R=$('res'); if(!R) return;
  const k=flat(q.trim());
  if(k.length<2){ R.innerHTML='<div class="empty">두 글자 이상 넣어 주세요.<br>'
    +D.nfile.toLocaleString()+'편을 통째로 뒤집니다.<br><small>팔리는 진단부호 없이 넣어도 됩니다 — vessantara</small></div>'; return; }
  if(!IDX) buildIdx();
  const hits=[];
  for(const r in D.docs){
    const i=IDX[r].indexOf(k);
    if(i<0) continue;
    const d=D.docs[r], full=d.t+' '+d.p+' '+d.c;
    const s=Math.max(0,i-18);
    hits.push([r, full.slice(s,Math.min(full.length,i+130)), i<(d.t+' '+d.p).length?0:1]);
  }
  hits.sort((a,b)=>a[2]-b[2]);
  if(!hits.length){ R.innerHTML='<div class="empty">찾지 못했습니다.</div>'; return; }
  const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  R.innerHTML='<div class="crumb">'+hits.length.toLocaleString()+'편</div><ul class="nav">'+
    hits.slice(0,400).map(([r,sn])=>{
      const d=D.docs[r];
      // 진단부호를 벗긴 자리에 맞춰 표시
      let out='', fl=flat(sn), p=0, j;
      while((j=fl.indexOf(k,p))>=0){ out+=esc(sn.slice(p,j))+'<mark>'+esc(sn.slice(j,j+k.length))+'</mark>'; p=j+k.length; }
      out+=esc(sn.slice(p));
      return '<li data-doc="'+r+'"><div class="lb"><b>'+esc(disp(r))+'</b><small>'+out+'</small></div></li>';
    }).join('')+(hits.length>400?'<li style="justify-content:center;color:var(--dim)">앞 400편만 보입니다</li>':'')+'</ul>';
}

async function checkUpdate(){
  const m=$('updm'); if(!m) return;
  if(!location.protocol.startsWith('http')){
    m.textContent='이 판은 파일 하나로 되어 있어 확인할 수 없습니다'; return; }
  m.textContent='확인하는 중…';
  try{
    const r=await fetch('data.bin',{cache:'reload'});
    if(!r.ok) throw new Error(String(r.status));
    const nd=JSON.parse(await unzip(new Uint8Array(await r.arrayBuffer())));
    if(nd.ver===D.ver && nd.nfile===D.nfile){
      m.textContent='이미 가장 새것입니다 ('+D.ver+' 판 · '+D.nfile.toLocaleString()+'편)'; return; }
    m.textContent=nd.nfile.toLocaleString()+'편 ('+nd.ver+' 판) — 받아서 다시 엽니다';
    if('caches' in window){
      for(const k of await caches.keys()){
        const c=await caches.open(k);
        await c.delete('./data.bin').catch(()=>{});
        await c.delete(new URL('data.bin',location).href).catch(()=>{});
      }
    }
    try{ const reg=await navigator.serviceWorker.getRegistration(); if(reg) await reg.update(); }catch(e){}
    setTimeout(()=>location.reload(), 900);
  }catch(err){ m.textContent='확인하지 못했습니다 — '+err.message; }
}

/* 폰의 뒤로가기 단추가 앱 안에서 한 칸씩 물러나게 한다.
   가는 곳마다 history 에 한 칸을 쌓아 두어야 뒤로가기가 앱을 빠져나가지 않는다. */
const snap=()=>({path:path.slice(), cur, tab, q});
const hashNow=()=> cur? '#'+idOf(cur) : location.pathname+location.search;
function push(fn){
  // 지금 화면의 스크롤 자리를 먼저 갈무리해 둔다 — 돌아왔을 때 그 자리로
  try{ history.replaceState(Object.assign(snap(),{y:scrollY}),'',hashNow()); }catch(e){}
  fn();
  try{ history.pushState(snap(),'',hashNow()); }catch(e){}
  render();
}
function restore(s){
  path=(s.path||[]).slice(); cur=s.cur||null; tab=s.tab||'tree'; q=s.q||'';
  render();
  try{ history.replaceState(s,'',hashNow()); }catch(e){}
  if(s.y) setTimeout(()=>scrollTo(0,s.y),0);
}
/* 주소창에서 # 뒤만 바꾸면 브라우저는 페이지를 다시 읽지 않는다.
   그때는 hashchange 만 오므로 여기서 받아 그 경을 연다. */
addEventListener('hashchange',()=>{
  const h=location.hash.replace(/^#/,'');
  if(!h){ if(cur){ cur=null; render(); } return; }
  const r=byId(h);
  if(!r){ toast('그런 이름의 경을 찾지 못했습니다'); return; }
  if(r===cur) return;
  cur=r; tab='tree';
  hits[r]=(hits[r]||0)+1; S.set('hits',hits);
  recent=[r].concat(recent.filter(x=>x!==r)).slice(0,60); S.set('recent',recent);
  render();
  try{ history.replaceState(snap(),'',hashNow()); }catch(e){}
});
addEventListener('popstate',e=>{
  const box=$('install');
  if(box && box.classList.contains('show')){ box.classList.remove('show');
    try{ history.pushState(snap(),''); }catch(err){} return; }
  if(e.state) restore(e.state);
});

function open(r){
  push(()=>{
    cur=r;
    hits[r]=(hits[r]||0)+1; S.set('hits',hits);
    recent=[r].concat(recent.filter(x=>x!==r)).slice(0,60); S.set('recent',recent);
  });
}
const hit=r=>hits[r]? '<span class="hit">'+hits[r]+'</span>' : '';
/* M_UD_01_001_빠타마보디  +  「빠타마보디 (첫 번째 깨달음)」
   → M_UD_01_001_빠타마보디 (첫 번째 깨달음)   ← 설정에서 끌 수 있다 */
/* ── 경마다 주소를 준다 — 카톡으로 링크를 보내면 그 경이 바로 열린다 ── */
let ID=null, BYID=null;
function h32(s){ let h=5381; for(let i=0;i<s.length;i++) h=((h*33)^s.charCodeAt(i))>>>0; return h.toString(36); }
function buildId(){
  const cnt={}; ID={}; BYID={};
  for(const r in D.docs){ const n=D.docs[r].n||''; const i=n.lastIndexOf('_');
    const c=i>0?n.slice(0,i):n; cnt[c]=(cnt[c]||0)+1; }
  for(const r in D.docs){
    const d=D.docs[r], n=d.n||'', i=n.lastIndexOf('_'), c=i>0?n.slice(0,i):n;
    // 겹치지 않고 아스키인 코드면 그대로, 아니면 경로에서 뽑은 짧은 이름
    const id=(cnt[c]===1 && /^[!-~]+$/.test(c))? c : ('x'+h32(r));
    ID[r]=id; BYID[id.toLowerCase()]=r;
    if(n && !BYID[n.toLowerCase()]) BYID[n.toLowerCase()]=r;   // 파일명 전체로도
  }
}
const idOf=r=>{ if(!ID) buildId(); return ID[r]||''; };
function byId(h){
  if(!BYID) buildId();
  h=decodeURIComponent(String(h||'')).replace(/^[#\/]+/,'').replace(/\.md$/i,'').trim();
  if(!h) return null;
  if(BYID[h.toLowerCase()]) return BYID[h.toLowerCase()];
  for(const r in D.docs){ const d=D.docs[r];             // bilara 이름으로도 (ud1.1 · ja547)
    if((d.c||'').indexOf('bilara: '+h)>=0) return r; }
  return null;
}
const base=()=>location.origin+location.pathname.replace(/index\.html$/,'').replace(/s\/[^/]*$/,'');
const linkOf=r=> C.plink ? base()+'s/'+idOf(r)+'.html' : base()+'#'+idOf(r);
function disp(r){
  const d=D.docs[r]; if(!d) return '';
  if(!C.code) return d.t;
  const n=d.n||'', i=n.lastIndexOf('_');
  return i>0 ? n.slice(0,i+1)+d.t : d.t;
}
document.addEventListener('click',e=>{
  const li=e.target.closest('[data-doc]');   if(li){ open(li.dataset.doc); return; }
  const sn=e.target.closest('[data-soon]');
  if(sn){ toast(sn.dataset.soon+' — 아직 옮기지 않았습니다'); return; }
  const dr=e.target.closest('[data-dir]');
  if(dr){ push(()=>{ const k=dr.dataset.dir, par=D.nodes[k]&&D.nodes[k].p;
    if(!path.length && par) path.push(par);          // 첫 화면에서 바로 들어올 때 갈래를 끼워 넣는다
    path.push(k); }); return; }
  const up=e.target.closest('[data-up]');
  if(up){ push(()=>{ path=path.slice(0,+up.dataset.up+1); cur=null; }); return; }
  const sg=e.target.closest('[data-k]');
  if(sg){ const k=sg.dataset.k; let v=sg.dataset.v;
    if(k==='mode'){ mode=+v; C.mode=+v; } else C[k]= isNaN(+v)? v : +v;
    apply(); viewSet(); return; }
  const fz=e.target.closest('[data-fs]');
  if(fz){ const d=+fz.dataset.fs; if(d) C.fs=Math.max(13,Math.min(28,C.fs+d)); else C.fs=DEF.fs;
    apply(); viewSet(); return; }
  if(e.target.closest('#upd')){ checkUpdate(); return; }
  if(e.target.closest('#clr')){
    const m=$('clrm');
    if(m && m.dataset.ok){ hits={}; S.set('hits',hits); viewSet(); }
    else if(m){ m.textContent='한 번 더 누르면 모두 지웁니다'; m.dataset.ok='1'; }
    return; }
  const gg=e.target.closest('[data-go]');
  if(gg){ push(()=>{ tab=gg.dataset.go; cur=null; }); return; }
  const lk=e.target.closest('[data-link]');
  if(lk){ e.preventDefault();
    const n=lk.dataset.link;
    for(const r in D.docs) if(D.docs[r].n===n){ open(r); return; }
    return; }
});
/* ── 홈 · 뒤로(트리 위로) ─────────────────── */
function chain(k){ const a=k.split('/'), o=[]; for(let i=0;i<a.length;i++) o.push(a.slice(0,i+1).join('/')); return o; }
function goHome(){
  if(!cur && tab==='tree' && !path.length) return;
  push(()=>{ cur=null; tab='tree'; path=[]; q=''; });
}
function goUp(){
  if(cur){                                   // 경을 보는 중 → 그 경이 든 갈래로
    const par=cur.split('/').slice(0,-1).join('/');
    push(()=>{ cur=null; tab='tree'; path= par&&D.nodes[par]? chain(par):[]; });
    return;
  }
  if(tab!=='tree'){ push(()=>{ tab='tree'; }); return; }   // 찾기·설정 → 차례로
  if(path.length) push(()=>{ path.pop(); });
}
$('star').onclick=()=>{
  if(!cur) return;
  stars = stars.includes(cur)? stars.filter(x=>x!==cur) : [cur].concat(stars);
  S.set('stars',stars); $('star').textContent=stars.includes(cur)?'★':'☆';
};
$('mode').onclick=()=>{ mode=(mode+1)%3; C.mode=mode; apply(); viewDoc();
  $('mode').textContent=['⇄','한','P'][mode]; };
$('top').onclick=()=>scrollTo({top:0,behavior:'smooth'});
/* ── 골라 베끼기 · 보내기 ───────────────────── */
let PICK=new Set(), PMODE='ko', PSUPP=0;
const HTML=document.documentElement;
function pickRefresh(){
  const on=PICK.size>0;
  HTML.classList.toggle('picking',on);
  $('pick').style.display = on?'':'none';
  $('fabs').style.display = (cur&&!on)?'flex':'none';
  $('pn').textContent=PICK.size;
  document.querySelectorAll('article p[data-u]').forEach(p=>
    p.classList.toggle('sel',PICK.has(p.dataset.u)));
}
function pickToggle(u){
  if(PICK.has(u)) PICK.delete(u); else PICK.add(u);
  pickRefresh();
}
function pickOff(){ PICK.clear(); pickRefresh(); }
/* 고른 단위를 글로 뽑는다 — 화면 모드와 상관없이 원본에서 다시 만든다 */
function pickText(){
  const d=D.docs[cur]; if(!d) return '';
  const keep=[...PICK];
  const save=mode, out=[];
  const grab=m=>{ mode=m; const h=md2html(d.c,''); mode=save;
    const box=document.createElement('div'); box.innerHTML=h;
    const map={};
    box.querySelectorAll('p[data-u]').forEach(p=>{
      const u=p.dataset.u; if(!keep.includes(u)) return;
      p.querySelectorAll('.mkin').forEach(x=>x.remove());
      p.querySelectorAll('br').forEach(x=>x.replaceWith('\n'));
      const t=p.textContent||'';
      if(t.trim()) (map[u]=map[u]||[]).push(t.trim());
    });
    return map;
  };
  const order=[];
  document.querySelectorAll('article p[data-u]').forEach(p=>{
    if(PICK.has(p.dataset.u) && !order.includes(p.dataset.u)) order.push(p.dataset.u);
  });
  if(PMODE==='both'){
    const pa=grab(2), ko=grab(1);
    for(const u of order){
      const a=(pa[u]||[]).join(' '), b=(ko[u]||[]).join(' ');
      out.push([u+' '+a, b].filter(Boolean).join('\n'));
    }
    return out.join('\n\n');
  }
  const m=grab(PMODE==='pa'?2:1);
  for(const u of order){ const t=(m[u]||[]).join(' '); if(t) out.push(u+' '+t); }
  return out.join('\n\n');
}
function pickPayload(){
  const d=D.docs[cur];
  const body=pickText();
  const src='— '+(d.t||disp(cur))+(d.s?' · '+d.s.split(' / ').slice(1).join(' ')||'':'');
  return body+'\n\n'+src.trim()+'\n'+linkOf(cur);
}
document.addEventListener('click',e=>{
  const seg=e.target.closest('#pick [data-pm]');
  if(seg){ PMODE=seg.dataset.pm;
    document.querySelectorAll('#pick [data-pm]').forEach(b=>b.classList.toggle('on',b===seg));
    return; }
  if(PSUPP){ PSUPP=0; e.preventDefault(); e.stopPropagation(); return; }
  if(!PICK.size) return;
  const p=e.target.closest('article p[data-u]');
  if(p && !e.target.closest('a')){ e.preventDefault(); pickToggle(p.dataset.u); }
},true);
/* 길게 누르면 고르기가 시작된다 */
(function(){
  let t=null, sx=0, sy=0;
  const start=e=>{
    const p=e.target.closest('article p[data-u]'); if(!p) return;
    const pt=e.touches?e.touches[0]:e; sx=pt.clientX; sy=pt.clientY;
    t=setTimeout(()=>{ t=null; PSUPP=1;
      if(navigator.vibrate) try{navigator.vibrate(12)}catch(_){}
      pickToggle(p.dataset.u);
      if(PICK.size===1) toast('눌러서 더 고르고, 아래에서 보내십시오');
    },480);
  };
  const move=e=>{ if(!t) return; const pt=e.touches?e.touches[0]:e;
    if(Math.abs(pt.clientX-sx)>10||Math.abs(pt.clientY-sy)>10){ clearTimeout(t); t=null; } };
  const end=()=>{ if(t){ clearTimeout(t); t=null; } };
  document.addEventListener('touchstart',start,{passive:true});
  document.addEventListener('touchmove',move,{passive:true});
  document.addEventListener('touchend',end);
  document.addEventListener('mousedown',start);
  document.addEventListener('mousemove',move);
  document.addEventListener('mouseup',end);
  document.addEventListener('contextmenu',e=>{
    const p=e.target.closest('article p[data-u]');
    if(p){ e.preventDefault(); pickToggle(p.dataset.u); }
  });
})();
$('poff').onclick=pickOff;
$('pall').onclick=()=>{
  const all=[...document.querySelectorAll('article p[data-u]')].map(p=>p.dataset.u);
  const uniq=[...new Set(all)];
  if(PICK.size>=uniq.length) PICK.clear(); else uniq.forEach(u=>PICK.add(u));
  pickRefresh();
};
$('pcopy').onclick=async()=>{
  const t=pickPayload();
  try{ await navigator.clipboard.writeText(t); toast(PICK.size+'곳을 베꼈습니다'); pickOff(); }
  catch(e){
    const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta);
    ta.select(); try{ document.execCommand('copy'); toast(PICK.size+'곳을 베꼈습니다'); pickOff(); }
    catch(_){ toast('베끼지 못했습니다'); } ta.remove();
  }
};
$('pshare').onclick=async()=>{
  const t=pickPayload();
  if(navigator.share){
    try{ await navigator.share({text:t}); pickOff(); return; }
    catch(e){ if(e&&e.name==='AbortError') return; }
  }
  try{ await navigator.clipboard.writeText(t); toast('보내기가 안 되어 베껴 두었습니다'); pickOff(); }
  catch(e){ toast('보내지 못했습니다'); }
};

$('shr').onclick=async()=>{
  if(!cur) return;
  const u=linkOf(cur);
  // 주소만 보낸다. 제목과 줄거리는 미리보기 카드가 스스로 보여 준다.
  if(navigator.share){
    try{ await navigator.share({url:u}); return; }
    catch(e){ if(e && e.name==='AbortError') return; }
  }
  try{ await navigator.clipboard.writeText(u); toast('주소를 복사했습니다'); }
  catch(e){ toast(u); }
};
function toast(m){
  let t=$('toast');
  if(!t){ t=document.createElement('div'); t.id='toast'; document.body.appendChild(t); }
  t.textContent=m; t.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2600);
}
$('fontp').onclick=()=>{ C.fs=Math.min(28,C.fs+1); apply(); if(tab==='set'&&!cur) viewSet(); };
$('fontm').onclick=()=>{ C.fs=Math.max(13,C.fs-1); apply(); if(tab==='set'&&!cur) viewSet(); };
$('bold').onclick=()=>{ C.fw = C.fw>=700?400:700; apply(); if(tab==='set'&&!cur) viewSet(); };
function litTab(){
  const t2 = cur? '' : (tab==='star'||tab==='recent')? 'set' : (tab==='tree'? 'home' : tab);
  document.querySelectorAll('nav.tab button').forEach(x=>
    x.classList.toggle('on', (x.dataset.tab||x.dataset.act)===t2));
}
document.querySelectorAll('nav.tab button').forEach(b=>b.onclick=()=>{
  if(b.dataset.act==='home') return goHome();
  if(b.dataset.act==='up')   return goUp();
  if(b.dataset.tab===tab && !cur) return;
  push(()=>{ tab=b.dataset.tab; cur=null; });
});

/* ── 홈 화면에 추가 ─────────────────────── */
let defer=null;
addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); defer=e; });
const standalone=()=>matchMedia('(display-mode: standalone)').matches || navigator.standalone;
/* 카톡·네이버 같은 앱 속 브라우저 — 여기서는 홈 화면 추가가 안 된다 */
const INAPP=(()=>{ const u=navigator.userAgent;
  if(/KAKAOTALK/i.test(u))            return '카카오톡';
  if(/NAVER\(inapp/i.test(u))         return '네이버';
  if(/DaumApps|DaumDevice/i.test(u))  return '다음';
  if(/Instagram/i.test(u))            return '인스타그램';
  if(/FBAN|FBAV/i.test(u))            return '페이스북';
  if(/\bLine\//i.test(u))            return '라인';
  return '';
})();
function askInstall(){
  if(standalone() || S.get('noask',0)) return;
  const ios=/iP(hone|ad|od)/.test(navigator.userAgent);
  if(INAPP){                                       // 앱 속 브라우저 — 밖으로 나가는 길을 알려 준다
    const box=$('install');
    box.querySelector('.it').textContent=INAPP+' 안에서 보고 계십니다';
    box.querySelector('.id').innerHTML=
      '여기서는 홈 화면에 넣을 수 없습니다. 밖으로 한 번만 나가면 앱처럼 쓸 수 있습니다.'
      +'<ol><li>오른쪽 위 <b>⋮</b> (또는 <b>···</b>) 를 누르세요</li>'
      +'<li><b>「다른 브라우저로 열기」</b> — 크롬을 고르세요</li>'
      +'<li>크롬에서 다시 이 안내가 뜹니다. 그때 <b>홈 화면에 추가</b></li></ol>';
    box.querySelector('#iyes').textContent='알겠습니다';
    box.querySelector('#ino').textContent='그냥 보기';
    setTimeout(()=>box.classList.add('show'), 1500);
    return;
  }
  if(!defer && !ios) return;                       // 크롬이 아직 준비가 안 됐으면 넘어간다
  const box=$('install');
  if(ios) box.querySelector('.id').innerHTML=
    '사파리 아래쪽 공유 단추를 누르고<ol><li>「홈 화면에 추가」를 고르세요</li></ol>';
  if(ios) $('iyes').textContent='알겠습니다';
  setTimeout(()=>box.classList.add('show'), 1200);
}
$('ino').onclick=()=>{ S.set('noask',1); $('install').classList.remove('show'); };
$('iyes').onclick=async()=>{
  $('install').classList.remove('show');
  if(defer){ defer.prompt(); const r=await defer.userChoice; defer=null;
             if(r.outcome!=='accepted') S.set('noask',0); else S.set('noask',1); }
  else S.set('noask',1);
};

boot();
if('serviceWorker' in navigator && location.protocol.startsWith('http'))
  navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
